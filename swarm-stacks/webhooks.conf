# =============================================================================
# Portainer Webhook Mapping — GitOps Stack Redeploy
# =============================================================================
# Format: <compose-file-path>=<portainer-webhook-uuid>
#
# When a push to main changes a file matching the left side,
# the GitHub Actions workflow triggers the Portainer webhook on the right.
#
# To add a new stack:
#   1. Create stack in Portainer (Repository mode + Webhook enabled)
#   2. Copy the webhook UUID from Portainer
#   3. Add a line here: stacks/path/to/stack.yml=<uuid>
#   4. Commit and push — future changes auto-deploy
# =============================================================================

