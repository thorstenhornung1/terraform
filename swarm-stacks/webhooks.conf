# =============================================================================
# Portainer Webhook Mapping — GitOps Stack Redeploy
# =============================================================================
# Format: <compose-file-path>=<portainer-webhook-uuid>[,flags...]
#
# When a push to main changes a file matching the left side (or any file in
# the same directory for multi-file stacks), the GitHub Actions workflow
# triggers the configured deployment method.
#
# Flags (comma-separated after UUID):
#   ssh-deploy — Use direct SSH deploy to Swarm manager instead of Portainer webhook.
#                Required for stacks using Docker configs (immutable objects).
#                The workflow will: docker stack deploy --prune (content-hash naming).
#
#   lxc-deploy — Deploy via SSH to a dedicated LXC container (NOT Swarm).
#                Copies files via SCP and runs docker compose up -d.
#                Requires: host=<ip> flag to specify the target LXC.
#
# To add a new stack:
#   1. Create stack in Portainer (Repository mode + Webhook enabled)
#   2. Copy the webhook UUID from Portainer
#   3. Add a line here: stacks/path/to/stack.yml=<uuid>
#   4. Commit and push — future changes auto-deploy
# =============================================================================

