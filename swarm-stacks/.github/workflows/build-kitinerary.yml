# =============================================================================
# Build & Push kitinerary-extractor Image to GitHub Container Registry
# =============================================================================
# kitinerary-extractor is a thin Debian-based wrapper around the KDE
# kitinerary-extractor CLI (LGPL). Used by belegparser's travel-extraction
# adapter as a one-shot subprocess (stdin → schema.org JSON-LD → stdout).
#
# Source of truth for the Dockerfile: this repo (images/kitinerary-extractor/).
# Local-dev counterpart lives in belegparser repo at docker/kitinerary/ —
# its build.sh is explicitly NOT for production.
#
# Triggers:
#   - Push to main (Dockerfile or README change)
#   - Weekly schedule (debian:bookworm-slim CVE-refresh window)
#   - Manual dispatch (ad-hoc rebuild)
#
# Image: ghcr.io/thorstenhornung1/swarm-stacks/kitinerary-extractor
#   Tags published per build: latest, <YYYYMMDD>, <short-sha>
#   Consumers should pin by digest, not tag, for reproducible deploys.
# =============================================================================

name: Build kitinerary-extractor

on:
  push:
    branches: [main]
    paths:
      - 'images/kitinerary-extractor/**'
      - '.github/workflows/build-kitinerary.yml'
  schedule:
    # Tuesday 05:00 UTC — different day from build-pbs-client (Monday) and
    # build-patroni-postgres (varies) to stagger runner load across the week,
    # and after the Monday Debian security advisory cadence so the base
    # image typically has any new CVE patches.
    - cron: '0 5 * * 2'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/kitinerary-extractor

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64, homelab]
    # 30 min is generous — the image is small (debian-slim + 1 apt package)
    # and typically builds in 1-2 min. The buffer covers worst-case slow
    # apt-cacher refresh and BuildKit cold-cache.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/kitinerary-extractor
          file: images/kitinerary-extractor/Dockerfile
          # Pin micro-arch to x86-64-v3 (Haswell+) so the produced image
          # runs on homelab Intel i5 CPUs (no AVX-512). Matches the policy
          # established in swarm-stacks#9 / #12 — see build-patroni-postgres
          # for the original incident context. kitinerary itself is a
          # straight Debian package install (no -march=native compile),
          # so this pin is preventative, not load-bearing.
          platforms: linux/amd64/v3
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test — pull + run pushed image
        # Verifies the image we just pushed (a) actually exists in the
        # registry, (b) has a runnable ENTRYPOINT binary, (c) its shared
        # libs load. Catches exactly the class of bug that bit the first
        # build (ea8a831 / belegparser v0.6.1): wrong Debian package name
        # made the binary disappear, but the BUILD itself was still green.
        # `--help </dev/null` exits 0 on a healthy kitinerary-extractor
        # without consuming/producing user data. /dev/null on stdin so the
        # CLI's normal "read from stdin" mode does not hang the step.
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "::group::Smoke-test target"
          echo "$IMAGE_REF"
          echo "::endgroup::"
          docker pull "$IMAGE_REF"
          docker run --rm -i "$IMAGE_REF" --help </dev/null
          echo "::notice::Smoke test passed for $IMAGE_REF"

      - name: Print pulled digest (for consumer pinning)
        run: |
          echo "::notice::Image digest for consumer pinning: ${{ steps.build.outputs.digest }}"
          echo "Pinned reference:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
