# =============================================================================
# Build & Push email-oauth2-proxy Image to GitHub Container Registry
# =============================================================================
# Image: ghcr.io/thorstenhornung1/swarm-stacks/email-oauth2-proxy:latest
# =============================================================================

name: Build email-oauth2-proxy

on:
  push:
    branches: [main]
    paths:
      - 'images/email-oauth2-proxy/**'
      - '.github/workflows/build-email-oauth2-proxy.yml'
  schedule:
    # Weekly rebuild (python base patches + emailproxy updates)
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/email-oauth2-proxy

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: images/email-oauth2-proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed image
        run: |
          echo "Image pushed successfully:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
