# =============================================================================
# Build & Push pbs-backup-client Image to GitHub Container Registry
# =============================================================================
# Triggers:
#   - Push to main (changes to Dockerfile or entrypoint)
#   - Weekly schedule (picks up debian:bookworm-slim base image updates)
#   - Manual dispatch (for ad-hoc rebuilds)
#
# Image: ghcr.io/thorstenhornung1/swarm-stacks/pbs-backup-client:latest
# =============================================================================

name: Build pbs-backup-client

on:
  push:
    branches: [main]
    paths:
      - 'images/pbs-backup-client/**'
      - '.github/workflows/build-pbs-client.yml'
  schedule:
    # Weekly rebuild every Monday at 05:00 UTC to pick up base image patches
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pbs-backup-client

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64, homelab]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: images/pbs-backup-client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed image
        run: |
          echo "Image pushed successfully:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
