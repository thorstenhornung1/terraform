# =============================================================================
# Renovate (self-hosted) — Image-Tag-Updates fuer stacks/**/*-stack.yml
# =============================================================================
# Konfiguration: .github/renovate.json5 (nur docker-compose-Manager).
# Laeuft auf ubuntu-latest (GitHub-hosted): Renovate braucht NUR GitHub-API
# und Registry-Zugriff, KEINEN Cluster-Zugang — kein Grund, den Homelab-
# Runner-Pool zu belegen.
#
# Cron: TAEGLICH 04:30 Europe/Berlin zur Sommerzeit (02:30 UTC; zur
# Winterzeit faellt der Lauf auf 03:30 lokal — GitHub-Cron kennt keine
# Zeitzonen). Frueh am Morgen, damit die PRs beim ersten Kaffee da sind;
# Dependabot (Mittwoch, siehe dependabot.yml) bleibt davon unberuehrt.
#
# Voraussetzung: Repo-Secret RENOVATE_TOKEN — fine-grained PAT, nur dieses
# Repo, Permissions: Contents RW + Pull requests RW + Workflows RW.
# GITHUB_TOKEN reicht NICHT: dessen Pushes/PRs triggern keine weiteren
# Workflows (der Deploy nach PR-Merge kaeme sonst nie).
name: Renovate

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: "thorstenhornung1/swarm-stacks"
          RENOVATE_PLATFORM: github
          # Onboarding-PR unnoetig — .github/renovate.json5 liegt im Repo.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: info
