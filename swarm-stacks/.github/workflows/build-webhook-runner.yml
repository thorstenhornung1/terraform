# =============================================================================
# Build & Push webhook-runner Image to GitHub Container Registry
# =============================================================================
# Triggers:
#   - Push to main (changes to Dockerfile or scripts)
#   - Weekly schedule (picks up alpine base image updates)
#   - Manual dispatch (for ad-hoc rebuilds)
#
# Image: ghcr.io/thorstenhornung1/swarm-stacks/webhook-runner:latest
# =============================================================================

name: Build webhook-runner

on:
  push:
    branches: [main]
    paths:
      - 'images/webhook-runner/**'
      - '.github/workflows/build-webhook-runner.yml'
  schedule:
    # Weekly rebuild every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/webhook-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: images/webhook-runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed image
        run: |
          echo "Image pushed successfully:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
