# =============================================================================
# Build & Push taiga-openid Images to GitHub Container Registry
# =============================================================================
# Triggers:
#   - Push to main (changes to image sources or this workflow)
#   - Weekly schedule (picks up taigaio base image updates)
#   - Manual dispatch (for ad-hoc rebuilds)
#
# Images:
#   - ghcr.io/thorstenhornung1/swarm-stacks/taiga-back-openid:latest
#   - ghcr.io/thorstenhornung1/swarm-stacks/taiga-front-openid:latest
# =============================================================================

name: Build taiga-openid

on:
  push:
    branches: [main]
    paths:
      - 'images/taiga-openid/**'
      - '.github/workflows/build-taiga-openid.yml'
  schedule:
    # Weekly rebuild every Monday at 07:00 UTC (after patroni build at 04:00)
    - cron: '0 7 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-back:
    runs-on: [self-hosted, linux, x64, homelab]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/taiga-back-openid
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: images/taiga-openid/back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed image
        run: |
          echo "Image pushed successfully:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

  build-front:
    runs-on: [self-hosted, linux, x64, homelab]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/taiga-front-openid
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: images/taiga-openid/front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed image
        run: |
          echo "Image pushed successfully:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
