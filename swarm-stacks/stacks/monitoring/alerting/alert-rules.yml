# =============================================================================
# Grafana Alerting — Alert Rules
# =============================================================================
# Provisioned via Docker config at /etc/grafana/provisioning/alerting/
#
# All queries target VictoriaMetrics (Prometheus-compatible PromQL).
# Metric names verified against prometheus-scrape.yml job definitions.
#
# Design principles:
#   - Only alert on conditions requiring human attention
#   - Generous pending periods to avoid flap noise (5min warn, 2min crit)
#   - Group by infrastructure component for triage clarity
#   - Prefer rate/trend queries over instantaneous spikes
# =============================================================================
apiVersion: 1

groups:

  # ===========================================================================
  # DOCKER SWARM — Node Health
  # ===========================================================================
  # Source: node-exporter on 192.168.4.40-42 (job=node-exporter)
  # Instances: docker-infra-1, docker-infra-2, docker-infra-3

- orgId: 1
  name: Docker Swarm
  folder: Infrastructure
  interval: 60s
  rules:

      # --- Node unreachable (scrape target down) ---
  - uid: swarm-node-down
    title: Swarm node down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(up{job="node-exporter", instance!="postgres-prod"}[3m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 2m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Swarm node {{ $labels.instance }} is unreachable"
      description: "node_exporter scrape failed for 2+ minutes. Check if VM is running and Docker is healthy."

      # --- Root filesystem > 90% ---
      # 2026-08-25 instance!="postgres-prod" ergänzt. Der Job node-exporter
      # scrapet VIER Ziele, nicht drei: docker-infra-1/2/3 UND die DB-VM
      # postgres-prod (192.168.4.45, siehe prometheus-scrape.yml). Deren
      # Dateisysteme hat aber schon postgres-prod-disk-critical im Blick,
      # und zwar ALLE (fstype!~"tmpfs|overlay|squashfs", per min()), nicht
      # nur "/". Ohne diesen Filter meldete eine vollaufende DB-Platte
      # dreimal: swarm-disk-warning bei 80 % (warning),
      # postgres-prod-disk-critical bei 88 % (= "unter 12 % frei",
      # critical) und swarm-disk-critical bei 90 % (critical).
      #
      # Dasselbe Muster, das 6.4 der Alarm-Doku für up{job="node-exporter"}
      # gefunden hat (swarm-node-down ↔ postgres-prod-node-down, behoben in
      # 734a5fd) — für node_filesystem_* war es dort übersehen worden.
      #
      # Es entsteht kein blinder Fleck: postgres-prod-disk-critical deckt
      # mehr ab als diese Regel, nicht weniger. Wer sie je entfernt, muss
      # diesen Filter mit entfernen.
  - uid: swarm-disk-critical
    title: Disk space critical
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          100 - (
            node_filesystem_avail_bytes{job="node-exporter", instance!="postgres-prod", mountpoint="/", fstype!="tmpfs"}
            / node_filesystem_size_bytes{job="node-exporter", instance!="postgres-prod", mountpoint="/", fstype!="tmpfs"}
            * 100
          ) > 90
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 5m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "Disk usage > 90% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
      description: "Root filesystem is critically full. Docker images, logs, or data disk overflow are common causes."

      # --- Root filesystem > 80% ---
      # instance!="postgres-prod" wie bei swarm-disk-critical oben —
      # Begründung dort.
  - uid: swarm-disk-warning
    title: Disk space warning
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          100 - (
            node_filesystem_avail_bytes{job="node-exporter", instance!="postgres-prod", mountpoint="/", fstype!="tmpfs"}
            / node_filesystem_size_bytes{job="node-exporter", instance!="postgres-prod", mountpoint="/", fstype!="tmpfs"}
            * 100
          ) > 80
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Disk usage > 80% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
      description: "Investigate before it becomes critical. Check docker system prune or log rotation."

      # --- Data disk (/srv/data) > 85% ---
  - uid: swarm-datadisk-warning
    title: Data disk filling up
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          100 - (
            node_filesystem_avail_bytes{job="node-exporter", mountpoint="/srv/data", fstype!="tmpfs"}
            / node_filesystem_size_bytes{job="node-exporter", mountpoint="/srv/data", fstype!="tmpfs"}
            * 100
          ) > 85
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Data disk > 85% on {{ $labels.instance }}"
      description: "Docker data-root lives on /srv/data. Run docker system prune or check container volumes."

      # --- Sustained high CPU (>85% for 15 min) ---
  - uid: swarm-cpu-high
    title: Sustained high CPU usage
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])) * 100) > 85
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 15m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "CPU > 85% sustained on {{ $labels.instance }}"
      description: "High CPU for 15+ minutes. Check docker stats for runaway containers."

      # --- Sustained high memory (30-min avg > 90% for 20 min) ---
      # 2026-04-24: avg_over_time[30m] smoothed damit Spikes von strukturell-hoch
      # Baseline-Containers (dock01/Legacy) kein Rauschen machen. Nur wenn
      # wirklich 30min lang durchgängig Mittelwert >90% UND das 20min anhält.
      # Paart mit swarm-node-oom-kill (kritisch, deterministisch) — dies ist
      # der pre-event warning, oom-kill der post-event-critical-Alert.
  - uid: swarm-memory-high
    title: Memory usage sustained high
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          avg_over_time((100 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} * 100))[30m:1m]) > 90
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 20m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Memory avg(30m) > 90% on {{ $labels.instance }} (sustained 20+ min)"
      description: "Node hat durchgehend hohe Memory-Baseline. Siehe auch swarm-node-oom-kill falls bereits OOMs passiert. Strukturelle Fixe: Container-Memory-Limits anpassen, Legacy-Services reduzieren, Node-RAM vergrößern."

      # --- OOM-Kill detected on any Swarm node (post-event critical) ---
      # 2026-04-24: Kernel-deterministisches Signal — node_vmstat_oom_kill
      # steigt nur wenn der Kernel tatsächlich einen Prozess gekillt hat.
      # Kein Fehlalarm möglich. Feuert sofort (for: 0s) weil jede einzelne
      # OOM-Instanz operativ relevant ist. Analog zu frigate-lxc-oom aus der
      # Frigate NVR Group, aber für alle Swarm-Nodes.
  - uid: swarm-node-oom-kill
    title: Swarm node OOM-killed a process
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          increase(node_vmstat_oom_kill{job="node-exporter"}[10m]) > 0
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 0s
        # 2026-06-30: keep_firing_for entprellt — mehrere OOMs in kurzer Folge
        # (z.B. Memory-Druck-Welle) = EIN Alert-Fenster statt N Telegram (B-01).
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "OOM-kill on {{ $labels.instance }} in last 10min"
      description: "Kernel hat einen Prozess gekillt. Check 'dmesg | grep -i oom' auf dem Node für killed process + anon-rss. Siehe auch swarm-memory-high (pre-event warning)."

      # --- Dienst laeuft nicht in Sollstaerke (Vorfall vom 2026-08-25) ---
      # DIE Kernregel. paperless-webserver hing vier Stunden in Pending, ohne
      # dass etwas alarmierte — der Task war metrisch unsichtbar. Der Vergleich
      # Soll-Ist deckt beide Spielarten ab: Task haengt in pending UND "es gibt
      # gar keinen Task mehr" (so stand dashboard_docker-swarm-dashboard drei
      # Tage auf 0/1, nachdem sein Task rejected wurde — pending war dabei 0).
      # noDataState OK, NICHT Alerting: Faellt der Exporter aus, meldet das die
      # Regel swarm-exporter-stale — EINMAL, statt hier 54-mal.
  - uid: swarm-service-under-replicated
    title: Swarm service under-replicated
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: max by (service, stack) (swarm_service_replicas_desired - swarm_service_replicas_running)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [0]}
        refId: C
    for: 10m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Swarm-Dienst {{ $labels.service }} laeuft nicht in Sollstaerke ({{ $value }} Replica(s) fehlen)"
      description: "Seit 10 Minuten laufen weniger Tasks als vorgesehen. Wie lange schon, sagt swarm_service_task_blocked_seconds{service=\"{{ $labels.service }}\"}; den Grund `docker service ps {{ $labels.service }} --no-trunc`. Bei \"no suitable node\" zuerst swarm_node_memory_free_bytes ansehen."

      # --- Neustartschleife ---
      # Auf die Sollstaerke normiert, sonst meldete jeder globale Dienst nach
      # einem Cluster-Reschedule 3 (einen Task je Node). Gemessen waehrend eines
      # echten Reschedule-Sturms am 2026-08-25: hoechstens 2,0 — Schwelle 3
      # liegt sicher darueber.
      # Bewusst der zustandslose Gauge, nicht increase() auf einem Zaehler: Der
      # faellt beim Neustart des Exporters auf 0, und ein Neustart darf keine
      # Schleife vortaeuschen.
  - uid: swarm-task-restart-loop
    title: Swarm service restart loop
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 1800, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: max by (service, stack) (swarm_service_task_starts_recent / clamp_min(swarm_service_replicas_desired, 1))
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 1800, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [3]}
        refId: C
    for: 15m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Swarm-Dienst {{ $labels.service }} startet dauernd neu ({{ $value }} Tasks je Replica in 30 min)"
      description: "Der Dienst kommt hoch und stirbt wieder. `docker service ps {{ $labels.service }} --no-trunc` zeigt den Fehler, `docker service logs` bleibt bei Crashloops oft leer."

      # --- RBD-Failover-Falle: ein Node kann nicht alle RBD-Dienste tragen ---
      # Bindende Betreibervorgabe: "Alle Nodes muessen alles tragen koennen."
      # grafana, paperless-webserver und openarchiver-meili haengen per
      # node.labels.<name>-rbd == active an je einem Node. Faellt der aus,
      # schiebt der Watchdog das Label weiter — auf einen Node, der den Dienst
      # nicht starten kann, ist der Failover eine Falle statt eines Umzugs.
      # ACHTUNG: Diese Regel feuert beim Einspielen SOFORT. Messung 2026-08-25
      # nach dem Ballooning-Umbau: docker-infra-2 fehlten 383 MB (Grundlast
      # 4736 + RBD 2564 = 7300 gegen 6917 MB Kapazitaet). Das ist KEIN
      # Fehlalarm, sondern der Befund — und der wandert mit der Platzierung.
  - uid: swarm-node-rbd-failover-trap
    title: Node kann die RBD-Dienste nicht aufnehmen
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 1800, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: min by (node) (swarm_node_can_host_all_rbd)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 1800, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: lt, params: [1]}
        refId: C
    for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.node }} koennte die RBD-gebundenen Dienste nicht aufnehmen"
      description: "Wie viel fehlt, sagt swarm_node_rbd_headroom_bytes{node=\"{{ $labels.node }}\"} (negativ = Fehlbetrag). Ein RBD-Failover auf diesen Node wuerde den Dienst nicht starten, sondern toeten. Abhilfe: Reservierungen senken, Dienste umverteilen oder VM-RAM erhoehen — nach einer RAM-Aenderung muss der Node dem Swarm NEU beitreten, sonst bleibt die eingefrorene Kapazitaet stehen."

      # --- Ausfall eines Nodes waere nicht aufzufangen ---
      # Summenrechnung, keine Packungspruefung: <0 heisst sicher "passt nicht",
      # >=0 heisst nur "die Summe reicht". Bewusst so — die Zahl soll im Kopf
      # nachrechenbar bleiben.
  - uid: swarm-node-failover-capacity
    title: Cluster verkraftet den Ausfall eines Nodes nicht
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 1800, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: min by (node) (swarm_node_failover_ok)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 1800, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: lt, params: [1]}
        refId: C
    for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Ausfall von {{ $labels.node }} waere nicht aufzufangen"
      description: "Die bewegliche Last dieses Nodes passt nicht auf die uebrigen. Fehlbetrag: swarm_node_failover_headroom_bytes{node=\"{{ $labels.node }}\"}. Ein geplanter Reboot dieses Nodes wuerde Dienste in Pending schicken."

      # --- Sentinel: Exporter lebt, sieht aber die Docker-API nicht mehr ---
      # Der Exporter behaelt bei einem API-Ausfall bewusst den letzten Stand,
      # statt alle ~740 Serien verschwinden zu lassen (das waere ein Alarmsturm
      # statt einer Meldung). Dass die Zahlen einfrieren, sagt genau diese Regel.
      # Als EINZIGE der swarm-Regeln mit noDataState:Alerting — hier IST die
      # fehlende Metrik der Ausfall.
  - uid: swarm-exporter-stale
    title: Swarm-Metriken sind eingefroren
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: time() - max(swarm_exporter_last_refresh_timestamp_seconds)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [300]}
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "swarm-exporter liefert seit {{ $value }}s keine frischen Daten"
      description: "Alle swarm_*-Werte sind veraltet — der Swarm ist wieder unbeobachtet. Erst swarm_exporter_refresh_errors_total ansehen, dann den docker-socket-proxy im traefik-Stack (`docker service ps traefik_docker-socket-proxy`)."

# =============================================================================
# ALERTING SELF-MONITORING — wer bewacht den Waechter?
# =============================================================================
# Grafana wurde bis 2026-08-25 selbst nicht gescrapt: grafana_* lieferte 0
# Serien. Damit war unmessbar, ob Alarmregeln ueberhaupt ausgewertet werden und
# ob Telegram die Nachrichten annimmt. Eine Regel, die stumm scheitert, schuetzt
# nichts — und schweigt dabei.
# Quelle: job=grafana (prometheus-scrape.yml), Endpunkt monitoring_grafana:3000

- orgId: 1
  name: Alerting Self-Monitoring
  folder: Infrastructure
  interval: 60s
  rules:

      # --- Ein Ziel wird nicht mehr gescrapet ---
      # Sentinel fuer die beiden neuen Jobs. Ohne ihn gingen die Regeln darunter
      # still auf NoData.
  - uid: monitoring-target-down
    title: Scrape-Ziel nicht erreichbar
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: min by (job) (min_over_time(up{job=~"swarm-exporter|grafana"}[5m]))
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: lt, params: [1]}
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "Scrape-Ziel {{ $labels.job }} antwortet nicht"
      description: "vmagent erreicht das Ziel seit 5 Minuten nicht. Bei job=grafana ist die Alarmauswertung selbst unbeobachtet, bei job=swarm-exporter der Swarm."

      # --- Alarmregeln werden nicht ausgewertet ---
      # Alarmiert wird auf den ZUWACHS, nicht auf den Stand — der Zaehler laeuft
      # ab Containerstart und traegt alte Fehler mit.
  - uid: grafana-rule-evaluation-failing
    title: Grafana wertet Alarmregeln nicht aus
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 1200, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: sum(increase(grafana_alerting_rule_evaluation_failures_total[15m])) or vector(0)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 1200, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [0]}
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "{{ $value }} fehlgeschlagene Regelauswertungen in 15 Minuten"
      description: "Betroffene Regeln stehen in Grafana unter Alerting > Alert rules mit Status Error. Haeufigste Ursache: Datenquelle langsam oder PromQL nach einem Metrik-Umbau ungueltig."

      # --- Telegram nimmt die Nachrichten nicht an ---
      # Hier haengt alles dran: Nimmt Telegram nicht an, ist JEDER andere Alarm
      # wirkungslos. Deshalb als einziger dieser Gruppe critical.
      # `or vector(0)` ist PFLICHT: Nachgeprueft 2026-08-25 — nach einem
      # Grafana-Neustart existiert die Serie erst wieder, wenn die erste
      # Benachrichtigung versucht wurde. Ohne den Zusatz stuende die Regel bis
      # dahin auf NoData.
  - uid: grafana-notifications-failing
    title: Zustellung an Telegram schlaegt fehl
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 1200, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: sum(increase(grafana_alerting_notification_requests_failed_total[15m])) or vector(0)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 1200, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [0]}
        refId: C
    for: 5m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "{{ $value }} fehlgeschlagene Telegram-Zustellungen in 15 Minuten"
      description: "Solange das anhaelt, erreicht KEIN Alarm mehr sein Ziel. Bot-Token und Chat-ID pruefen (Docker-Secrets grafana_telegram_bot_token / _chat_id) sowie den ausgehenden Weg zu api.telegram.org."

      # --- Regeln stehen auf NoData ---
      # Genau der Fehler vom 2026-08-24, der 18 von 64 Regeln dauerhaft falsch
      # feuern liess: Ein PromQL-Vergleich filtert die gesunden Serien weg, die
      # Regel sieht NoData, und mit noDataState:Alerting wird daraus ein
      # Daueralarm. Diese Regel macht den Zustand sichtbar, statt ihn zu
      # wiederholen.
  - uid: grafana-rules-nodata
    title: Alarmregeln stehen auf NoData
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 900, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: sum(grafana_alerting_alerts{state="nodata"}) or vector(0)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 900, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [0]}
        refId: C
    for: 15m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "{{ $value }} Alarmregel(n) liefern keine Daten"
      description: "Die Regel bewacht nichts mehr. Meist filtert ein PromQL-Vergleich im Gesundzustand alle Serien weg — dann Vergleich raus und Schwelle in den threshold-Schritt."

  # ===========================================================================
  # CEPH STORAGE — Cluster Health
  # ===========================================================================
  # Source: ceph mgr prometheus module on 192.168.12.10-12 (job=ceph)
  # Only the active mgr responds; honor_labels=true handles failover.

- orgId: 1
  name: Ceph Storage
  folder: Infrastructure
  interval: 60s
  rules:

      # --- i915-GPU-Livelock-Frühwarnung (PVE-Hosts) ---
      # Vorfälle pve03 27.06. + pve01 17.07.2026: Der GEM-Shrinker gerät unter
      # Memory-Druck (vzdump-Fenster) in einen Livelock — "Purging GPU memory"-
      # Sturm im Kernel-Log, Minuten später friert der HOST ein (Hard-Stop aller
      # Guests). Quelle: /usr/local/sbin/i915-guard.sh (systemd-Timer 60s auf
      # pve01-03) pusht die Zeilenzahl der letzten ~70s als i915_purge_lines
      # an den InfluxDB-Ingest. Schwelle 100: normale Shrinker-Aktivität sind
      # einzelne Zeilen; die Vorfall-Stürme lagen bei >1000/min. for: 0s —
      # das Warnfenster vor dem Freeze beträgt nur Minuten, jede Minute zählt.
  - uid: pve-i915-livelock-warning
    title: i915 GPU livelock warning (PVE host)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max_over_time(i915_purge_lines_value[3m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [100]
        refId: C
    for: 0s
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "PVE-Host {{ $labels.host }}: i915-Livelock kündigt sich an ({{ $values.A.Value }} Purging-Meldungen/min)"
      description: "GEM-Shrinker-Sturm auf {{ $labels.host }} — Host droht binnen Minuten einzufrieren (Muster 27.06./17.07.). SOFORT: Memory-Druck senken (laufenden vzdump abbrechen: qm/vzdump-Prozess prüfen), Guests notfalls migrieren. RCA-Logs: /root/rca-*-i915-*.log. Kernel-Fix-Status: proxmox-kernel 7.0.14 via daily-maintenance."

      # --- Ceph health not OK ---
      # ceph_health_status: 0=OK, 1=WARN, 2=ERR
  - uid: ceph-health-error
    title: Ceph cluster unhealthy
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
              # 2026-06-30: max(...) aggregiert die 3 MON-Scrape-Instanzen — eine
              # STALE mgr-Series (z.B. nach mgr-Failover/Crash) kann sonst einen
              # falschen HEALTH_ERR-Critical auslösen. Eine Cluster-Lage = 1 Alert.
        expr: max(ceph_health_status)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1.5
        refId: C
        # 2026-06-13: for 2m→5m — HEALTH_ERR ist eine Enum, die bei Rebalance/
        # transienten OSD-Stalls kurz oszilliert; 5m verlangt anhaltenden Fehler.
    for: 5m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Ceph cluster is in HEALTH_ERR state"
      description: "Data integrity at risk. Check ceph status on any Proxmox node immediately."

      # --- Ceph health warning (sustained) ---
      # 2026-04-24: min_over_time + längeres for, weil BlueStore-slow-op-alerts
      # intrinsisch im ~10-15min-Rhythmus flappen (osd.2 NVMe-Thermal-Throttling
      # auf pve01, nvme0n1 Sensor 2 = 73°C idle → unter Last Throttle → slow ops).
      # Nur firen wenn WARN durchgehend für 30min+20min=50min — filtert die
      # thermal-throttle-Oszillation, lässt echte sustained issues durch.
  - uid: ceph-health-warning
    title: Ceph cluster warning
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
              # 2026-06-30: max(...) über die 3 MON-Instanzen (stale-mgr-sicher).
        expr: max(min_over_time(ceph_health_status[15m])) == 1
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 20m
    noDataState: OK
    execErrState: OK
    labels:
          # 2026-06-30: warning→info — HEALTH_WARN ist hier ein GELATCHTER Zustand
          # (slow-ops/BlueFS-Indikatoren + alter mgr-Crash klären sich nicht selbst,
          # Wurzel = osd.2-NVMe-Kühlung). Als 'info' nur 12h-Digest-Takt statt 4h →
          # raus aus dem Dauer-Rauschen, bleibt aber sichtbar. ceph-health-error
          # (critical) bleibt scharf für echte ERR-Lagen.
      severity: info
    annotations:
      summary: "Ceph cluster is in HEALTH_WARN state (sustained)"
      description: "HEALTH_WARN für 15+20=35min durchgehend. Check 'ceph health detail'. Bei BLUESTORE_SLOW_OP_ALERT auf osd.2 (pve01 nvme0n1): thermal throttling (Sensor 2 Warning), NVMe braucht Heatsink/bessere Kühlung."

      # --- OSD down ---
  - uid: ceph-osd-down
    title: Ceph OSD down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: count(ceph_osd_up == 0) or vector(0)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 3m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "One or more Ceph OSDs are down"
      description: "Data redundancy reduced. With 3 OSDs and replication factor 3, one OSD down means no further failures tolerated."

      # --- Ceph pool near full (>80%) ---
  - uid: ceph-pool-nearfull
    title: Ceph pool filling up
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          ceph_pool_percent_used > 0.85
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Ceph pool {{ $labels.pool_id }} > 85% full"
      description: "Ceph enters read-only at ~95%. Clean up or expand storage."

  # ===========================================================================
  # PVE HOSTS — Memory-Pressure- & Freeze-Frühwarnung, Hostgesundheit
  # ===========================================================================
  # ZWEI Quellen, bewusst nebeneinander:
  #
  # 1) PVE-Status-Push (/etc/pve/status.cfg → InfluxDB-Proto an
  #    VictoriaMetrics :8428, ~10s-Takt via pvestatd). Serien object="nodes",
  #    host=pve01/02/03 — u.a. memory_memavailable (= echtes MemAvailable der
  #    HOSTS). Trägt pve-host-memory-pressure und pve-host-metrics-stale.
  # 2) node-exporter auf den Hosts (job=pve-node-exporter, seit 2026-08-23,
  #    ausgerollt von ansible/pve-monitoring.yml). Liefert alles, was der Push
  #    nicht kennt: CPU je Modus, Dateisysteme, Netzzähler, Temperaturen und
  #    node_vmstat_oom_kill.
  #
  # Die Trennung ist kein Zufall: fällt eine der beiden Pipelines aus, sieht
  # die andere es. Ein Freeze-Detektor, der an derselben Leitung hängt wie
  # alles andere, meldet den Freeze nur, solange es keinen gibt.
  # Ergänzt pve-i915-livelock-warning (Ceph-Storage-Gruppe). Vorfälle
  # 2026-08-08 (2× an EINEM Tag):
  #   - pve01 13:35 CEST: vzdump 13:30 lief 22min (üblich 2-3min) →
  #     MemAvailable 2.5→0.8 GiB → Purge-Sturm 2628-5371 Zeilen/min →
  #     11min Metrik-Lücke, Host erholte sich.
  #   - pve03 06:07 CEST: KEIN Purge-Sturm im Journal, MemAvailable ~3 GiB,
  #     nur i915-guard-Timer-Drift ab 06:02 — Host fror still ein und blieb
  #     ~6h unbemerkt tot (Hard-Reset erst 12:23). Der i915-Zähler allein
  #     deckt diesen Fall NICHT ab.

- orgId: 1
  name: PVE Hosts
  folder: Infrastructure
  interval: 60s
  rules:

      # --- MemAvailable kritisch niedrig (Livelock-Vorstufe) ---
      # Schwellwert-Herleitung (7d-Daten, ~10s-Samples, Stand 2026-08-09):
      #   Normalbetrieb-Baseline: pve01 ~3.0 / pve02 ~4.8 / pve03 ~2.5 GiB.
      #   Routine-vzdump-Dip: ~2min auf ~1.1 GiB → avg[5m] bleibt >2 GiB.
      #   Samples <1.25 GiB in 7d: ≤2 je Host (nur die Vorfälle selbst).
      #   Rückwärts-Query Vorfall pve01 08.08. 11:35Z: avg[5m]=0.99 GiB → feuert;
      #   Routine-Backups feuern NICHT (verifiziert 08-07 05:31Z Dip).
      # avg_over_time[5m] statt `for: 5m` BEWUSST: im Livelock reißt der
      # Metrik-Push ab (pve01: 11min Lücke) — eine for:-Pending-Phase würde
      # durch noData resetten; das Query-Fenster hält die letzten Low-Samples
      # und feuert auch noch in der Stille direkt nach Livelock-Beginn.
      # for: 0s + severity critical: das Warnfenster vor dem Freeze beträgt
      # Minuten — warning läge im Digest (Zustellung nur 08:00/18:00) und
      # käme zu spät (gleiches Verschleppungs-Argument wie ollama-down).
  - uid: pve-host-memory-pressure
    title: PVE host memory pressure (MemAvailable low)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: avg_over_time(memory_memavailable{object="nodes"}[5m]) / 2^30
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [1.25]
        refId: C
    for: 0s
        # Entprellung: eine Druck-Welle = EIN Alert-Fenster (wie swarm-node-oom-kill).
    keep_firing_for: 15m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "PVE-Host {{ $labels.host }}: MemAvailable {{ $values.A.Value }} GiB (5m-Mittel < 1.25) — i915-Livelock-Gefahr"
      description: "Memory-Druck auf {{ $labels.host }} im Bereich der Livelock-Vorfälle (27.06./17.07./08.08.). SOFORT: laufenden vzdump prüfen und ggf. abbrechen (ps aux | grep vzdump), Page-Cache freigeben (sync; echo 1 > /proc/sys/vm/drop_caches), Gäste notfalls migrieren. Siehe auch pve-i915-livelock-warning (Purge-Sturm-Zähler) und pve-host-metrics-stale (Freeze-Detektor)."

      # --- Metrik-Push abgerissen (Host-Freeze-Detektor) ---
      # pvestatd pusht ~alle 10s an VictoriaMetrics. >240s Stille = Host
      # eingefroren oder pvestatd tot. Muster pve03 08.08.: Freeze 06:07,
      # entdeckt erst ~12:20 (≈6h blind, Hard-Reset 12:23). Rückwärts-Query
      # 08.08. 04:15Z: pve03=459s, pve01/pve02=8-9s → hätte ~4min nach dem
      # Freeze alarmiert. tlast_over_time = MetricsQL (Datasource ist
      # VictoriaMetrics, kein Standard-PromQL). [1h]-Fenster: nach 60min ohne
      # Sample fällt die Serie aus dem Ergebnis (noData→OK) — der Alert trägt
      # Minute ~4 bis ~60; den Dauerzustand decken die Folge-Alerts
      # (swarm-node-down, frigate-down, postgres-prod-node-down) ab.
      # Ein geplanter PVE-Reboot (>4min Stille) feuert einmal → bei Wartung
      # Silence setzen (wie ollama-down). VictoriaMetrics-Eigenausfall >4min
      # würde nach Rückkehr kurz für alle 3 Hosts feuern (1 Telegram durch
      # group_by grafana_folder, klärt sich selbst).
  - uid: pve-host-metrics-stale
    title: PVE host metrics stale (Host-Freeze-Verdacht)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: time() - tlast_over_time(memory_memavailable{object="nodes"}[1h])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [240]
        refId: C
    for: 0s
    keep_firing_for: 10m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "PVE-Host {{ $labels.host }}: keine Status-Metriken seit {{ $values.A.Value }}s — Host-Freeze-Verdacht"
      description: "pvestatd auf {{ $labels.host }} pusht seit >4min keine Werte (Normaltakt ~10s). Muster pve03 08.08.2026: i915-Freeze 06:07, bemerkt erst ~12:20. Prüfen: ping + SSH auf den Host; eingefroren → Hard-Reset, danach RCA via journalctl -b -1 (i915-Livelock-Muster). Bei geplantem Reboot feuert die Regel einmal — Silence setzen."

      # =====================================================================
      # Ab hier: node-exporter auf den Hosts (job=pve-node-exporter, seit
      # 2026-08-23, ansible/pve-monitoring.yml). Die beiden Regeln oben
      # bleiben auf dem pvestatd-Push — bewusst: die zwei Quellen fallen
      # unabhängig voneinander aus, und ein Freeze-Detektor, der an derselben
      # Pipeline hängt wie alles andere, ist keiner.
      # =====================================================================

      # --- Host nicht erreichbar ---
      # Zweiter, unabhängiger Weg zu derselben Aussage wie
      # pve-host-metrics-stale: dort reißt der Push ab (Host oder pvestatd
      # tot), hier scheitert der Scrape (Host, Netz oder Exporter tot). Beide
      # critical und im selben Ordner — die Notification-Policy gruppiert nach
      # grafana_folder, ein Ausfall wird also EIN Telegram mit zwei Zeilen.
      # Das ist gewollt: die zweite Zeile sagt, welche Pipeline noch lebt.
      #
      # for: 2m wie swarm-node-down. Bei 30s Scrape-Intervall sind das vier
      # Fehlversuche — kurze Netzwischer (Corosync-Flapping auf dem einen
      # 1-GbE-Draht) laufen darunter durch.
  - uid: pve-host-down
    title: PVE host unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(up{job="pve-node-exporter"}[3m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 2m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "PVE-Host {{ $labels.instance }} antwortet nicht mehr"
      description: "node-exporter auf {{ $labels.instance }} ist seit 2min nicht erreichbar. Prüfen: ping, SSH, dann 'systemctl status prometheus-node-exporter'. Antwortet der Host auf Ping, aber SSH läuft in den Timeout, ist das das i915-Livelock-Muster (pve01/pve03) — siehe pve-host-memory-pressure. Mit diesem Alert stehen die Gäste des Hosts still: welche, zeigt 'ha-manager status' von einem der anderen Nodes."

      # --- Wurzel-Dateisystem: Warnung ---
      # Nur mountpoint="/" (LVM pve-root, 65-68 GB). Die ZFS-Datasets unter
      # /tank melden alle denselben Pool-Restplatz — acht identische Serien je
      # Host, die nichts zusätzlich aussagen. NFS und CephFS liefert der
      # Exporter gar nicht erst (fs-types-exclude, siehe Playbook); deren
      # Füllstand deckt SNMP bzw. der ceph-Job ab.
      #
      # Belegung am 2026-08-23: pve01 34%, pve02 48%, pve03 28%. Der Abstand
      # zu 80% ist groß genug, dass die Warnung nicht zum Dauerzustand wird.
      # Was / hier vollaufen lässt, sind vor allem /var/log (Purge-Sturm im
      # Livelock schreibt tausende Zeilen/min) und liegengebliebene
      # vzdump-Zwischendateien.
  - uid: pve-host-root-disk-warning
    title: PVE host root filesystem filling up
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          100 - (
            node_filesystem_avail_bytes{job="pve-node-exporter", mountpoint="/"}
            / node_filesystem_size_bytes{job="pve-node-exporter", mountpoint="/"}
            * 100
          ) > 80
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "PVE-Host {{ $labels.instance }}: / über 80% belegt"
      description: "Wurzel-Dateisystem von {{ $labels.instance }} läuft voll. Übliche Verursacher: 'journalctl --disk-usage' (Purge-Sturm nach i915-Livelock), abgebrochene vzdump-Läufe in /var/tmp, alte Kernel. Aufräumen bevor es kritisch wird — ein volles / legt pmxcfs und damit den Cluster-Status lahm."

      # --- Wurzel-Dateisystem: kritisch ---
      # Getrennte Regel statt einer mit zwei Schwellen: nur so trennt die
      # Notification-Policy die Wege (critical sofort, warning in den Digest
      # 08:00/18:00). Ein volles / auf einem PVE-Node ist kein Digest-Thema —
      # pmxcfs kann dann nicht mehr schreiben, und ohne /etc/pve fällt die
      # Cluster-Kommunikation aus.
  - uid: pve-host-root-disk-critical
    title: PVE host root filesystem critical
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          100 - (
            node_filesystem_avail_bytes{job="pve-node-exporter", mountpoint="/"}
            / node_filesystem_size_bytes{job="pve-node-exporter", mountpoint="/"}
            * 100
          ) > 90
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 5m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "PVE-Host {{ $labels.instance }}: / über 90% belegt"
      description: "Nur noch wenige GB frei auf {{ $labels.instance }}. Sofort: 'journalctl --vacuum-size=200M', 'du -xh --max-depth=2 / | sort -h | tail -20'. KEINE Gäste anfassen — ein volles / verhindert Snapshots und macht ein Rollback unmöglich."

      # --- Arbeitsspeicher knapp (Frühwarnung) ---
      # Ergänzt pve-host-memory-pressure, ersetzt sie nicht: die feuert
      # critical bei <1.25 GiB absolut — das ist die Livelock-Schwelle, wenige
      # Minuten vor dem Freeze. Hier geht es um die Stunde davor.
      #
      # Relativ statt absolut, weil pve02 mit 32 GB doppelt so viel Speicher
      # hat wie pve01/pve03 mit 15-16 GB. Eine absolute Schwelle wäre auf
      # pve02 zu scharf oder auf pve01 wirkungslos.
      #
      # Schwellwert-Herleitung (7d, 15m-Mittel, Stand 2026-08-23):
      #   5%-Quantil:  pve01 10.7% | pve02 11.5% | pve03 11.9%
      #   1%-Quantil:  pve01  8.3% | pve02  9.3% | pve03 10.4%
      #   Minimum:     pve01  6.0% | pve02  6.6% | pve03  9.1%
      # Bei 8% zählt VictoriaMetrics in 7 Tagen 17 (pve01) bzw. 4 (pve02)
      # 5min-Punkte darunter, pve03 keinen — also einige wenige Episoden je
      # Woche, praktisch alle in den vzdump-Fenstern. Als warning landet das
      # im Digest und ist dort genau richtig: es zeigt den Trend, es weckt
      # niemanden.
      #
      # 15m-Mittel im Query statt `for: 15m`, aus demselben Grund wie bei
      # pve-host-memory-pressure: reißt der Scrape im Speicherdruck ab, würde
      # eine Pending-Phase durch noData zurückgesetzt.
  - uid: pve-host-memory-warning
    title: PVE host memory getting tight
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          avg_over_time(node_memory_MemAvailable_bytes{job="pve-node-exporter"}[15m])
          / avg_over_time(node_memory_MemTotal_bytes{job="pve-node-exporter"}[15m])
          * 100
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [8]
        refId: C
    for: 0s
        # Eine Druck-Welle = EIN Alert-Fenster (wie swarm-node-oom-kill).
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "PVE-Host {{ $labels.instance }}: nur noch {{ $values.A.Value }}% MemAvailable (15m-Mittel)"
      description: "Speicherreserve auf {{ $labels.instance }} unter 8%. Meist läuft gerade ein vzdump. Prüfen: 'ps aux | grep vzdump', 'arcstat' (ZFS-ARC), 'ha-manager status' (Gäste, die nach einem Failover hier gelandet sind). Erreicht der Wert 1.25 GiB absolut, feuert pve-host-memory-pressure critical — dann ist es zu spät für eine geordnete Reaktion."

      # --- OOM-Kill auf dem Host ---
      # Bis 2026-08-23 gab es diese Metrik auf den Hypervisoren nicht: die
      # Regel frigate-lxc-oom fragte node_vmstat_oom_kill schon seit Monaten
      # ab, nur lieferte kein Exporter den Wert. Sie war damit still
      # wirkungslos — und der OOM-Kill im Frigate-LXC (LXC 4502, Speicher
      # 6144→7168 MB angehoben) fiel nur zufällig auf.
      #
      # Diese Regel deckt alle drei Hosts ab, egal welcher Gast betroffen ist:
      # node_vmstat_oom_kill zählt kernelweit, also auch Kills innerhalb einer
      # LXC-cgroup.
      #
      # 2026-08-25 ZUSAMMENGELEGT (ALARM-DESIGN-EEMUA-191 6.4). Daneben lief
      # bis hierher frigate-lxc-oom (Gruppe "Frigate NVR", warning) auf
      # DERSELBEN Metrik, DENSELBEN drei Hosts, mit identischem for: 0s und
      # keep_firing_for: 30m. Ein einzelner Host-OOM erzeugte damit zwei
      # Alarme auf zwei Zustellwegen (critical sofort + warning in den
      # Digest) für EIN Ereignis — die Begründung "sie weckt ja nicht
      # zweimal" hält nicht: sie meldet zweimal, und der Digest-Eintrag
      # bezieht sich auf denselben Kill, den der critical bereits gemeldet
      # hat. Die warning-Regel ist entfernt; ihr Frigate-Runbook-Text ist
      # vollständig in die description dieser Regel übernommen.
      #
      # Der Vergleich "> 0" ist bewusst NICHT mehr in der Query: increase()
      # liefert im Gesundzustand 0 und damit einen Wert, der Vergleich steht
      # in der Grafana-Bedingung (gt 0). Das ist die Bauform aus 734a5fd und
      # hält die Regel korrekt, falls noDataState je auf Alerting wechselt.
  - uid: pve-host-oom-kill
    title: PVE host OOM-killed a process
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          increase(node_vmstat_oom_kill{job="pve-node-exporter"}[10m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 0s
        # OOM-Wellen entprellen: mehrere Kills in Folge = ein Alert-Fenster.
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "OOM-Kill auf PVE-Host {{ $labels.instance }} in den letzten 10min"
      description: "Der Kernel auf {{ $labels.instance }} hat einen Prozess gekillt. Wer es traf, zeigt 'dmesg -T | grep -i oom-kill' (mit anon-rss). War es ein Gast, steht die cgroup dabei — Gegenprobe: 'cat /sys/fs/cgroup/lxc/<vmid>/memory.events'. Traf es einen Host-Prozess (ceph-osd, pvestatd, corosync), ist der Dienst danach womöglich tot, ohne dass ein eigener Alert dafür existiert: nach dem Stromausfall 2026-08-21 blieb genau so ein OSD vier Stunden unbemerkt liegen. 'systemctl --failed' prüfen. — VERDÄCHTIGER NR. 1 IST FRIGATE (übernommen aus der 2026-08-25 zusammengelegten Regel frigate-lxc-oom): Läuft CT 4502 auf diesem Host ('pct list | grep 4502')? Es hat 7168 MB + 4096 MB swap und war am 17.08.2026 zweimal Ursache (frigate.capture, je ~6 GB). Mehr Speicher hilft dort nur, wenn der Druck aus dem Workload kommt — staut sich dagegen das Aufnahmeziel (Synology-NFS), verlängert er nur die Zeit bis zum nächsten Kill. Zweitverdächtig: ein laufendes vzdump (siehe pve-host-memory-warning)."

      # --- CPU-Dauerlast ---
      # Nicht die Momentanlast, sondern das 30-Minuten-Mittel: einzelne
      # Spitzen sind auf einem Hypervisor normal (Backup, Migration,
      # Frigate-Inferenz). Interessant ist der Zustand, in dem Gäste
      # dauerhaft auf CPU warten.
      #
      # Schwellwert-Herleitung (7d, Stand 2026-08-23, pvestatd-Daten):
      #   Median:                pve01 21% | pve02 40% | pve03 23%
      #   99%-Quantil (10s):     pve01 54% | pve02 84% | pve03 65%
      #   höchstes 30m-Mittel:   pve01 55% | pve02 64% | pve03 66%
      # 85% liegt über allem, was in 7 Tagen vorkam — die Regel hätte in
      # dieser Woche kein einziges Mal gefeuert. pve02 ist dabei der enge
      # Fall: 6 Kerne, 17 vCPU zugeteilt, Frigate teilt sich die CPU mit
      # Home Assistant und postgres-prod.
      #
      # Load average bleibt bewusst außen vor: er zählt auch I/O-Waiter, und
      # auf diesen Hosts (Ceph über EINE 1-GbE-Leitung) wartet dauernd etwas.
      # Er steht im Dashboard, taugt aber nicht als Alarmkriterium.
  - uid: pve-host-cpu-high
    title: PVE host CPU saturated
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          100 - (
            avg by (instance) (
              rate(node_cpu_seconds_total{job="pve-node-exporter", mode="idle"}[30m])
            ) * 100
          )
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [85]
        refId: C
    for: 0s
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "PVE-Host {{ $labels.instance }}: CPU {{ $values.A.Value }}% im 30min-Mittel"
      description: "Anhaltende CPU-Sättigung auf {{ $labels.instance }}. Verursacher finden: 'top -b -n1 | head -20' auf dem Host, dann 'qm list'/'pct list' für die Gäste. Im LXC ist der Load-Average unbrauchbar (er zeigt den Host) — dort mit 'vmstat 1 5' auf id/wa schauen. Läuft gerade ein vzdump oder eine Migration, klärt sich das von selbst."

  # ===========================================================================
  # POSTGRESQL — Single-VM postgres-prod (192.168.4.45)
  # ===========================================================================
  # 2026-06-15: Patroni-3-Node-Cluster + etcd durch Single-PG-VM ersetzt.
  # Source: prometheus-postgres-exporter (job=postgres-exporter, :9187) +
  # node-exporter (job=node-exporter, instance=postgres-prod, :9100) auf der VM.
  # Alte Patroni-/etcd-Alertgruppen entfernt; bei Reaktivierung aus git holen.

      # --- Dienste, die nach dem Boot liegengeblieben sind ---------------------
      # Gespeist von post-boot-sweep.sh (ansible/post-boot-resilience.yml), das
      # fuenf Minuten nach dem Hochfahren und danach stuendlich laeuft. Gezaehlt
      # wird, was NACH dem Wiederholungsversuch noch failed ist — die bekannten
      # Faelle repariert der Sweep selbst.
      #
      # Warum das eine eigene Regel braucht: Am 2026-08-21 und erneut am
      # 2026-08-23 blieben nach dem Kaltstart Dienste als failed stehen —
      # ceph-osd@0 (vier Stunden 33 % degradiert), lxc.service samt dem
      # GitHub-Runner-Container, NFS-Mounts fuer Frigate. Keiner wurde gemeldet;
      # alle fielen zufaellig beim manuellen Nachsehen auf. Siehe #124.
  - uid: post-boot-failed-units
    title: Dienste nach dem Boot fehlgeschlagen
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 7200
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: post_boot_failed_units > 0
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 7200
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
        # 10 Minuten: Der Sweep laeuft fuenf Minuten nach dem Boot und braucht
        # selbst einen Moment. Kuerzer waere ein Fehlalarm bei jedem Neustart.
    for: 10m
        # Schwellwertregel — bei noData greift "PVE host unreachable" in derselben
        # Gruppe. Ein Host, der gar nichts mehr meldet, ist dort besser aufgehoben.
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Auf {{ $labels.node }} sind {{ $value }} Dienst(e) nach dem Boot fehlgeschlagen"
      description: "Der Post-Boot-Sweep hat einen Neustart bereits erfolglos versucht. Nachsehen mit 'systemctl --failed' auf dem Host, Details in 'journalctl -t post-boot-sweep'. Bekannte Faelle: ceph-osd (MON-Quorum noch nicht da), lxc.service samt pve-container@*, und Mounts, deren Ziel beim Boot noch nicht erreichbar war. Dienste ausserhalb der Wiederholungsliste meldet der Sweep, faehrt sie aber bewusst nicht an."
- orgId: 1
  name: PostgreSQL Single-VM
  folder: Databases
  interval: 60s
  rules:

      # --- postgres-prod postmaster restart-loop (Crash-Loop; portiert aus alter PostgreSQL-HA-Gruppe 2026-07-06) ---
  - uid: postgres-prod-crash-loop
    title: postgres-prod postmaster restart loop
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: changes(pg_up{instance="postgres-prod"}[10m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
        refId: C
    for: 2m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "postgres-prod PostgreSQL postmaster restart loop detected"
      description: "pg_postmaster_start_time_seconds aenderte sich >2x in 10min = Crash-Loop. Check: ssh ansible@192.168.4.45 'sudo journalctl -u postgresql -n 100' (OOM? Disk voll? Corrupt WAL?)"

      # --- postgres-prod DB down (DB läuft nicht / Exporter unerreichbar) ---
  - uid: postgres-prod-down
    title: postgres-prod PostgreSQL down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |-
          min_over_time(pg_up{instance="postgres-prod"}[3m]) * min_over_time(up{job="postgres-exporter"}[3m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 2m
        # noDataState: OK — Scrape-Luecke != DB down; up{job}==0 faengt Exporter-down MIT Daten ab (EEMUA: keine False-Positives)
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "postgres-prod PostgreSQL is down"
      description: "Single-PG-VM postgres-prod (192.168.4.45) DB unreachable. ALL apps affected. Check: ssh ansible@192.168.4.45 'sudo systemctl status postgresql'"

      # --- postgres-prod VM unreachable (node-exporter down) ---
  - uid: postgres-prod-node-down
    title: postgres-prod VM unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(up{job="node-exporter", instance="postgres-prod"}[3m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 3m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "postgres-prod VM (192.168.4.45) unreachable"
      description: "node-exporter not responding. VM may be down — check Proxmox (pve02) and HA status."

      # --- postgres-prod disk space critical (< 12% on the data filesystem) ---
  - uid: postgres-prod-disk-critical
    title: postgres-prod disk space critical
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          min(node_filesystem_avail_bytes{instance="postgres-prod", fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{instance="postgres-prod", fstype!~"tmpfs|overlay|squashfs"}) * 100
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [12]
        refId: C
    for: 5m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "postgres-prod disk space < 12%"
      description: "Free disk on postgres-prod is critically low. WAL/DB growth can stall PostgreSQL. Check df -h on 192.168.4.45."

      # --- postgres-prod connection saturation (> 80% of max_connections) ---
  - uid: postgres-prod-connections-high
    title: postgres-prod connection saturation
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          sum(pg_stat_database_numbackends{instance="postgres-prod"})
          / max(pg_settings_max_connections{instance="postgres-prod"}) * 100
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [80]
        refId: C
    for: 5m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "postgres-prod using > 80% of max_connections"
      description: "Connection pool near exhaustion. Check for connection leaks (apps without pooling) or raise max_connections."

  # ===========================================================================
  # BACKUPS — Proxmox Backup Server
  # ===========================================================================
  # Source: pbs-exporter on pbs-exporter:10019 (job=pbs-exporter)

- orgId: 1
  name: Backups
  folder: Infrastructure
  interval: 300s
  rules:

      # --- PBS unreachable ---
  - uid: pbs-down
    title: PBS exporter unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(up{job="pbs-exporter"}[10m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 10m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "Proxmox Backup Server is unreachable"
      description: "PBS exporter cannot connect to pbs.hornung-bn.de. Check if PBS service is running."

      # --- Backup older than 48 hours for any VM ---
      # 2026-06-14: Statt manueller vm_name-Blocklist (retirte VMs wie dock01/100)
      # nun EXISTENZ-basiert: Alert feuert nur, wenn der Gast LIVE im Cluster
      # existiert. "Live" = PVE-Metric-Export liefert in den letzten 60min
      # Per-Gast-Metriken (qemu→blockstat_rd_bytes, lxc→system_uptime). GESTOPPTE
      # Reserve-Gäste haben keine Live-Metriken → automatisch ausgeschlossen.
      # 2026-06-30: dock01 (vm:100) ist eine LAUFENDE HA-Reserve (Memory-Puffer) →
      # emittiert Live-qemu-Metriken → leakt durch den Existenz-Filter. Da bewusst
      # NICHT gesichert, explizit per vm_id!="100" ausgeschlossen (sonst Dauer-Alert).
      # namespace!="Backup" bleibt (Archiv-NS). Label-Brücke: PBS=vm_id, PVE=vmid.
  - uid: pbs-backup-stale
    title: Backup older than 48h
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          (
            (time() - last_over_time(pbs_snapshot_vm_last_timestamp{namespace!="Backup", vm_id!="100"}[15m]) > 172800)
            and on(vm_id)
            (
              label_replace(count by(vmid)(last_over_time(blockstat_rd_bytes{object="qemu"}[1h])), "vm_id", "$1", "vmid", "(.+)")
              or
              label_replace(count by(vmid)(last_over_time(system_uptime{object="lxc"}[1h])), "vm_id", "$1", "vmid", "(.+)")
            )
          )
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 5m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: OK
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
          # 2026-06-30: critical→warning — ein 48h-altes Backup ist kein Sofort-
          # Page (pbs-backup-missed-daily/26h deckt das Frühsignal ab); wandert in
          # den 2x/Tag-Digest statt Instant-Telegram.
      severity: warning
    annotations:
      summary: "Backup >48h: {{ $labels.vm_name }} ({{ $labels.vm_id }})"
      description: "No successful backup in 2 days. Check PBS backup jobs."

      # --- Backup older than 26 hours (missed daily) ---
      # Siehe pbs-backup-stale: EXISTENZ-basiert (2026-06-14) statt vm_name-Blocklist
      # — Alert nur für Gäste, die LIVE im Cluster existieren (PVE-Metric in letzter
      # Stunde). Gestoppte/Reserve-Gäste (dock01) automatisch ausgeschlossen.
  - uid: pbs-backup-missed-daily
    title: Daily backup missed
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          (
            (time() - last_over_time(pbs_snapshot_vm_last_timestamp{namespace!="Backup", vm_id!="100"}[15m]) > 93600)
            and on(vm_id)
            (
              label_replace(count by(vmid)(last_over_time(blockstat_rd_bytes{object="qemu"}[1h])), "vm_id", "$1", "vmid", "(.+)")
              or
              label_replace(count by(vmid)(last_over_time(system_uptime{object="lxc"}[1h])), "vm_id", "$1", "vmid", "(.+)")
            )
          )
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 30m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: OK
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "Backup >26h: {{ $labels.vm_name }} ({{ $labels.vm_id }})"
      description: "Last backup is more than 26h old. Daily jobs usually run at 02:00. Check PBS job logs."

  # ===========================================================================
  # HOME ASSISTANT — Smart Home Platform
  # ===========================================================================
  # Source: HA Prometheus integration on 192.168.2.5:8123 (job=homeassistant)
  # Metrics: homeassistant_entity_available, homeassistant_binary_sensor_state

- orgId: 1
  name: Home Assistant
  folder: Smart Home
  interval: 60s
  rules:

      # --- Home Assistant itself unreachable ---
  - uid: ha-down
    title: Home Assistant unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(up{job="homeassistant"}[3m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 3m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Home Assistant is unreachable"
      description: "HA Prometheus endpoint not responding on 192.168.2.5:8123. Check VM and HA container."

      # --- HA entities mass-unavailable (OOM / addon-crash canary) ---
      # Interim-Canary 2026-06-14: VM103-OOM (~22:59, vermutlich getriggert durch das
      # nächtliche HA→Synology-Backup) killte ~600 Entities (3510→2880), die die ganze
      # Nacht weg blieben — war NICHT alarmierbar (HA-Core blieb meist up, kein Memory-
      # Sensor). Diese Regel fängt den Symptom-Einbruch. Baseline gesund ~3510 (Band
      # 3506-3517); Schwellwert 3300 = ~6% darunter, weit über OOM-Level (~2880).
      # ABSOLUT (nicht selbst-kalibrierend), damit ein STUNDENLANGER Ausfall feuernd
      # bleibt (max_over_time-Baseline würde nach 3h auf das degradierte Niveau
      # nachziehen und fälschlich clearen). Bei legitimem Entity-Wachstum/Abbau Wert
      # anpassen. severity=critical → sofortige Telegram-Benachrichtigung (kein Digest).
  - uid: ha-entities-mass-unavailable
    title: HA entities mass-unavailable (OOM/addon crash)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: sum(homeassistant_entity_available)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [3300]
        refId: C
    for: 10m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "HA: nur {{ $values.A.Value }} Entities verfügbar (<3300, Baseline ~3510)"
      description: "Massiver Entity-Einbruch = Addon-Crash/OOM (z.B. node-red/matter/mariadb nach Memory-Spike, evtl. durch HA-Backup). VM-100-RAM (haos, 6GB seit 2026-07-01) prüfen: ssh root@pve02 'qm config 100 | grep memory'. Verlauf: Grafana → Smart Home."

      # --- HA host memory pressure (OOM-Vorwarnung) ---
      # Ergänzt 2026-06-14 nach HA-OOM. Pre-Event-Warnung (das Pendant zur
      # Post-Event-Regel ha-entities-mass-unavailable). Quelle: HA System-Monitor
      # (sensor.system_monitor_arbeitsspeicherauslastung, % belegt).
      # Doku korrigiert 2026-07-16: HA-VM ist VMID 100 (haos, pve02) mit 6GB seit
      # 2026-07-01 (balloon=maxmem, kein aktives Ballooning) — NICHT mehr VM103/10GB.
      # 85% ≈ 4,9GiB used. Baseline frisch ~56-58%, driftet ohne HA-Neustart auf
      # ~68% (Add-on-Leak-Verdacht); Synology-Backup-Fenster (real 21:15-23:45
      # CEST, nicht "~23:00") legt +~15pp obendrauf.
      # EEMUA-Nuisance-Fix 2026-07-16: Query mit avg_over_time[10m] geglättet —
      # am 14.07. feuerten 3-4 Kurz-Episoden (5-8min) in 2h einzeln. Glättung
      # bündelt dicht aufeinanderfolgende Episoden, filtert Kurz-Blips <5min,
      # anhaltende Lagen alarmieren unverändert.
      # severity critical → sofort, damit vor dem OOM-Kill eingegriffen werden kann.
  - uid: ha-memory-high
    title: HA host memory high (OOM-Vorwarnung)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: avg_over_time(homeassistant_sensor_unit_percent{entity="sensor.system_monitor_arbeitsspeicherauslastung"}[10m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [85]
        refId: C
    for: 5m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "HA RAM {{ $values.A.Value }}% (10m-Mittel >85%, Baseline frisch ~56%) — OOM droht"
      description: "VM 100 (haos, 6GB) nähert sich der Grenze. Bei ~100% killt der OOM-Killer Addons (Mosquitto/node-red/matter/mariadb) → ~600 Entities fallen aus. Prüfen: ssh root@pve02 'qm config 100 | grep memory'; was allokiert (Add-on-Leak/Backup 21:15-23:45/Integration)? Baseline >65% ohne Backup = Drift → HA-Neustart erwägen. Verlauf: Grafana → Smart Home."

      # --- Zigbee2MQTT bridge offline ---
  - uid: ha-z2m-offline
    title: Zigbee2MQTT bridge offline
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |-
          min_over_time(homeassistant_binary_sensor_state{entity="binary_sensor.zigbee2mqtt_bridge_connection_state"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 5m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Zigbee2MQTT bridge is offline"
      description: "All Zigbee devices (lights, sensors, locks) are unreachable. Check Z2M addon and coordinator USB stick."

      # --- HA update available — REGEL ENTFERNT 2026-08-25 -------------------
      # Hier stand ha-update-available (severity info, for: 60m) auf
      # homeassistant_update_state{entity=~"update.home_assistant.*"} == 1.
      #
      # Gestrichen nach ALARM-DESIGN-EEMUA-191, 6.3/6.4: 33 Auslösungen in
      # 130 Tagen für eine Information, die ohnehin im HA-UI steht und auf
      # die es keine zeitkritische Reaktion gibt. Ein Alarm fordert eine
      # Handlung innerhalb einer definierten Frist — "es gibt ein Update"
      # tut das nicht, und ein Alarm, den man wegklickt, erzieht dazu, auch
      # die echten wegzuklicken.
      #
      # Die Information geht nicht verloren: Home Assistant zeigt
      # verfügbare Updates selbst an (Einstellungen → Updates), und die
      # Metrik homeassistant_update_state liegt weiterhin in
      # VictoriaMetrics — wer sie sehen will, baut ein Dashboard-Panel,
      # keinen Alarm.

  # ===========================================================================
  # VICTORIAMETRICS — Self-Monitoring
  # ===========================================================================
  # Source: victoriametrics:8428 (job=victoriametrics)

- orgId: 1
  name: VictoriaMetrics
  folder: Monitoring
  interval: 60s
  rules:

      # --- VM slow inserts (ingestion bottleneck) ---
      # 2026-08-25 REPARIERT (ALARM-DESIGN-EEMUA-191, 6.4). Die Regel fragte
      # vm_slow_inserts_total ab — diese Metrik existiert in dieser
      # VictoriaMetrics-Version nicht (gegengeprüft: 0 Serien). Sie heißt
      # heute vm_slow_row_inserts_total. Mit noDataState: OK war das ein
      # STILLER blinder Fleck: Die Regel hat in 130 Tagen nie gefeuert und
      # konnte es auch nicht.
      #
      # Der Schwellwert musste dabei mit korrigiert werden, sonst hätte die
      # Reparatur einen Daueralarm erzeugt. Gemessen am 2026-08-25 über 7d
      # (1986 Samples à 5m) auf rate(vm_slow_row_inserts_total[5m]):
      #   5%-Quantil  0,36/s   Median 1,26/s   90%  3,21/s
      #   99%-Quantil 21,98/s  Maximum 82,16/s
      #   über 0,1/s:  1986 von 1986 Samples = 100 % der Zeit
      #   über 10/s:     38 von 1986 = 1,9 %
      #   über 30/s:      7 von 1986 = 0,35 %
      # Der alte Wert 0,1/s liegt UNTER dem 5%-Quantil des Normalbetriebs —
      # er hätte ab der ersten Auswertung permanent gefeuert. Ein von Null
      # verschiedener Grundpegel ist bei dieser Metrik normal (Cache-Miss im
      # per-Metrikname-Cache), Signal ist nicht die Höhe, sondern eine
      # anhaltende Erhöhung. 30/s liegt über dem 99%-Quantil; zusammen mit
      # for: 10m braucht es zwei aufeinanderfolgende Auswertungen darüber.
      #
      # Der Vergleich steht in der Grafana-Bedingung, nicht in der Query:
      # rate() liefert im Gesundzustand einen Wert, ein "> 30" in der Query
      # würde filtern (734a5fd).
  - uid: vm-slow-inserts
    title: VictoriaMetrics slow inserts
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          rate(vm_slow_row_inserts_total{job="victoriametrics"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [30]
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "VictoriaMetrics slow inserts über 30/s (Normalbetrieb: Median 1,3/s)"
      description: "Die Ingestion nimmt den langsamen Pfad — meist CephFS-I/O-Latenz, Speicherdruck oder ein Kardinalitätssprung (neue Label-Werte lassen den per-Metrikname-Cache ins Leere laufen). Prüfen: 'docker service logs monitoring_victoriametrics --tail 100', vm-memory-high in derselben Gruppe, und die Kardinalität unter http://victoriametrics:8428/vmui (Cardinality Explorer). Schwellwert 30/s ist aus 7 Tagen Messung abgeleitet und liegt über dem 99%-Quantil; siehe Kommentar über der Regel."

      # --- VM high memory usage (>1.5GB of 2GB limit) ---
  - uid: vm-memory-high
    title: VictoriaMetrics memory high
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          process_resident_memory_bytes{job="victoriametrics"} > 1610612736
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "VictoriaMetrics using > 1.5GB RAM (limit: 2GB)"
      description: "Container may get OOM-killed. Consider increasing memory limit or reducing retention/cardinality."

      # --- Scrape target down (any job) ---
  - uid: vm-scrape-target-down
    title: Monitoring scrape target down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
              # 2026-06-30: Catch-all NUR für Jobs OHNE eigenen Down-Alert. Jobs mit
              # dediziertem up-basiertem Alert (node-exporter→swarm-node-down,
              # frigate→frigate-down, postgres-exporter→postgres-prod-down) raus —
              # sonst Doppel-/Dreifach-Alerts pro Ausfall. (blackbox bleibt drin:
              # fängt einen down-Exporter als 1 Alert statt N Probe-Fails ab.)
              # 2026-08-23: pve-node-exporter ergänzt → pve-host-down.
              # 2026-08-25: pbs-exporter und snmp-synology ergänzt. Beide hatten
              # längst einen eigenen up-basierten Alert (pbs-down warning bzw.
              # synology-snmp-down critical) und standen trotzdem noch in
              # diesem Catch-all — ein PBS-Ausfall meldete sich zweimal als
              # warning, ein SNMP-Ausfall als critical UND warning
              # (ALARM-DESIGN-EEMUA-191, 6.4).
              #
              # Wer hier einen Job herausnimmt, MUSS prüfen, dass es dafür
              # eine dedizierte Regel gibt — sonst entsteht ein stiller
              # blinder Fleck. Stand 2026-08-25 verbleiben in diesem
              # Catch-all: victoriametrics, vmagent, loki, alloy, unpoller,
              # reisekosten, blackbox-{https,apps,tika,dns,ollama}.
        expr: |-
          min_over_time(up{job!~"ceph|homeassistant|node-exporter|pve-node-exporter|postgres-exporter|frigate|pbs-exporter|snmp-synology"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 5m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
      description: "Metrics collection interrupted. Specific component alerts may not fire while target is unreachable."

  # ===========================================================================
  # FRIGATE NVR — Camera Health & Detection
  # ===========================================================================
  # Source: Frigate Prometheus metrics on frigate.hornung-bn.de:443 (job=frigate)
  # LXC 4502 mit OpenVINO-iGPU, HA-verwaltet (Affinity frigate-loc:
  # pve02 > pve01 > pve03) — steht am 2026-08-23 auf pve02. Regeln, die den
  # Host adressieren, duerfen ihn deshalb NICHT festverdrahten.

- orgId: 1
  name: Frigate NVR
  folder: Infrastructure
  interval: 60s
  rules:

      # --- Frigate unreachable ---
      # WICHTIG: Expression MUSS immer einen Wert liefern ("up{...}" ohne
      # "== 0"), sonst ergibt OK-Zustand (up=1) ein leeres Query-Result ->
      # Grafana sieht noData -> noDataState "Alerting" feuert als False
      # Positive. Deshalb: "up{job='frigate'}" + Threshold "lt 1". Dann
      # ist noData echt nur bei fehlender Metric (Scrape-Ausfall, Target weg).
      #
      # Smoothing (2026-04-23): min_over_time(...[5m]) liefert 0 nur wenn ALLE
      # Samples der letzten 5min 0 waren — einzelne Scrape-Misses (z.B.
      # Container-Restart nach OOM-Kill, Dauer ~3-5min) feuern keinen Alert
      # mehr. Plus for: 5m — echter Ausfall muss weitere 5min anhalten.
      # Frigate-Restart <10min total = kein Alert. Erst echter Ausfall firet.
  - uid: frigate-down
    title: Frigate NVR unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(up{job="frigate"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [1]
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Frigate NVR is unreachable"
      description: "Frigate metrics endpoint not responding for 10+ min (5min min_over_time window + 5min for). Check LXC 4502 on pve03, CephFS mount, Docker containers, and OOM-kill history."

      # --- Camera detection stopped (any camera with 0 FPS for 5 min) ---
  - uid: frigate-camera-no-detection
    title: Frigate camera not detecting
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |-
          min_over_time(frigate_camera_fps{job="frigate"}[10m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.1
        refId: C
        # 2026-06-13: for 5m→10m — FPS fällt bei RTSP-/Netz-Stottern kurz auf 0;
        # 10m verlangt anhaltenden Ausfall (gegen transiente Kamera-Blips).
    for: 10m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
          # 2026-06-30: critical→warning — eine EINZELNE Kamera auf 0 FPS ist kein
          # Notfall (Frigate selbst läuft, frigate-down deckt den Total-Ausfall).
          # Wandert in den Digest statt Instant-Page.
      severity: warning
    annotations:
      summary: "Frigate camera {{ $labels.camera_name }} has 0 FPS"
      description: "Camera feed is not being received. Check camera network, RTSP stream, or ffmpeg process in Frigate logs."

      # --- Camera pipeline stalled (Stream liefert, Verarbeitung tot) ---
      # Fehlerbild 12.07.+14.07.2026: OpenVINO-Detektor haengt ("Detection appears
      # to be stuck" + Force-Kill im frigate.watchdog), danach bleiben einzelne
      # Kamera-Prozesse im Deadlock: camera_fps normal (Stream lebt), aber
      # process_fps ~0 / skipped_fps = camera_fps. Livebild eingefroren, keine
      # Objekte, Recording-Segmente werden verworfen. frigate-camera-no-detection
      # (camera_fps==0) greift hier NICHT, der ffmpeg-Watchdog heilt es NICHT.
      #
      # Expression: process_fps (max ueber 10m) NUR fuer Kameras mit lebendem
      # Stream (camera_fps > 0.5). Kamera komplett tot -> Serie faellt raus ->
      # noData -> OK (deckt frigate-camera-no-detection); Scrape weg -> deckt
      # frigate-down. Threshold lt 0.5: gesund sind 2-5 fps (doorbird 2, Reolink 5).
      # ACHTUNG: setzt voraus, dass keine Kamera mit detect-fps < 1 konfiguriert wird.
      #
      # Schutzzeit: max_over_time[10m] + for 15m = ~25min anhaltender Stall vor
      # Alarm. Begruendung: Frigate-/LXC-Neustart = 3-5min Metrik-Luecke+Ramp-up
      # (Reboot 13.07. 19:28), Detector-Restart <1min — beides feuert nicht.
      # Beobachtete echte Staelle: 0.9h-20.4h. keep_firing_for 30m: garten
      # flappte am 15.07. 02:05-04:25 im 10-20min-Takt tot/lebendig — das wird
      # zu EINEM Alarm entprellt (Hysterese, EEMUA 191 Anti-Flap).
  - uid: frigate-camera-pipeline-stalled
    title: Frigate camera pipeline stalled (stream ok, processing dead)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          max_over_time(frigate_process_fps{job="frigate"}[10m])
            and (max_over_time(frigate_camera_fps{job="frigate"}[10m]) > 0.5)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [0.5]
        refId: C
    for: 15m
    keep_firing_for: 30m
        # 2026-08-25 Alerting -> OK. Diese Regel trägt einen Guard
        # ("and camera_fps > 0.5") und fällt damit unter die zweite bindende
        # Regel aus ALARM-DESIGN-EEMUA-191, Abschnitt 9: Guard und
        # NoData-Alarmierung schließen einander aus.
        #
        # Nachgemessen am 2026-08-25 gegen die laufende VictoriaMetrics: Im
        # Ist-Zustand liefert der Ausdruck 3 Serien. Sobald die Kameras
        # ausfallen, greift der Guard nicht mehr, das Ergebnis ist LEER —
        # und mit noDataState: Alerting hätte genau der Kameraausfall diese
        # Regel zusätzlich zu frigate-camera-no-detection feuern lassen.
        # Zwei warnings für ein Ereignis, die zweite ohne Aussage: Ihr Text
        # behauptet "stream ok", während der Stream gerade weg ist.
        #
        # Der Ausfall selbst ist doppelt abgedeckt und braucht diese Regel
        # nicht: frigate-camera-no-detection (camera_fps) und frigate-down
        # (up) melden ihn, beide korrekt mit noDataState: Alerting und ohne
        # Guard. Diese Regel hier deckt ausschließlich den Sonderfall
        # "Stream läuft, Verarbeitung steht" ab — und dafür MUSS der Guard
        # erfüllt sein, sonst gibt es nichts zu melden.
    noDataState: OK
        # execErrState bleibt Alerting: Ein Abfragefehler ist etwas anderes
        # als ein leeres Ergebnis und darf nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
          # Einzelne Kamera degradiert, Frigate laeuft -> warning/Digest
          # (Konvention 2026-06-30, analog frigate-camera-no-detection).
      severity: warning
    annotations:
      summary: "Frigate camera {{ $labels.camera_name }}: stream ok but pipeline stalled"
      description: "Kamera liefert Frames (camera_fps > 0), aber Frigate verarbeitet sie nicht (process_fps < 0.5 fuer 25+ min): Livebild eingefroren, keine Detection, Recording-Luecken. Typische Ursache: Kamera-Prozess-Deadlock nach OpenVINO-Detektor-Hang (docker logs frigate | grep -i stuck). Fix: Frigate-Container neu starten (192.168.4.70: cd /opt/frigate/compose && docker compose restart frigate). ffmpeg-Watchdog-Restarts und Kamera-Reboots heilen das NICHT."

      # --- Detektor liefert keine Erkennungen (Stream ok, Pipeline ok) -------
      # 2026-08-17: Sechs Stunden lang detection_fps == 0 auf ALLEN drei Kameras,
      # ohne einen einzigen Alarm. Gemessen zum Zeitpunkt des Befunds:
      #   camera_fps   doorbird 102.2  garage 5.1  garten 5.1
      #   process_fps  doorbird 109.3  garage 5.0  garten 2.6
      #   detection_fps            0             0           0
      #   max_over_time(detection_fps[6h])  = 0 auf allen Kameras
      #   inference_speed openvino_gpu      = 223.59 (normal ~0.02)
      #
      # Warum KEINE bestehende Regel gegriffen hat — jede schwieg zu Recht:
      #   frigate-down                    up == 1, Scrape lief durch
      #   frigate-camera-no-detection     prueft camera_fps == 0; der war 102/5/5
      #   frigate-camera-pipeline-stalled verlangt process_fps < 0.5; der war 109
      #   frigate-lxc-oom                 kann strukturell nicht feuern (s.u.)
      #
      # Der Name "frigate-camera-no-detection" ist dabei die eigentliche Falle:
      # Er verspricht genau diese Ueberwachung, prueft aber, ob BILDER ankommen,
      # nicht ob ERKANNT wird. Wer die Regelliste liest, hakt es als abgedeckt ab.
      #
      # Ursache am 17.08.: Synology (192.168.2.3) blockierte wiederholt bis zu
      # 4min42s ("nfs: server not responding"), Recording-Segmente stauten sich,
      # der LXC-cgroup lief voll (memory.events max 17182, sock_throttled 83185),
      # der Kernel drosselte die Socket-Puffer -> ffmpeg bekam keine Frames mehr.
      # Diese Regel ist deshalb zugleich der praktische NFS-Stall-Detektor: Ein
      # haengendes Aufnahmeziel aeussert sich IMMER als Erkennungsausfall, und
      # zwar unabhaengig davon, ob die PVE-Hosts ueberwacht werden (tun sie nicht).
      #
      # 🔴 NICHT auf detection_fps alarmieren — der erste Entwurf dieser Regel tat
      # das und waere jede ruhige Nacht falsch losgegangen. Frigate fuehrt
      # Objekterkennung NUR bei Bewegung aus; eine gesunde, ruhige Kamera hat
      # legitim detection_fps == 0. Direkt nach der Reparatur am 17.08. gemessen:
      #   detection_fps  doorbird 3.2   garage 0.0   garten 0.7
      #   skipped_fps    doorbird 0     garage 0     garten 0
      #   inference_speed openvino_gpu = 0.0289
      # garage stand auf 0, war aber voellig gesund — es bewegte sich nur nichts.
      #
      # Alarmiert wird deshalb auf die INFERENZZEIT des Detektors. Sie ist
      # bewegungsunabhaengig, wird auch bei voelliger Ruhe gemeldet, und war
      # exakt der Messwert, der im Fehlerfall um Faktor 7700 danebenlag:
      #   gesund  0.0289 s  (28.9 ms, typischer OpenVINO-iGPU-Wert)
      #   defekt  223.59 s
      # Die Einheit ist damit auch geklaert: Die Metrik meint wirklich Sekunden.
      #
      # Threshold 0.5 s = 17-fache Reserve gegen den Normalwert und drei
      # Groessenordnungen unter dem beobachteten Fehlerfall. Dazwischen liegt
      # nichts Reales, die Wahl ist deshalb unkritisch. Kein per-Kamera-Label:
      # der Detektor ist geteilt, ein Hang trifft immer alle Kameras zugleich.
      #
      # Schutzzeit: max_over_time[15m] + for 15m = ~30min. Ein Frigate-Neustart
      # (3-5min Ramp-up, gemessen: API nach ~7min gesund) feuert damit nicht.
      # severity critical — anders als eine einzelne degradierte Kamera bedeutet
      # ein haengender Detektor den Totalausfall der Erkennung, bei ansonsten
      # vollstaendig gesund aussehendem System.
  - uid: frigate-no-detections
    title: Frigate detector wedged (inference speed collapsed)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          max_over_time(frigate_detector_inference_speed_seconds{job="frigate"}[15m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0.5]
        refId: C
    for: 15m
    keep_firing_for: 30m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Frigate-Detektor haengt — Inferenzzeit {{ $values.A }}s statt ~0.03s"
      description: "Der Objektdetektor braucht 0.5s+ pro Bild statt der ueblichen 29ms. Folge: skipped_fps steigt, detection_fps faellt auf 0 — die Ueberwachung laeuft sichtbar weiter, erkennt aber nichts mehr. camera_fps und process_fps bleiben dabei NORMAL, deshalb schweigen frigate-camera-no-detection und frigate-camera-pipeline-stalled. Am 17.08.2026 lag der Wert bei 223.59s, sechs Stunden lang. Ursache damals: Synology (192.168.2.3) blockierte bis 4min42s ('nfs: server not responding'), der LXC-cgroup lief voll und der Kernel drosselte die Socket-Puffer (memory.events: sock_throttled). Pruefen: 'ssh root@pve02 \"dmesg -T | grep -iE \\\"nfs.*not responding|oom-kill\\\" | tail\"' und 'cat /sys/fs/cgroup/lxc/4502/memory.events'. Fix: 'pct exec 4502 -- docker restart frigate' — behebt den Hang, aber NICHT die Ursache, wenn das NAS weiter aussetzt."

      # --- OOM-Kill auf dem Frigate-Host — REGEL ENTFERNT 2026-08-25 ---------
      # Hier stand frigate-lxc-oom (warning, severity warning). Sie fragte
      # increase(node_vmstat_oom_kill{job="pve-node-exporter"}[10m]) ab —
      # dieselbe Metrik, dieselben drei Hosts, dasselbe for: 0s und
      # keep_firing_for: 30m wie pve-host-oom-kill (Gruppe "PVE Hosts",
      # critical). Jeder Host-OOM erzeugte damit zwei Alarme auf zwei
      # Zustellwegen für EIN Ereignis (ALARM-DESIGN-EEMUA-191, 6.4).
      #
      # Nicht verloren gegangen ist dabei nichts: Der Frigate-Runbook-Text
      # (CT 4502 als Verdächtiger Nr. 1, 7168 MB + 4096 MB swap, die zwei
      # Kills vom 17.08.2026, der Hinweis auf das gestaute Synology-NFS)
      # steht jetzt in der description von pve-host-oom-kill.
      #
      # NICHT wieder anlegen. Wer den Frigate-Bezug schärfen will, ergänzt
      # dort die description — eine zweite Regel auf derselben Serienmenge
      # bringt keine zusätzliche Information, nur eine zweite Meldung.

      # --- Recordings-Volume läuft voll -------------------------------------
      # 2026-08-15: Bis hierher gab es KEINEN Alert auf den Füllstand von
      # /volume1 (Synology, 18 TB). Aufgefallen ist das nur zufällig: 32 Tage
      # verwaiste Recordings (28.05.-28.06., ~520 GB) hatten das Volume auf
      # 463 GB Restplatz gedrückt — 2,5%. Auf demselben Volume liegen Frigate,
      # die PostgreSQL-Backups, der Mail-Import und alle Home-Verzeichnisse;
      # läuft es voll, fällt das alles gleichzeitig aus.
      #
      # Metrik: frigate_storage_free_bytes{storage="/media/frigate/recordings"}
      # misst das gesamte volume1, nicht nur Frigates Anteil. Das ist gewollt —
      # der Alert warnt vor jedem Vollaufen, unabhängig vom Verursacher.
      #
      # Schwellen bei record.retain.mode=all (~100 GB/Tag Durchsatz):
      #   warning  500 GB -> ~5 Tage Vorlauf   critical 250 GB -> ~2,5 Tage
      # Der Steady State von Frigate selbst liegt bei ~500 GB (5 Tage
      # continuous + alerts-Segmente); nach dem Cleanup sind 1,1 TB frei.
      #
      # Dieser Alert ist zugleich das Sicherheitsnetz für record.sync_recordings:
      # dessen Datei-Abort bei >50% Abweichung loggt nur mit logger.debug und
      # ist damit unsichtbar. Sammeln sich erneut Waisen an, sieht man es hier.
  - uid: frigate-recordings-disk-warning
    title: Frigate recordings volume filling up
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          min_over_time(frigate_storage_free_bytes{storage="/media/frigate/recordings"}[10m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [536870912000]           # 500 GiB
        refId: C
    for: 30m
        # noData: frigate-down deckt den Metrik-Ausfall bereits ab -> hier OK,
        # sonst doppelter Alarm beim selben Vorfall.
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Synology volume1 unter 500 GB frei (Frigate-Recordings)"
      description: "Bei mode=all schreibt Frigate ~100 GB/Tag — das reicht noch etwa 5 Tage. Auf volume1 liegen auch PostgreSQL-Backups, Mail-Import und alle Home-Verzeichnisse. Prüfen: 'ssh root@192.168.4.70 df -h /mnt/frigate-recordings' und ob Ordner älter als 31 Tage existieren (= Waisen, siehe record.sync_recordings in config.yml)."

  - uid: frigate-recordings-disk-critical
    title: Frigate recordings volume critically full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          min_over_time(frigate_storage_free_bytes{storage="/media/frigate/recordings"}[10m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [268435456000]           # 250 GiB
        refId: C
    for: 10m
        # noData hier Alerting: fehlt die Serie bei laufendem Frigate, ist der
        # NFS-Mount weg — Aufzeichnung läuft dann ins Leere, ohne dass
        # frigate-down oder camera-fps etwas davon mitbekommen.
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Synology volume1 unter 250 GB frei — ~2,5 Tage bis voll"
      description: "Sofort handeln: volume1 trägt Frigate, PostgreSQL-Backups, Mail-Import und alle Home-Verzeichnisse. Kurzfristig record.retain.days senken oder Altlasten entfernen (/volume1/docker: dump 185 GB, syslog 127 GB, immich-app 88 GB). Bei noData statt Wert: NFS-Mount auf LXC 4502 prüfen — Frigate meldet sich dann weiter als 'up', schreibt aber nichts."

  # ===========================================================================
  # USV — Stromversorgung (EATON Ellipse PRO 650)
  # ===========================================================================
  # Quelle: ups_*-Metriken, von den drei Hypervisoren per Prometheus-Import
  # geschoben (ansible/files/ups-metrics-push.sh). Kein Scrape-Job — die
  # Swarm-Nodes duerfen den NUT-Server auf der Synology nicht abfragen.
  #
  # Eingerichtet nach dem Stromausfall vom 2026-08-21, bei dem alle drei Nodes
  # hart ausfielen und kein einziger Alert den Betreiber erreichte
  # (docs/RCA-STROMAUSFALL-2026-08-21.md, swarm-stacks#121).

- orgId: 1
  name: USV
  folder: Infrastructure
  interval: 60s
  rules:

      # --- Batteriebetrieb --------------------------------------------------
      # for: 2m entspricht der Karenz des Staffelskripts. Kuerzere Netzwischer
      # loesen dort nichts aus und sollen auch hier nicht alarmieren.
  - uid: ups-on-battery
    title: USV im Batteriebetrieb
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: max_over_time(ups_status_on_battery[2m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [0]}
        refId: C
    for: 2m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Stromausfall — USV laeuft auf Batterie"
      description: "Die Karenz von 120 s ist abgelaufen, das Staffelskript hat Ballast abgeworfen und das CRS-Rebalancing angehalten. Reihenfolge und Schwellen im Dashboard 'USV — Stromversorgung'. Abgeschaltet wird bei 60 % / 45 % / 30 % Akkuladung; die Synology folgt bei 20 %."

      # --- Akku faellt in den kritischen Bereich ------------------------------
  - uid: ups-battery-low
    title: USV-Akku unter 50 Prozent
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(ups_battery_charge_percent[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 600, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: lt, params: [50]}
        refId: C
    for: 1m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "USV-Akku unter 50 % — erste Nodes schalten bald ab"
      description: "Bei 45 % faehrt der zweite Node herunter, bei 30 % der Node mit Home Assistant, postgres-prod und Frigate. Ab dann blockiert Ceph (min_size=2 auf drei Hosts). Kommt der Strom nicht zurueck, ist das der geordnete Weg — kein Eingriff noetig, aber der Zeitpunkt zum Mitlesen."

      # --- Ein Node sieht die USV nicht mehr ---------------------------------
      # Der stille Ausfall: Der Node laeuft normal weiter, wuerde im Ernstfall
      # aber nicht gestaffelt herunterfahren. Haeufigste Ursache waere ein
      # Switch, der nicht an der USV haengt.
  - uid: ups-reporter-down
    title: Node erreicht den USV-Server nicht
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 900, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(ups_reporter_up[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 900, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: lt, params: [1]}
        refId: C
    for: 10m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "Ein Hypervisor erreicht den NUT-Server auf der Synology nicht"
      description: "Dieser Node wuerde bei einem Stromausfall NICHT gestaffelt herunterfahren — er faellt auf upsmon/LOWBATT zurueck oder geht hart aus. Pruefen: 'upsc ups@192.168.2.3 ups.status' auf dem betroffenen Node, Freigabe in DSM unter Hardware/USV, und ob der Switch an der USV haengt."

      # --- Batterie am Ende --------------------------------------------------
  - uid: ups-replace-battery
    title: USV meldet Batterietausch
    condition: C
    data:
    - refId: A
      relativeTimeRange: {from: 3600, to: 0}
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(ups_status_replace_battery[30m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange: {from: 3600, to: 0}
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator: {type: gt, params: [0]}
        refId: C
    for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "USV haelt ihre Batterie fuer verbraucht (RB-Flag)"
      description: "Die Batterie wurde 2026-08 auf 9,6 Ah getauscht. Meldet die USV trotzdem RB, ist entweder die neue Batterie defekt oder die Firmware hat sie nach dem Wechsel nie neu kalibriert — Letzteres loest ein vollstaendiger Entladezyklus."

  # ===========================================================================
  # APPLICATIONS — Web-App-Verfügbarkeit (Blackbox)
  # ===========================================================================
  # Source: blackbox_exporter via job=blackbox-apps (60s, http_2xx_tls).
  # Metric: probe_success (1=erreichbar, 0=down). Paperless + Open Archiver
  # haben keine nativen Prometheus-Metrics → Blackbox-Probe auf die öffentliche
  # HTTPS-URL (folgt Redirects: 302/307 → 200). Logik wie frigate-down:
  # min_over_time(...[5m]) + threshold lt 1 + for 5m, noDataState=Alerting
  # (probe_success liefert 0/1 solange der Job läuft; noData = Job/Target weg =
  # echtes Problem). Einzelner Scrape-Miss (Deploy-Restart) feuert nicht;
  # echter Ausfall >~10min schon.

- orgId: 1
  name: Applications
  folder: Applications
  interval: 60s
  rules:

  - uid: paperless-down
    title: Paperless unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(probe_success{job="blackbox-apps", instance="https://paperless.hornung-bn.de"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [1]
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Paperless (paperless.hornung-bn.de) ist nicht erreichbar"
      description: "probe_success=0 für 10+ min (5min min_over_time + 5min for). Check: docker service ps paperless-stack_paperless-webserver, Traefik-Routing, OIDC (Authentik), CephFS-Mount auf dem App-Node."

  - uid: openarchiver-down
    title: Open Archiver unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(probe_success{job="blackbox-apps", instance="https://archive.hornung-bn.de"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [1]
        refId: C
    for: 10m
        # for 10m + min_over_time[5m] = ~15min Debounce gegen Backend-Flapping (:4000 flappt, Healthcheck prueft nur :3000); noDataState OK (EEMUA: kein Chattering)
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Open Archiver (archive.hornung-bn.de) ist nicht erreichbar"
      description: "probe_success=0 für 10+ min. Check: openarchiver_open-archiver — Backend-Port 4000 (Frontend 3000 kann laufen während Backend tot ist! Healthcheck prüft nur 3000 → Service trügerisch 1/1), meili-Index (MDB_CORRUPTED?), Traefik-Routing."

      # --- Open Archiver Tika unreachable (interne Abhängigkeit) ---
      # 2026-06-07: Schließt den blinden Fleck, dass openarchiver-down (Blackbox auf
      # archive.hornung-bn.de) nur die EXTERNE Erreichbarkeit prüft. Tika ist eine
      # interne Abhängigkeit ohne öffentliche URL: fiel es 2h still aus (verwaiste
      # Service-Discovery nach Reschedule, DNS ENOTFOUND), blieb die App "up", aber
      # alle Mails wurden OHNE Anhang-Volltext indexiert. job=blackbox-tika probet
      # openarchiver-tika:9998/version über das openarchiver_default-Overlay.
      # Logik wie openarchiver-down: min_over_time[5m] + lt 1 + for 5m. warning
      # (Degradation, kein Totalausfall — Suche im Mail-Text läuft weiter).
  - uid: openarchiver-tika-down
    title: Open Archiver Tika unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(probe_success{job="blackbox-tika"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [1]
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "Open Archiver Tika nicht erreichbar — Anhänge werden ohne Volltext indexiert"
      description: "probe_success=0 für 10+ min (blackbox-tika gegen openarchiver-tika:9998/version). Open Archiver indexiert Mails dann STILL ohne Anhang-Volltext (PDF/Office/Bilder nicht durchsuchbar), ohne zu crashen — die App bleibt extern erreichbar. Häufigste Ursache: verwaiste Swarm-Service-Discovery nach Tika-Reschedule (DNS ENOTFOUND). Fix: docker service update --force openarchiver_openarchiver-tika; danach von open-archiver aus 'getent hosts openarchiver-tika' + node-fetch verifizieren. Siehe Fall 2026-06-07."

      # --- Ollama (Mac Studio) unreachable — stiller RAG-Ausfall ---
      # Ollama laeuft als LaunchAgent auf dem Mac Studio (192.168.2.236:11434) und
      # ist Inferenz-Backend fuer LightRAG UND paperless-ai. Faellt es aus, schlagen
      # RAG-Queries/AI-Analysen STILL fehl — kein Swarm-Service wird unhealthy
      # (gleiches Blind-Spot-Muster wie Tika 2026-06-07). Semantik "down > 5min":
      # max_over_time[5m] == 0 heisst ALLE Samples im Fenster down (ein einzelner
      # Scrape-Miss, z.B. macOS-Update-Reboot, feuert NICHT); for 1m entprellt ->
      # Alert nach ~6min. severity critical BEWUSST: warning landet im Digest
      # (Zustellung nur 08:00/18:00) und wuerde einen stillen Tages-Ausfall
      # verschleppen. Wird der Mac Studio planbar gewartet: Silence in Grafana.
  - uid: ollama-down
    title: Ollama (Mac Studio) unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max_over_time(probe_success{job="blackbox-ollama"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [1]
        refId: C
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Ollama auf dem Mac Studio (192.168.2.236:11434) ist nicht erreichbar — LightRAG + paperless-ai ohne Inferenz"
      description: "probe_success=0 für 5+ min (blackbox-ollama gegen http://192.168.2.236:11434/api/version). LightRAG-Queries und paperless-ai laufen STILL ins Leere (stiller RAG-Ausfall). Check: Mac Studio an/wach? LaunchAgent: ssh studio 'launchctl list | grep ollama'; curl http://192.168.2.236:11434/api/version. Reranker (:7997) ggf. mitpruefen. Bei geplanter Wartung: Alert-Silence setzen."

      # --- Loki-Ingestion tot (Lehre: lief 2023-2026 MONATELANG still kaputt) ---
      # increase[15m] < 1: die Flotte (13+ Hosts) produziert praktisch immer
      # mindestens eine Syslog-Zeile in 15 min (cron/logrotate/sshd); 0 Zeilen
      # heisst Abriss im Pfad rsyslog -> Alloy:1514 -> Loki. noDataState=Alerting
      # deckt Loki/Alloy-komplett-down ab (Metrik absent). severity critical:
      # gleiches Digest-Verschleppungs-Argument wie ollama-down — ein stiller
      # Ingestion-Abriss soll in Minuten auffallen, nicht in Monaten.
  - uid: loki-ingestion-dead
    title: Loki ingestion dead (keine Syslog-Zeilen mehr)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: sum(increase(loki_distributor_lines_received_total[15m]))
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params: [1]
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Loki-Ingestion tot — seit 15+ min keine einzige Syslog-Zeile von der Flotte"
      description: "sum(increase(loki_distributor_lines_received_total[15m])) < 1. Pfad pruefen: rsyslog (LXCs/VMs) -> Alloy :1514 (monitoring_alloy) -> Loki :3100 (monitoring_loki). Checks: docker service ls | grep -E 'loki|alloy'; curl http://<node>:3100/ready; logger -n 192.168.4.40 -P 1514 --tcp --rfc3164 test && in Loki suchen. DNS: loki.hornung-bn.de muss auf 192.168.4.40/41/42 zeigen. Historie: Ingestion war 2023-2026 monatelang still tot (RFC-Mismatch am NAS-Receiver) — genau das soll nie wieder unbemerkt passieren."

  # ===========================================================================
  # TLS / SSL Certificate Expiry — all public-facing HTTPS endpoints
  # ===========================================================================
  # Source: blackbox_exporter probes configured in prometheus-scrape.yml
  # Metric: probe_ssl_earliest_cert_expiry (unix timestamp of earliest cert)
  # Covers: photos, auth, vault, paperless, n8n, grafana, traefik, uptime,
  #         frigate, admin.frigate (see prometheus-scrape.yml blackbox-https job)

- orgId: 1
  name: TLS Certificates
  folder: Infrastructure
  interval: 60s
  rules:

      # --- Cert valid for < 14 days ---
  - uid: tls-cert-expiring-warn
    title: SSL cert expiring soon
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time()) / 86400 < 14
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "SSL cert for {{ $labels.instance }} expires in < 14 days"
      description: "Let's Encrypt auto-renewal should have fired by now. Check Traefik acme.json, Cloudflare API token validity, and LE rate-limits."

      # --- Cert valid for < 3 days (critical) ---
  - uid: tls-cert-expiring-crit
    title: SSL cert expiring critical
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time()) / 86400 < 3
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params: [0]
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "SSL cert for {{ $labels.instance }} expires in < 3 days — IMMEDIATE ACTION"
      description: "Auto-renewal is broken. Investigate Traefik + Cloudflare DNS-01 challenge. Manual workaround: reissue via Traefik restart or LE CLI."

      # --- Probe itself failed (could mean DNS/network, not just cert) ---
      # 2026-08-25 EINGESCHRÄNKT (ALARM-DESIGN-EEMUA-191, 6.4):
      # paperless.hornung-bn.de und archive.hornung-bn.de stehen in
      # prometheus-scrape.yml in ZWEI Jobs — blackbox-https (Zertifikate,
      # 5m-Intervall) und blackbox-apps (Verfügbarkeit, 60s). Jeder Ausfall
      # dieser beiden Apps erzeugte deshalb zwei Meldungen: paperless-down
      # bzw. openarchiver-down als critical und zusätzlich diese Regel als
      # warning. Am 2026-08-25 war das live zu sehen — probe_success war für
      # paperless.hornung-bn.de in BEIDEN Jobs gleichzeitig 0.
      #
      # Die spezifischen Regeln bleiben unangetastet (sie sind schneller:
      # 60s-Scrape statt 5m, und ihre Runbooks nennen den konkreten Dienst);
      # eingeschränkt wird die allgemeinere Regel hier.
      #
      # KEIN blinder Fleck bei Zertifikaten: tls-cert-expiring-warn/-crit
      # laufen unverändert über ALLE zehn blackbox-https-Ziele, paperless und
      # archive eingeschlossen. Und ein kaputtes Zertifikat bliebe auch hier
      # nicht unbemerkt — der Job blackbox-apps nutzt Modul http_2xx_tls mit
      # insecure_skip_verify: false, ein TLS-Fehler drückt dort probe_success
      # ebenfalls auf 0 und löst die critical-Regel aus.
      #
      # frigate.hornung-bn.de/admin.frigate.hornung-bn.de bleiben bewusst
      # drin, obwohl frigate-down denselben Ausfall meldet: Der Job frigate
      # scrapet mit insecure_skip_verify: true und würde ein abgelaufenes
      # Zertifikat NICHT bemerken. Diese Regel ist dort die einzige
      # TLS-Prüfung mit Verifikation.
  - uid: tls-probe-failed
    title: HTTPS probe failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 1200
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |-
          min_over_time(probe_success{job="blackbox-https", instance!~"https://(paperless|archive).hornung-bn.de"}[15m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 1200
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 20m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "HTTPS probe for {{ $labels.instance }} failing for 20+ min"
      description: "Either service is down, Traefik not routing, DNS broken, or TLS handshake failing. Check app service status first. — Deckt 8 der 10 blackbox-https-Ziele ab; paperless.hornung-bn.de und archive.hornung-bn.de sind seit 2026-08-25 ausgenommen, weil sie über den Job blackbox-apps die dedizierten critical-Regeln paperless-down und openarchiver-down haben (sonst 1 critical + 1 warning je Ausfall). Fehlt hier eine Meldung zu einer dieser beiden Apps, ist das kein blinder Fleck — sieh in der Gruppe 'Applications' nach."

  # ===========================================================================
  # DNS — Technitium Resolver (Prio-1-Infra, 2026-06-15)
  # ===========================================================================
  # Source: blackbox dns_resolve probe (job=blackbox-dns) gegen dns1/2/3.
- orgId: 1
  name: DNS
  folder: Infrastructure
  interval: 60s
  rules:

      # --- Einzelner DNS-Resolver down (Redundanz: 2 Knoten übrig) ---
  - uid: dns-node-down
    title: DNS-Resolver unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(probe_success{job="blackbox-dns"}[3m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 3m
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: "DNS-Resolver {{ $labels.dns_node }} ({{ $labels.instance }}) löst nicht auf"
      description: "Ein Technitium-Knoten antwortet nicht auf DNS-Queries (dns1.hornung-bn.de A). Redundanz: 2 weitere Knoten aktiv. Prüfen: ssh root@<node> 'systemctl status dns' im LXC."

      # --- ALLE DNS-Resolver down (Prio-1-Notfall) ---
  - uid: dns-all-down
    title: ALLE DNS-Resolver down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: |-
          count(max_over_time(probe_success{job="blackbox-dns"}[3m]) == 1) or vector(0)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 3m
        # noDataState: OK — fehlende blackbox-dns-Serie (Exporter-Restart) != DNS tot; count()==0 feuert nur bei ECHTEN 0-Erfolgen (EEMUA)
        # Alerting, nicht OK: Bei dieser Regel IST die fehlende Metrik der
        # Ausfall. Mit noDataState:OK schweigt sie genau dann, wenn sie
        # alarmieren muesste — siehe swarm-stacks#126.
    noDataState: Alerting
        # Auch ein Abfragefehler (VictoriaMetrics nicht erreichbar) darf hier
        # nicht als gesund durchgehen.
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "ALLE DNS-Resolver ausgefallen — Prio-1-Notfall"
      description: "Kein Technitium-Knoten (dns1/2/3) löst mehr auf. Namensauflösung clusterweit tot → Apps/Traefik/Browser brechen. SOFORT prüfen: dns1/2/3 LXC + pve-Hosts."

  # --- GitOps-Orphan-Prune (2026-07-06): leere Alt-Gruppen zwingen den File-Provisioner (provenance=file),
  #     die verwaisten Patroni/etcd-Regeln zu loeschen. Grafana pruned aus Files ENTFERNTE Gruppen NICHT selbst;
  #     die API kann provenance=file-Regeln nicht loeschen ("cannot delete ... needs 'file'"). Leere File-Gruppen
  #     sind der einzige Weg. Nach erfolgreichem Prune in Folge-Commit entfernbar (leere Gruppen sind harmlos).
- orgId: 1
  name: etcd Cluster
  folder: Infrastructure
  interval: 60s
  rules: []
- orgId: 1
  name: PostgreSQL HA
  folder: Databases
  interval: 60s
  rules: []
# Trigger redeploy 2026-06-15: DNS-Probe + DNS-Alerts (Prio-1-Infra) hinzugefügt.
# Trigger redeploy 2026-07-06: EEMUA-Nuisance-Fix (absent/noDataState) + GitOps-Orphan-Prune (etcd/Patroni-Altgruppen).
# Trigger redeploy 2026-08-09: PVE-Hosts-Gruppe (pve-host-memory-pressure + pve-host-metrics-stale) — Fruehwarnung nach den i915-Vorfaellen vom 08.08.

  # =========================================================================
  # Synology NAS (DS918+)
  # =========================================================================
  # Datenquelle ist der snmp-exporter gegen 192.168.2.3 (SNMPv3, SHA/AES).
  # Bis zum 2026-08-24 lieferte er nichts: Der Wrapper erwartete AES, DSM war
  # auf DES eingestellt — und SNMPv3 quittiert einen Protokoll-Mismatch nicht,
  # es antwortet einfach nicht. Deshalb hier eine ausdrueckliche
  # Verfuegbarkeitsregel: Stille darf nicht wieder als Gesundheit durchgehen.
- orgId: 1
  name: Synology NAS
  folder: Infrastructure
  interval: 60s
  rules:
      # --- Verfuegbarkeit ------------------------------------------------------
  - uid: synology-snmp-down
    title: Synology SNMP nicht erreichbar
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(up{job="snmp-synology"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: "Synology antwortet nicht mehr auf SNMP"
      description: "Der snmp-exporter erreicht 192.168.2.3 nicht. Pruefen: laeuft die DiskStation ueberhaupt (Ping), ist SNMP in DSM noch aktiv, und stimmen Auth- und Privacy-Protokoll (SHA/AES) mit dem Wrapper ueberein? Ein Protokoll-Mismatch aeussert sich als Schweigen, nicht als Fehler. Der Dienst haengt an den Secrets synology_snmp_auth_password und synology_snmp_priv_password."

      # --- RAID ----------------------------------------------------------------
      # 1 = Normal. Alles darueber bedeutet Degraded, Crashed oder schlimmer.
  - uid: synology-raid-degraded
    title: Synology RAID nicht normal
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max by (raidName) (raidStatus{job="snmp-synology"}) > 1
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 5m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "Synology {{ $labels.raidName }} meldet Status {{ $value }} statt 1 (Normal)"
      description: "Sofort in DSM nachsehen: Storage Manager, Speicherpool und Volume. Werte: 1 Normal, 2 Repairing, 3 Migrating, 4 Expanding, 5 Deleting, 6 Creating, 7 RaidSyncing, 8 RaidParityChecking, 9 RaidAssembling, 10 Canceling, 11 Degrade, 12 Crashed. Bei 11 oder 12 haengt der Datenbestand an weniger Redundanz als vorgesehen — Backups pruefen, bevor irgendetwas repariert wird."

      # --- Plattentemperatur ---------------------------------------------------
      # Betriebsgrenze der verbauten Platten liegt bei 60 Grad; 50 ist die Schwelle,
      # ab der es sich zu schauen lohnt. Heute liegen alle zwischen 28 und 38 Grad.
  - uid: synology-disk-hot
    title: Synology Platte zu warm
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max by (diskID) (diskTemperature{job="snmp-synology"}) > 50
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 15m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Synology {{ $labels.diskID }} ist {{ $value }} Grad warm"
      description: "Ueber 50 Grad Dauertemperatur verkuerzt die Lebensdauer merklich. Pruefen: Luefterstatus in DSM (systemFanStatus, cpuFanStatus), Aufstellort und Staub. Steigen alle Platten gleichzeitig, ist es die Umgebung oder ein Luefter; steigt nur eine, ist es die Platte selbst."

      # --- Restlebensdauer -----------------------------------------------------
      # Geht per E-MAIL, nicht Telegram: Eine sinkende Restlebensdauer verlangt
      # keine Handlung in der naechsten Stunde, sondern eine Beschaffung in den
      # naechsten Wochen.
      #
      # SCHWELLE 15 STATT 30 (2026-08-26)
      #   Mit 30 % stand die Regel bei 28 % Ist-Wert dauerhaft an und erzeugte
      #   ueber die E-Mail-Route eine Meldung pro TAG — fuer einen Zustand, der
      #   sich um wenige Prozent pro MONAT bewegt. Das ist ein chronischer Alarm
      #   im Sinne von docs/ALARM-DESIGN-EEMUA-191.md Abschnitt 4.3: keine
      #   Stoerung mehr, sondern eine akzeptierte Abweichung. Solche gehoeren
      #   aus dem Alarmkanal heraus und ins Dashboard.
      #
      #   Bei 28 % ist nichts zu tun. Bei 15 % lohnt die Beschaffung, und genau
      #   dann soll die Meldung kommen — einmal, nicht taeglich. Der Verlauf
      #   davor steht auf dem Leitstand (Panel "Daten"), wo er hingehoert:
      #   sichtbar, wenn man hinsieht, ohne jemanden zu unterbrechen.
      #
      #   Die Wiederholung steuert die E-Mail-Route in notification-policies.yml
      #   (repeat_interval 720h = monatlich). Zeitskala des Alarms und Zeitskala
      #   des Zustands muessen zusammenpassen.
      #
      # VERGLEICH IN DER BEDINGUNG, NICHT IN PromQL (2026-08-26)
      #   Vorher stand `< 30` im Ausdruck. Damit lieferte die Query im
      #   Gesundzustand NICHTS — "gesund" und "SNMP tot" waren ununterscheidbar
      #   (Abschnitt 6.1). Jetzt liefert sie immer den Ist-Wert, der Vergleich
      #   sitzt im threshold-Schritt.
      #
      #   noDataState bleibt bewusst OK: Ein Ausfall des SNMP-Exporters ist
      #   bereits durch `synology-snmp-down` (critical) abgedeckt. Hier
      #   zusaetzlich zu alarmieren waere das Duplikat-Muster aus Abschnitt 6.4.
      #
      # Der Filter >= 0 ist zwingend: Festplatten melden -1 fuer "nicht anwendbar".
      # Ohne ihn feuerte die Regel dauerhaft fuer alle vier HDDs.
  - uid: synology-disk-wearout
    title: Synology SSD-Restlebensdauer niedrig
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min by (diskID) (diskRemainLife{job="snmp-synology"} >= 0)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 15
        refId: C
    # 6h statt 1h: Bei einem Zustand, der sich ueber Monate bewegt, ist eine
    # Stunde Bestaetigungszeit Theater. 6h filtert SNMP-Ausreisser zuverlaessig.
    for: 6h
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
      notify: email
    annotations:
      summary: "Synology {{ $labels.diskID }} hat noch {{ $value }} Prozent Restlebensdauer"
      description: "Betrifft die Cache-SSDs; Festplatten melden -1 und sind hier ausgenommen. Ab hier lohnt die Beschaffung — die Meldung wiederholt sich monatlich, nicht taeglich. Wichtig vorher zu klaeren: Ist der Cache als Read-only oder Read-Write eingerichtet? Bei Read-Write kann ein Ausfall Daten kosten, die noch nicht auf die Platten geschrieben sind; bei Read-only ist er folgenlos. Der Verlauf steht auf dem Leitstand im Panel \"Daten\"."

      # --- Volume-Belegung -----------------------------------------------------
      # ABSOLUT statt prozentual. Bei 17,45 TiB waeren 85 Prozent noch 2,6 TB frei
      # — eine solche Meldung ist keine. Was zaehlt, ist der verbleibende Platz in
      # Bytes, nicht sein Anteil am Ganzen.
      # Stand 2026-08-24: 1,81 TiB frei. Die Warnschwelle liegt darunter und
      # feuert deshalb heute nicht.
  - uid: synology-volume-low
    title: Synology Volume wird knapp
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: (hrStorageSize{job="snmp-synology",hrStorageDescr="/volume1"} - hrStorageUsed{job="snmp-synology",hrStorageDescr="/volume1"}) * hrStorageAllocationUnits{job="snmp-synology",hrStorageDescr="/volume1"} < 1e12
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Auf Synology /volume1 ist weniger als 1 TB frei"
      description: "Frigate-Aufnahmen, PostgreSQL-Backups, Mail-Import und die Home-Verzeichnisse teilen sich dieses eine Volume — es laeuft also von mehreren Seiten voll. Nur das Volume betrachten, nicht den Speicherpool: Der meldet dauerhaft rund 197 MB frei, weil er vollstaendig an das Volume vergeben ist."

      # Der Echtalarm. Unter 400 GB wird es eng: Ein einzelner Frigate-Tag oder
      # ein groesserer Backup-Lauf kann das aufbrauchen.
  - uid: synology-volume-critical
    title: Synology Volume fast voll
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: (hrStorageSize{job="snmp-synology",hrStorageDescr="/volume1"} - hrStorageUsed{job="snmp-synology",hrStorageDescr="/volume1"}) * hrStorageAllocationUnits{job="snmp-synology",hrStorageDescr="/volume1"} < 4e11
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 15m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "Auf Synology /volume1 sind unter 400 GB frei"
      description: "Jetzt handeln. Am schnellsten wirkt die Frigate-Retention (5 Tage; jeder Tag weniger schafft spuerbar Platz). Danach alte PBS-Backups und der Mail-Import. Laeuft das Volume voll, stehen Frigate-Aufzeichnung und PostgreSQL-Backups gleichzeitig still."
  - uid: synology-disk-status
    title: Synology Platte nicht normal
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max by (diskID) (diskStatus{job="snmp-synology", diskID!~"0x.*"})
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
      notify: email
    annotations:
      summary: "Synology-Platte {{ $labels.diskID }} meldet Status {{ $value }}"
      description: "diskStatus: 1=Normal 2=Initialized 3=NotInitialized 4=SystemPartitionFailed 5=Crashed. Ab 3 handeln. Das RAID kann dabei noch intakt sein — synology-raid-degraded meldet erst, wenn die Redundanz betroffen ist. Hex-Serien (0x...) sind Altlasten eines Exporter-Kodierungswechsels und ausgefiltert."

      # --- Volume-Belegung -----------------------------------------------------
      # ABSOLUT statt prozentual. Bei 17,45 TiB waeren 85 Prozent noch 2,6 TB frei
      # — eine solche Meldung ist keine. Was zaehlt, ist der verbleibende Platz in
      # Bytes, nicht sein Anteil am Ganzen.
      # Stand 2026-08-24: 1,81 TiB frei. Die Warnschwelle liegt darunter und
      # feuert deshalb heute nicht.
  - uid: synology-disk-health
    title: Synology Plattengesundheit nicht normal
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max by (diskID) (diskHealthStatus{job="snmp-synology", diskID!~"0x.*"})
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
      notify: email
    annotations:
      summary: "Synology-Platte {{ $labels.diskID }} meldet Gesundheit {{ $value }}"
      description: "diskHealthStatus: 1=Normal 2=Warning 3=Critical 4=Failing. Bewusst warning und nicht critical: Im RAID-Verbund ist eine kranke Platte Handlungsbedarf, kein Sofortnotfall. Disk 1 ist 7,95 Jahre alt (69.668 h) und traegt 59 gemeldet-unkorrigierbare Sektoren."

      # --- Volume-Belegung -----------------------------------------------------
      # ABSOLUT statt prozentual. Bei 17,45 TiB waeren 85 Prozent noch 2,6 TB frei
      # — eine solche Meldung ist keine. Was zaehlt, ist der verbleibende Platz in
      # Bytes, nicht sein Anteil am Ganzen.
      # Stand 2026-08-24: 1,81 TiB frei. Die Warnschwelle liegt darunter und
      # feuert deshalb heute nicht.
  - uid: synology-badsector-rising
    title: Synology fehlerhafte Sektoren nehmen zu
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: delta(diskBadSector{job="snmp-synology", diskID!~"Cache device.*|0x.*"}[24h])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
      notify: email
    annotations:
      summary: "{{ $labels.diskID }}: {{ $value }} neue fehlerhafte Sektoren in 24 h"
      description: "Nicht die Hoehe zaehlt, sondern der ANSTIEG — Disk 1 (16) und Disk 3 (32) tragen seit Langem statische Schaeden. delta() statt increase(): increase() rechnet einen Counter-Reset als Ueberlauf hoch und wuerde nach einem Plattentausch falsch alarmieren. Cache devices melden -1 (SNMP-Sentinel fuer \"nicht unterstuetzt\") und sind ausgefiltert."

      # --- Volume-Belegung -----------------------------------------------------
      # ABSOLUT statt prozentual. Bei 17,45 TiB waeren 85 Prozent noch 2,6 TB frei
      # — eine solche Meldung ist keine. Was zaehlt, ist der verbleibende Platz in
      # Bytes, nicht sein Anteil am Ganzen.
      # Stand 2026-08-24: 1,81 TiB frei. Die Warnschwelle liegt darunter und
      # feuert deshalb heute nicht.
  - uid: synology-eth1-down
    title: Synology-Schnittstelle eth1 nicht betriebsbereit
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: min_over_time(ifOperStatus{job="snmp-synology", ifName="eth1"}[5m])
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 10m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
      notify: email
    annotations:
      summary: "Synology eth1 ist nicht up (ifOperStatus {{ $value }})"
      description: "ifOperStatus 1=up. eth1 ist die zweite Schnittstelle — ihr Ausfall kostet Redundanz, nicht die Erreichbarkeit. Faellt die NAS ganz aus, meldet das synology-snmp-down."

      # --- Volume-Belegung -----------------------------------------------------
      # ABSOLUT statt prozentual. Bei 17,45 TiB waeren 85 Prozent noch 2,6 TB frei
      # — eine solche Meldung ist keine. Was zaehlt, ist der verbleibende Platz in
      # Bytes, nicht sein Anteil am Ganzen.
      # Stand 2026-08-24: 1,81 TiB frei. Die Warnschwelle liegt darunter und
      # feuert deshalb heute nicht.

# =============================================================================
# PVE Replikation (pvesr) — ZFS-Replikate zwischen den Hypervisoren
# =============================================================================
# Anlass 2026-08-28: Der naechtliche Wartungs-Reboot von pve03 (Daily
# Maintenance 23:00) liess die minuetlichen Jobs 4502-1/4400-1 ins Reboot-
# Fenster laufen — sichtbar nur als pvescheduler-Mail, Metriken gab es keine.
# postgres-prod (4600), Home Assistant (100) und Frigate (4502) haengen fuer
# PVE-HA an diesen Replikaten: ein stiller Ausfall = veraltetes Failover-Ziel.
# Datenquelle: Textfile-Collector pvesr-metrics.py (minuetlicher Timer auf
# pve01-03, ansible/pve-replication-monitoring.yml), Scrape ueber den Job
# pve-node-exporter. Dashboard: pve-replication.json.
# Geplante Wartung erzeugt hier KEINE Alarme: die Rolle proxmox_maintenance
# pausiert Jobs gegen den rebootenden Node (pvesr_pause/pvesr_resume) und
# hinterlaesst dabei einen Marker, den Regel 4 gegen Vergessen absichert.
- orgId: 1
  name: PVE Replikation
  folder: Infrastructure
  interval: 60s
  rules:

      # --- Job schlaegt wiederholt fehl ---
      # fail_count zaehlt Fehlversuche in Folge; PVE wiederholt mit Backoff
      # (naechster Versuch nach 5/10/15/30min) und setzt bei Erfolg auf 0.
      # Schwelle 3 heisst also ~30min Dauerfehler — der Einmal-Fehler eines
      # Reboot-Fensters (fail_count 1, heilt beim naechsten Versuch) und die
      # dokumentierte Rest-Race der Wartungspause (ein bei Disable schon
      # laufender Sync) bleiben unter der Schwelle. Baseline 2026-08-28:
      # alle Jobs fail_count=0.
      # warning/Digest bewusst: das Replikat altert in Minuten, nicht der
      # Dienst — der Sofort-Fall (postgres-Replikat) hat Regel 3.
  - uid: pvesr-job-failing
    title: PVE Replikationsjob schlaegt wiederholt fehl
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max by (id, guest, target) (pvesr_job_fail_count)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
        refId: C
    for: 0s
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Replikationsjob {{ $labels.id }} (Gast {{ $labels.guest }} → {{ $labels.target }}): {{ $values.A.Value }} Fehlversuche in Folge"
      description: "Fehlertext im Syslog des Quell-Nodes bzw. Loki: {host=~\"pve0[123]\"} |= \"replication\". Status: pvesr status auf dem Quell-Node. Haeufigste Ursachen: Ziel-Node down (pve-host-down pruefen), SSH-Known-Hosts nach Node-Neuinstallation, volle tank-Pools. Manuell anstossen: pvesr schedule-now {{ $labels.id }}."

      # --- Job laeuft nicht mehr (Rueckstand in Zyklen) ---
      # Rueckstand = (jetzt - last_sync) / Job-Intervall, deaktivierte Jobs
      # zaehlen ueber den Faktor (1 - disabled) nicht. Die Normierung auf
      # Zyklen statt Sekunden macht EINE Schwelle fuer */1- wie */15-Jobs
      # moeglich (keine hartkodierten Job-Schwellen). Baseline 2026-08-28:
      # aktive Jobs 0,5-1,2 Zyklen (ein Job steht immer irgendwo in seinem
      # Intervall; kurz ueber 1 waehrend eines laufenden Syncs ist normal).
      # Schwelle 10: */1-Frigate nach 10min, postgres */5 nach 50min,
      # HA */15 nach 2,5h — jeweils weit ausserhalb jeder Wartung, aber vor
      # dem Tagesskalen-Blindflug. Faengt auch den Fall, den fail_count NICHT
      # sieht: pvescheduler tot oder Job haengt (kein Versuch = kein Fehler).
      # Die Query liefert im Gesundzustand fuer jeden aktiven Job einen Wert
      # (EEMUA-Regel: Vergleich in der Threshold-Bedingung, nicht in PromQL).
  - uid: pvesr-job-stale
    title: PVE Replikationsjob laeuft nicht mehr (Sync-Rueckstand)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: (time() - pvesr_job_last_sync_timestamp_seconds) / pvesr_job_schedule_seconds * (1 - pvesr_job_disabled)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
        refId: C
    for: 0s
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "Replikationsjob {{ $labels.id }} (Gast {{ $labels.guest }} → {{ $labels.target }}) ist {{ $values.A.Value }} Intervalle im Rueckstand"
      description: "Der Job versucht es nicht mehr oder kommt nie durch — fail_count kann dabei 0 bleiben (pvescheduler tot, Job haengt). Pruefen auf dem Quell-Node: pvesr status; systemctl status pvescheduler; laufender Sync: ps aux | grep 'pvesr run'. Wartungspause-Marker: ls /etc/pve/.pvesr-maint-paused-*.json (siehe Regel pvesr-maintenance-pause-leaked)."

      # --- postgres-prod-Replikat veraltet (HA-Failover-Ziel) ---
      # Gleiche Formel wie pvesr-job-stale, nur guest=4600 und critical:
      # postgres-prod ist per Proxmox-HA auf genau diese Replikate angewiesen
      # (docs/POSTGRES-SINGLE-VM-HA-MIGRATION-PLAN.md, akzeptiertes RPO ~5min
      # bei */5). Schwelle 24 Zyklen = 2h: ein Failover wuerde dann 2h
      # Datenbank-Schreibarbeit ALLER Apps verwerfen — das rechtfertigt
      # Sofort-Telegram statt Digest (Verschleppungs-Argument wie bei
      # pve-host-memory-pressure). Bewusst zusaetzlich zur warning-Regel:
      # die eskaliert hier, sie ersetzt nicht.
  - uid: pvesr-postgres-replica-stale
    title: postgres-prod ZFS-Replikat veraltet (HA-Failover-Ziel)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: (time() - pvesr_job_last_sync_timestamp_seconds{guest="4600"}) / pvesr_job_schedule_seconds * (1 - pvesr_job_disabled)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 24
        refId: C
    for: 0s
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: critical
    annotations:
      summary: "postgres-prod-Replikat {{ $labels.id }} → {{ $labels.target }} ist {{ $values.A.Value }} Intervalle (>2h) veraltet"
      description: "Das ZFS-Replikat der VM 4600 auf {{ $labels.target }} altert — ein Proxmox-HA-Failover wuerde jetzt >2h Schreibarbeit aller App-Datenbanken verwerfen. Pruefen auf pve02: pvesr status; zfs list -t snapshot tank/vm-4600-disk-0 | tail. Fehlertext: journalctl -u pvescheduler | tail bzw. Loki {host=\"pve02\"} |= \"replication\". Solange der Rueckstand steht, keine HA-Migration der VM 4600 ausloesen."

      # --- Wartungspause vergessen ---
      # Die Rolle proxmox_maintenance pausiert vor einem Reboot alle Jobs
      # gegen den Node und schreibt einen Marker nach /etc/pve
      # (.pvesr-maint-paused-<node>.json, pmxcfs = clusterweit); pvesr_resume
      # entfernt ihn nach der Recovery. Bewusst KEIN always-Block im
      # Playbook: kommt der Node nicht wieder, sollen die Jobs pausiert
      # bleiben — dieser Alert ist das Sicherheitsnetz dagegen, dass das
      # Reaktivieren dauerhaft unterbleibt. Schwelle 2h: die komplette
      # Wartung eines Nodes (apt + Reboot + Ceph-Rejoin) liegt deutlich
      # darunter. Im Gesundzustand liefert die Query konstant 0 (Metrik
      # existiert auf jedem Node), ein absichtliches pvesr disable ohne
      # Marker (VM 112) feuert hier nie.
  - uid: pvesr-maintenance-pause-leaked
    title: PVE Replikation nach Wartung nicht reaktiviert
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: max(pvesr_maintenance_pause_age_seconds)
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 7200
        refId: C
    for: 0s
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "pvesr-Wartungspause ist seit {{ $values.A.Value }}s aktiv — Resume ist nie gelaufen"
      description: "Marker ansehen: cat /etc/pve/.pvesr-maint-paused-*.json (enthaelt Job-IDs und Zeitstempel). Wenn der gewartete Node wieder gesund ist: je Job pvesr enable <id>, dann Marker loeschen. Kommt der Node absichtlich nicht wieder, Jobs auf neues Ziel umziehen und Marker loeschen. Ein 10-Tage-Wert bedeutet: Marker-Datei unlesbar/korrupt (pvesr-metrics.py meldet das so)."

      # --- Collector liefert nicht mehr ---
      # Fehlersemantik von pvesr-metrics.py: schlaegt pvesh fehl, wird die
      # .prom-Datei NICHT angefasst und altert — genau das misst diese Regel
      # ueber node_textfile_mtime_seconds (file-Label ist der VOLLE Pfad).
      # Timer schreibt minuetlich, Schwelle 900s = 15 verpasste Laeufe.
      # Ohne diese Regel waere ein toter Collector unsichtbar: die Job-Serien
      # blieben einfach auf dem letzten Stand stehen bzw. verschwaenden nach
      # der Staleness still (noData→OK bei Regel 1-3). Node komplett down
      # melden pve-host-down/pve-host-metrics-stale — hier noDataState OK.
  - uid: pvesr-metrics-stale
    title: pvesr-Metriken veralten (Collector liefert nicht)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        expr: time() - node_textfile_mtime_seconds{job="pve-node-exporter", file="/var/lib/prometheus/node-exporter/pvesr.prom"}
        instant: true
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 900
        refId: C
    for: 0s
    keep_firing_for: 30m
    noDataState: OK
    execErrState: OK
    labels:
      severity: warning
    annotations:
      summary: "pvesr.prom auf {{ $labels.host }} ist {{ $values.A.Value }}s alt — Collector oder pvesh liefert nicht"
      description: "Auf {{ $labels.host }}: systemctl status pvesr-metrics.timer pvesr-metrics.service; letzter Fehler: journalctl -u pvesr-metrics.service -n 20. Handtest: /usr/local/sbin/pvesr-metrics.py && tail -3 /var/lib/prometheus/node-exporter/pvesr.prom. Ausgerollt von ansible/pve-replication-monitoring.yml."
