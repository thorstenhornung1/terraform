  # ===========================================================================
  # VICTORIAMETRICS — Self-Monitoring
  # ===========================================================================
  # Source: victoriametrics:8428 (job=victoriametrics)

  - orgId: 1
    name: VictoriaMetrics
    folder: Monitoring
    interval: 60s
    rules:

      # --- VM slow inserts (ingestion bottleneck) ---
      - uid: vm-slow-inserts
        title: VictoriaMetrics slow inserts
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                rate(vm_slow_inserts_total{job="victoriametrics"}[5m]) > 0.1
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "VictoriaMetrics is experiencing slow inserts"
          description: "Ingestion is bottlenecked — likely CephFS I/O latency or memory pressure. Check VM memory limits and CephFS health."

      # --- VM high memory usage (>1.5GB of 2GB limit) ---
      - uid: vm-memory-high
        title: VictoriaMetrics memory high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                process_resident_memory_bytes{job="victoriametrics"} > 1610612736
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "VictoriaMetrics using > 1.5GB RAM (limit: 2GB)"
          description: "Container may get OOM-killed. Consider increasing memory limit or reducing retention/cardinality."

      # --- Scrape target down (any job) ---
      - uid: vm-scrape-target-down
        title: Monitoring scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                up{job!~"ceph|homeassistant"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
