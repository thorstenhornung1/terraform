# =============================================================================
# Grafana Alerting — Alert Rules
# =============================================================================
# Provisioned via Docker config at /etc/grafana/provisioning/alerting/
#
# All queries target VictoriaMetrics (Prometheus-compatible PromQL).
# Metric names verified against prometheus-scrape.yml job definitions.
#
# Design principles:
#   - Only alert on conditions requiring human attention
#   - Generous pending periods to avoid flap noise (5min warn, 2min crit)
#   - Group by infrastructure component for triage clarity
#   - Prefer rate/trend queries over instantaneous spikes
# =============================================================================
apiVersion: 1

groups:

  # ===========================================================================
  # DOCKER SWARM — Node Health
  # ===========================================================================
  # Source: node-exporter on 192.168.4.40-42 (job=node-exporter)
  # Instances: docker-infra-1, docker-infra-2, docker-infra-3

  - orgId: 1
    name: Docker Swarm
    folder: Infrastructure
    interval: 60s
    rules:

      # --- Node unreachable (scrape target down) ---
      - uid: swarm-node-down
        title: Swarm node down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: up{job="node-exporter"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Swarm node {{ $labels.instance }} is unreachable"
          description: "node_exporter scrape failed for 2+ minutes. Check if VM is running and Docker is healthy."

      # --- Root filesystem > 90% ---
      - uid: swarm-disk-critical
        title: Disk space critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                100 - (
                  node_filesystem_avail_bytes{job="node-exporter", mountpoint="/", fstype!="tmpfs"}
                  / node_filesystem_size_bytes{job="node-exporter", mountpoint="/", fstype!="tmpfs"}
                  * 100
                ) > 90
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Disk usage > 90% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Root filesystem is critically full. Docker images, logs, or data disk overflow are common causes."

      # --- Root filesystem > 80% ---
      - uid: swarm-disk-warning
        title: Disk space warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                100 - (
                  node_filesystem_avail_bytes{job="node-exporter", mountpoint="/", fstype!="tmpfs"}
                  / node_filesystem_size_bytes{job="node-exporter", mountpoint="/", fstype!="tmpfs"}
                  * 100
                ) > 80
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Disk usage > 80% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Investigate before it becomes critical. Check docker system prune or log rotation."

      # --- Data disk (/srv/data) > 85% ---
      - uid: swarm-datadisk-warning
        title: Data disk filling up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                100 - (
                  node_filesystem_avail_bytes{job="node-exporter", mountpoint="/srv/data", fstype!="tmpfs"}
                  / node_filesystem_size_bytes{job="node-exporter", mountpoint="/srv/data", fstype!="tmpfs"}
                  * 100
                ) > 85
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Data disk > 85% on {{ $labels.instance }}"
          description: "Docker data-root lives on /srv/data. Run docker system prune or check container volumes."

      # --- Sustained high CPU (>85% for 15 min) ---
      - uid: swarm-cpu-high
        title: Sustained high CPU usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])) * 100) > 85
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "CPU > 85% sustained on {{ $labels.instance }}"
          description: "High CPU for 15+ minutes. Check docker stats for runaway containers."

      # --- Sustained high memory (30-min avg > 90% for 20 min) ---
      # 2026-04-24: avg_over_time[30m] smoothed damit Spikes von strukturell-hoch
      # Baseline-Containers (dock01/Legacy) kein Rauschen machen. Nur wenn
      # wirklich 30min lang durchgängig Mittelwert >90% UND das 20min anhält.
      # Paart mit swarm-node-oom-kill (kritisch, deterministisch) — dies ist
      # der pre-event warning, oom-kill der post-event-critical-Alert.
      - uid: swarm-memory-high
        title: Memory usage sustained high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                avg_over_time((100 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} * 100))[30m:1m]) > 90
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 20m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Memory avg(30m) > 90% on {{ $labels.instance }} (sustained 20+ min)"
          description: "Node hat durchgehend hohe Memory-Baseline. Siehe auch swarm-node-oom-kill falls bereits OOMs passiert. Strukturelle Fixe: Container-Memory-Limits anpassen, Legacy-Services reduzieren, Node-RAM vergrößern."

      # --- OOM-Kill detected on any Swarm node (post-event critical) ---
      # 2026-04-24: Kernel-deterministisches Signal — node_vmstat_oom_kill
      # steigt nur wenn der Kernel tatsächlich einen Prozess gekillt hat.
      # Kein Fehlalarm möglich. Feuert sofort (for: 0s) weil jede einzelne
      # OOM-Instanz operativ relevant ist. Analog zu frigate-lxc-oom aus der
      # Frigate NVR Group, aber für alle Swarm-Nodes.
      - uid: swarm-node-oom-kill
        title: Swarm node OOM-killed a process
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                increase(node_vmstat_oom_kill{job="node-exporter"}[10m]) > 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        # 2026-06-30: keep_firing_for entprellt — mehrere OOMs in kurzer Folge
        # (z.B. Memory-Druck-Welle) = EIN Alert-Fenster statt N Telegram (B-01).
        keep_firing_for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "OOM-kill on {{ $labels.instance }} in last 10min"
          description: "Kernel hat einen Prozess gekillt. Check 'dmesg | grep -i oom' auf dem Node für killed process + anon-rss. Siehe auch swarm-memory-high (pre-event warning)."

  # ===========================================================================
  # CEPH STORAGE — Cluster Health
  # ===========================================================================
  # Source: ceph mgr prometheus module on 192.168.12.10-12 (job=ceph)
  # Only the active mgr responds; honor_labels=true handles failover.

  - orgId: 1
    name: Ceph Storage
    folder: Infrastructure
    interval: 60s
    rules:

      # --- i915-GPU-Livelock-Frühwarnung (PVE-Hosts) ---
      # Vorfälle pve03 27.06. + pve01 17.07.2026: Der GEM-Shrinker gerät unter
      # Memory-Druck (vzdump-Fenster) in einen Livelock — "Purging GPU memory"-
      # Sturm im Kernel-Log, Minuten später friert der HOST ein (Hard-Stop aller
      # Guests). Quelle: /usr/local/sbin/i915-guard.sh (systemd-Timer 60s auf
      # pve01-03) pusht die Zeilenzahl der letzten ~70s als i915_purge_lines
      # an den InfluxDB-Ingest. Schwelle 100: normale Shrinker-Aktivität sind
      # einzelne Zeilen; die Vorfall-Stürme lagen bei >1000/min. for: 0s —
      # das Warnfenster vor dem Freeze beträgt nur Minuten, jede Minute zählt.
      - uid: pve-i915-livelock-warning
        title: i915 GPU livelock warning (PVE host)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max_over_time(i915_purge_lines_value[3m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
              refId: C
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "PVE-Host {{ $labels.host }}: i915-Livelock kündigt sich an ({{ $values.A.Value }} Purging-Meldungen/min)"
          description: "GEM-Shrinker-Sturm auf {{ $labels.host }} — Host droht binnen Minuten einzufrieren (Muster 27.06./17.07.). SOFORT: Memory-Druck senken (laufenden vzdump abbrechen: qm/vzdump-Prozess prüfen), Guests notfalls migrieren. RCA-Logs: /root/rca-*-i915-*.log. Kernel-Fix-Status: proxmox-kernel 7.0.14 via daily-maintenance."

      # --- Ceph health not OK ---
      # ceph_health_status: 0=OK, 1=WARN, 2=ERR
      - uid: ceph-health-error
        title: Ceph cluster unhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              # 2026-06-30: max(...) aggregiert die 3 MON-Scrape-Instanzen — eine
              # STALE mgr-Series (z.B. nach mgr-Failover/Crash) kann sonst einen
              # falschen HEALTH_ERR-Critical auslösen. Eine Cluster-Lage = 1 Alert.
              expr: max(ceph_health_status) >= 2
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        # 2026-06-13: for 2m→5m — HEALTH_ERR ist eine Enum, die bei Rebalance/
        # transienten OSD-Stalls kurz oszilliert; 5m verlangt anhaltenden Fehler.
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Ceph cluster is in HEALTH_ERR state"
          description: "Data integrity at risk. Check ceph status on any Proxmox node immediately."

      # --- Ceph health warning (sustained) ---
      # 2026-04-24: min_over_time + längeres for, weil BlueStore-slow-op-alerts
      # intrinsisch im ~10-15min-Rhythmus flappen (osd.2 NVMe-Thermal-Throttling
      # auf pve01, nvme0n1 Sensor 2 = 73°C idle → unter Last Throttle → slow ops).
      # Nur firen wenn WARN durchgehend für 30min+20min=50min — filtert die
      # thermal-throttle-Oszillation, lässt echte sustained issues durch.
      - uid: ceph-health-warning
        title: Ceph cluster warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              # 2026-06-30: max(...) über die 3 MON-Instanzen (stale-mgr-sicher).
              expr: max(min_over_time(ceph_health_status[15m])) == 1
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 20m
        noDataState: OK
        execErrState: OK
        labels:
          # 2026-06-30: warning→info — HEALTH_WARN ist hier ein GELATCHTER Zustand
          # (slow-ops/BlueFS-Indikatoren + alter mgr-Crash klären sich nicht selbst,
          # Wurzel = osd.2-NVMe-Kühlung). Als 'info' nur 12h-Digest-Takt statt 4h →
          # raus aus dem Dauer-Rauschen, bleibt aber sichtbar. ceph-health-error
          # (critical) bleibt scharf für echte ERR-Lagen.
          severity: info
        annotations:
          summary: "Ceph cluster is in HEALTH_WARN state (sustained)"
          description: "HEALTH_WARN für 15+20=35min durchgehend. Check 'ceph health detail'. Bei BLUESTORE_SLOW_OP_ALERT auf osd.2 (pve01 nvme0n1): thermal throttling (Sensor 2 Warning), NVMe braucht Heatsink/bessere Kühlung."

      # --- OSD down ---
      - uid: ceph-osd-down
        title: Ceph OSD down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: count(ceph_osd_up == 0) > 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "One or more Ceph OSDs are down"
          description: "Data redundancy reduced. With 3 OSDs and replication factor 3, one OSD down means no further failures tolerated."

      # --- Ceph pool near full (>80%) ---
      - uid: ceph-pool-nearfull
        title: Ceph pool filling up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                ceph_pool_percent_used > 0.85
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Ceph pool {{ $labels.pool_id }} > 85% full"
          description: "Ceph enters read-only at ~95%. Clean up or expand storage."

  # ===========================================================================
  # PVE HOSTS — Memory-Pressure- & Freeze-Frühwarnung
  # ===========================================================================
  # Source: PVE-Status-Push (/etc/pve/status.cfg → InfluxDB-Proto an
  # VictoriaMetrics :8428, ~10s-Takt via pvestatd). Serien object="nodes",
  # host=pve01/02/03 — u.a. memory_memavailable (= echtes MemAvailable der
  # HOSTS; kein node-exporter auf den PVE-Hosts nötig).
  # Ergänzt pve-i915-livelock-warning (Ceph-Storage-Gruppe). Vorfälle
  # 2026-08-08 (2× an EINEM Tag):
  #   - pve01 13:35 CEST: vzdump 13:30 lief 22min (üblich 2-3min) →
  #     MemAvailable 2.5→0.8 GiB → Purge-Sturm 2628-5371 Zeilen/min →
  #     11min Metrik-Lücke, Host erholte sich.
  #   - pve03 06:07 CEST: KEIN Purge-Sturm im Journal, MemAvailable ~3 GiB,
  #     nur i915-guard-Timer-Drift ab 06:02 — Host fror still ein und blieb
  #     ~6h unbemerkt tot (Hard-Reset erst 12:23). Der i915-Zähler allein
  #     deckt diesen Fall NICHT ab.

  - orgId: 1
    name: PVE Hosts
    folder: Infrastructure
    interval: 60s
    rules:

      # --- MemAvailable kritisch niedrig (Livelock-Vorstufe) ---
      # Schwellwert-Herleitung (7d-Daten, ~10s-Samples, Stand 2026-08-09):
      #   Normalbetrieb-Baseline: pve01 ~3.0 / pve02 ~4.8 / pve03 ~2.5 GiB.
      #   Routine-vzdump-Dip: ~2min auf ~1.1 GiB → avg[5m] bleibt >2 GiB.
      #   Samples <1.25 GiB in 7d: ≤2 je Host (nur die Vorfälle selbst).
      #   Rückwärts-Query Vorfall pve01 08.08. 11:35Z: avg[5m]=0.99 GiB → feuert;
      #   Routine-Backups feuern NICHT (verifiziert 08-07 05:31Z Dip).
      # avg_over_time[5m] statt `for: 5m` BEWUSST: im Livelock reißt der
      # Metrik-Push ab (pve01: 11min Lücke) — eine for:-Pending-Phase würde
      # durch noData resetten; das Query-Fenster hält die letzten Low-Samples
      # und feuert auch noch in der Stille direkt nach Livelock-Beginn.
      # for: 0s + severity critical: das Warnfenster vor dem Freeze beträgt
      # Minuten — warning läge im Digest (Zustellung nur 08:00/18:00) und
      # käme zu spät (gleiches Verschleppungs-Argument wie ollama-down).
      - uid: pve-host-memory-pressure
        title: PVE host memory pressure (MemAvailable low)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: avg_over_time(memory_memavailable{object="nodes"}[5m]) / 2^30
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1.25]
              refId: C
        for: 0s
        # Entprellung: eine Druck-Welle = EIN Alert-Fenster (wie swarm-node-oom-kill).
        keep_firing_for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "PVE-Host {{ $labels.host }}: MemAvailable {{ $values.A.Value }} GiB (5m-Mittel < 1.25) — i915-Livelock-Gefahr"
          description: "Memory-Druck auf {{ $labels.host }} im Bereich der Livelock-Vorfälle (27.06./17.07./08.08.). SOFORT: laufenden vzdump prüfen und ggf. abbrechen (ps aux | grep vzdump), Page-Cache freigeben (sync; echo 1 > /proc/sys/vm/drop_caches), Gäste notfalls migrieren. Siehe auch pve-i915-livelock-warning (Purge-Sturm-Zähler) und pve-host-metrics-stale (Freeze-Detektor)."

      # --- Metrik-Push abgerissen (Host-Freeze-Detektor) ---
      # pvestatd pusht ~alle 10s an VictoriaMetrics. >240s Stille = Host
      # eingefroren oder pvestatd tot. Muster pve03 08.08.: Freeze 06:07,
      # entdeckt erst ~12:20 (≈6h blind, Hard-Reset 12:23). Rückwärts-Query
      # 08.08. 04:15Z: pve03=459s, pve01/pve02=8-9s → hätte ~4min nach dem
      # Freeze alarmiert. tlast_over_time = MetricsQL (Datasource ist
      # VictoriaMetrics, kein Standard-PromQL). [1h]-Fenster: nach 60min ohne
      # Sample fällt die Serie aus dem Ergebnis (noData→OK) — der Alert trägt
      # Minute ~4 bis ~60; den Dauerzustand decken die Folge-Alerts
      # (swarm-node-down, frigate-down, postgres-prod-node-down) ab.
      # Ein geplanter PVE-Reboot (>4min Stille) feuert einmal → bei Wartung
      # Silence setzen (wie ollama-down). VictoriaMetrics-Eigenausfall >4min
      # würde nach Rückkehr kurz für alle 3 Hosts feuern (1 Telegram durch
      # group_by grafana_folder, klärt sich selbst).
      - uid: pve-host-metrics-stale
        title: PVE host metrics stale (Host-Freeze-Verdacht)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: time() - tlast_over_time(memory_memavailable{object="nodes"}[1h])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [240]
              refId: C
        for: 0s
        keep_firing_for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "PVE-Host {{ $labels.host }}: keine Status-Metriken seit {{ $values.A.Value }}s — Host-Freeze-Verdacht"
          description: "pvestatd auf {{ $labels.host }} pusht seit >4min keine Werte (Normaltakt ~10s). Muster pve03 08.08.2026: i915-Freeze 06:07, bemerkt erst ~12:20. Prüfen: ping + SSH auf den Host; eingefroren → Hard-Reset, danach RCA via journalctl -b -1 (i915-Livelock-Muster). Bei geplantem Reboot feuert die Regel einmal — Silence setzen."

  # ===========================================================================
  # POSTGRESQL — Single-VM postgres-prod (192.168.4.45)
  # ===========================================================================
  # 2026-06-15: Patroni-3-Node-Cluster + etcd durch Single-PG-VM ersetzt.
  # Source: prometheus-postgres-exporter (job=postgres-exporter, :9187) +
  # node-exporter (job=node-exporter, instance=postgres-prod, :9100) auf der VM.
  # Alte Patroni-/etcd-Alertgruppen entfernt; bei Reaktivierung aus git holen.

  - orgId: 1
    name: PostgreSQL Single-VM
    folder: Databases
    interval: 60s
    rules:

      # --- postgres-prod postmaster restart-loop (Crash-Loop; portiert aus alter PostgreSQL-HA-Gruppe 2026-07-06) ---
      - uid: postgres-prod-crash-loop
        title: postgres-prod postmaster restart loop
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: changes(pg_postmaster_start_time_seconds{instance="postgres-prod"}[10m]) > 2
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "postgres-prod PostgreSQL postmaster restart loop detected"
          description: "pg_postmaster_start_time_seconds aenderte sich >2x in 10min = Crash-Loop. Check: ssh ansible@192.168.4.45 'sudo journalctl -u postgresql -n 100' (OOM? Disk voll? Corrupt WAL?)"

      # --- postgres-prod DB down (DB läuft nicht / Exporter unerreichbar) ---
      - uid: postgres-prod-down
        title: postgres-prod PostgreSQL down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                pg_up{instance="postgres-prod"} == 0
                or
                up{job="postgres-exporter"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 2m
        # noDataState: OK — Scrape-Luecke != DB down; up{job}==0 faengt Exporter-down MIT Daten ab (EEMUA: keine False-Positives)
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "postgres-prod PostgreSQL is down"
          description: "Single-PG-VM postgres-prod (192.168.4.45) DB unreachable. ALL apps affected. Check: ssh ansible@192.168.4.45 'sudo systemctl status postgresql'"

      # --- postgres-prod VM unreachable (node-exporter down) ---
      - uid: postgres-prod-node-down
        title: postgres-prod VM unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: up{job="node-exporter", instance="postgres-prod"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "postgres-prod VM (192.168.4.45) unreachable"
          description: "node-exporter not responding. VM may be down — check Proxmox (pve02) and HA status."

      # --- postgres-prod disk space critical (< 12% on the data filesystem) ---
      - uid: postgres-prod-disk-critical
        title: postgres-prod disk space critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                min(node_filesystem_avail_bytes{instance="postgres-prod", fstype!~"tmpfs|overlay|squashfs"}
                / node_filesystem_size_bytes{instance="postgres-prod", fstype!~"tmpfs|overlay|squashfs"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [12]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "postgres-prod disk space < 12%"
          description: "Free disk on postgres-prod is critically low. WAL/DB growth can stall PostgreSQL. Check df -h on 192.168.4.45."

      # --- postgres-prod connection saturation (> 80% of max_connections) ---
      - uid: postgres-prod-connections-high
        title: postgres-prod connection saturation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                sum(pg_stat_database_numbackends{instance="postgres-prod"})
                / max(pg_settings_max_connections{instance="postgres-prod"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "postgres-prod using > 80% of max_connections"
          description: "Connection pool near exhaustion. Check for connection leaks (apps without pooling) or raise max_connections."

  # ===========================================================================
  # BACKUPS — Proxmox Backup Server
  # ===========================================================================
  # Source: pbs-exporter on pbs-exporter:10019 (job=pbs-exporter)

  - orgId: 1
    name: Backups
    folder: Infrastructure
    interval: 300s
    rules:

      # --- PBS unreachable ---
      - uid: pbs-down
        title: PBS exporter unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: up{job="pbs-exporter"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Proxmox Backup Server is unreachable"
          description: "PBS exporter cannot connect to pbs.hornung-bn.de. Check if PBS service is running."

      # --- Backup older than 48 hours for any VM ---
      # 2026-06-14: Statt manueller vm_name-Blocklist (retirte VMs wie dock01/100)
      # nun EXISTENZ-basiert: Alert feuert nur, wenn der Gast LIVE im Cluster
      # existiert. "Live" = PVE-Metric-Export liefert in den letzten 60min
      # Per-Gast-Metriken (qemu→blockstat_rd_bytes, lxc→system_uptime). GESTOPPTE
      # Reserve-Gäste haben keine Live-Metriken → automatisch ausgeschlossen.
      # 2026-06-30: dock01 (vm:100) ist eine LAUFENDE HA-Reserve (Memory-Puffer) →
      # emittiert Live-qemu-Metriken → leakt durch den Existenz-Filter. Da bewusst
      # NICHT gesichert, explizit per vm_id!="100" ausgeschlossen (sonst Dauer-Alert).
      # namespace!="Backup" bleibt (Archiv-NS). Label-Brücke: PBS=vm_id, PVE=vmid.
      - uid: pbs-backup-stale
        title: Backup older than 48h
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                (
                  (time() - last_over_time(pbs_snapshot_vm_last_timestamp{namespace!="Backup", vm_id!="100"}[15m]) > 172800)
                  and on(vm_id)
                  (
                    label_replace(count by(vmid)(last_over_time(blockstat_rd_bytes{object="qemu"}[1h])), "vm_id", "$1", "vmid", "(.+)")
                    or
                    label_replace(count by(vmid)(last_over_time(system_uptime{object="lxc"}[1h])), "vm_id", "$1", "vmid", "(.+)")
                  )
                )
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          # 2026-06-30: critical→warning — ein 48h-altes Backup ist kein Sofort-
          # Page (pbs-backup-missed-daily/26h deckt das Frühsignal ab); wandert in
          # den 2x/Tag-Digest statt Instant-Telegram.
          severity: warning
        annotations:
          summary: "Backup >48h: {{ $labels.vm_name }} ({{ $labels.vm_id }})"
          description: "No successful backup in 2 days. Check PBS backup jobs."

      # --- Backup older than 26 hours (missed daily) ---
      # Siehe pbs-backup-stale: EXISTENZ-basiert (2026-06-14) statt vm_name-Blocklist
      # — Alert nur für Gäste, die LIVE im Cluster existieren (PVE-Metric in letzter
      # Stunde). Gestoppte/Reserve-Gäste (dock01) automatisch ausgeschlossen.
      - uid: pbs-backup-missed-daily
        title: Daily backup missed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                (
                  (time() - last_over_time(pbs_snapshot_vm_last_timestamp{namespace!="Backup", vm_id!="100"}[15m]) > 93600)
                  and on(vm_id)
                  (
                    label_replace(count by(vmid)(last_over_time(blockstat_rd_bytes{object="qemu"}[1h])), "vm_id", "$1", "vmid", "(.+)")
                    or
                    label_replace(count by(vmid)(last_over_time(system_uptime{object="lxc"}[1h])), "vm_id", "$1", "vmid", "(.+)")
                  )
                )
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Backup >26h: {{ $labels.vm_name }} ({{ $labels.vm_id }})"
          description: "Last backup is more than 26h old. Daily jobs usually run at 02:00. Check PBS job logs."

  # ===========================================================================
  # HOME ASSISTANT — Smart Home Platform
  # ===========================================================================
  # Source: HA Prometheus integration on 192.168.2.5:8123 (job=homeassistant)
  # Metrics: homeassistant_entity_available, homeassistant_binary_sensor_state

  - orgId: 1
    name: Home Assistant
    folder: Smart Home
    interval: 60s
    rules:

      # --- Home Assistant itself unreachable ---
      - uid: ha-down
        title: Home Assistant unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: up{job="homeassistant"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Home Assistant is unreachable"
          description: "HA Prometheus endpoint not responding on 192.168.2.5:8123. Check VM and HA container."

      # --- HA entities mass-unavailable (OOM / addon-crash canary) ---
      # Interim-Canary 2026-06-14: VM103-OOM (~22:59, vermutlich getriggert durch das
      # nächtliche HA→Synology-Backup) killte ~600 Entities (3510→2880), die die ganze
      # Nacht weg blieben — war NICHT alarmierbar (HA-Core blieb meist up, kein Memory-
      # Sensor). Diese Regel fängt den Symptom-Einbruch. Baseline gesund ~3510 (Band
      # 3506-3517); Schwellwert 3300 = ~6% darunter, weit über OOM-Level (~2880).
      # ABSOLUT (nicht selbst-kalibrierend), damit ein STUNDENLANGER Ausfall feuernd
      # bleibt (max_over_time-Baseline würde nach 3h auf das degradierte Niveau
      # nachziehen und fälschlich clearen). Bei legitimem Entity-Wachstum/Abbau Wert
      # anpassen. severity=critical → sofortige Telegram-Benachrichtigung (kein Digest).
      - uid: ha-entities-mass-unavailable
        title: HA entities mass-unavailable (OOM/addon crash)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: sum(homeassistant_entity_available)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [3300]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "HA: nur {{ $values.A.Value }} Entities verfügbar (<3300, Baseline ~3510)"
          description: "Massiver Entity-Einbruch = Addon-Crash/OOM (z.B. node-red/matter/mariadb nach Memory-Spike, evtl. durch HA-Backup). VM-100-RAM (haos, 6GB seit 2026-07-01) prüfen: ssh root@pve02 'qm config 100 | grep memory'. Verlauf: Grafana → Smart Home."

      # --- HA host memory pressure (OOM-Vorwarnung) ---
      # Ergänzt 2026-06-14 nach HA-OOM. Pre-Event-Warnung (das Pendant zur
      # Post-Event-Regel ha-entities-mass-unavailable). Quelle: HA System-Monitor
      # (sensor.system_monitor_arbeitsspeicherauslastung, % belegt).
      # Doku korrigiert 2026-07-16: HA-VM ist VMID 100 (haos, pve02) mit 6GB seit
      # 2026-07-01 (balloon=maxmem, kein aktives Ballooning) — NICHT mehr VM103/10GB.
      # 85% ≈ 4,9GiB used. Baseline frisch ~56-58%, driftet ohne HA-Neustart auf
      # ~68% (Add-on-Leak-Verdacht); Synology-Backup-Fenster (real 21:15-23:45
      # CEST, nicht "~23:00") legt +~15pp obendrauf.
      # EEMUA-Nuisance-Fix 2026-07-16: Query mit avg_over_time[10m] geglättet —
      # am 14.07. feuerten 3-4 Kurz-Episoden (5-8min) in 2h einzeln. Glättung
      # bündelt dicht aufeinanderfolgende Episoden, filtert Kurz-Blips <5min,
      # anhaltende Lagen alarmieren unverändert.
      # severity critical → sofort, damit vor dem OOM-Kill eingegriffen werden kann.
      - uid: ha-memory-high
        title: HA host memory high (OOM-Vorwarnung)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: avg_over_time(homeassistant_sensor_unit_percent{entity="sensor.system_monitor_arbeitsspeicherauslastung"}[10m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "HA RAM {{ $values.A.Value }}% (10m-Mittel >85%, Baseline frisch ~56%) — OOM droht"
          description: "VM 100 (haos, 6GB) nähert sich der Grenze. Bei ~100% killt der OOM-Killer Addons (Mosquitto/node-red/matter/mariadb) → ~600 Entities fallen aus. Prüfen: ssh root@pve02 'qm config 100 | grep memory'; was allokiert (Add-on-Leak/Backup 21:15-23:45/Integration)? Baseline >65% ohne Backup = Drift → HA-Neustart erwägen. Verlauf: Grafana → Smart Home."

      # --- Zigbee2MQTT bridge offline ---
      - uid: ha-z2m-offline
        title: Zigbee2MQTT bridge offline
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                homeassistant_binary_sensor_state{entity="binary_sensor.zigbee2mqtt_bridge_connection_state"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Zigbee2MQTT bridge is offline"
          description: "All Zigbee devices (lights, sensors, locks) are unreachable. Check Z2M addon and coordinator USB stick."

      # --- HA update available ---
      - uid: ha-update-available
        title: Home Assistant update available
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                homeassistant_update_state{entity=~"update.home_assistant.*"} == 1
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 60m
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          summary: "Home Assistant update available"
          description: "A new HA version is available. Review release notes before updating."

  # ===========================================================================
  # VICTORIAMETRICS — Self-Monitoring
  # ===========================================================================
  # Source: victoriametrics:8428 (job=victoriametrics)

  - orgId: 1
    name: VictoriaMetrics
    folder: Monitoring
    interval: 60s
    rules:

      # --- VM slow inserts (ingestion bottleneck) ---
      - uid: vm-slow-inserts
        title: VictoriaMetrics slow inserts
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                rate(vm_slow_inserts_total{job="victoriametrics"}[5m]) > 0.1
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "VictoriaMetrics is experiencing slow inserts"
          description: "Ingestion is bottlenecked — likely CephFS I/O latency or memory pressure. Check VM memory limits and CephFS health."

      # --- VM high memory usage (>1.5GB of 2GB limit) ---
      - uid: vm-memory-high
        title: VictoriaMetrics memory high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                process_resident_memory_bytes{job="victoriametrics"} > 1610612736
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "VictoriaMetrics using > 1.5GB RAM (limit: 2GB)"
          description: "Container may get OOM-killed. Consider increasing memory limit or reducing retention/cardinality."

      # --- Scrape target down (any job) ---
      - uid: vm-scrape-target-down
        title: Monitoring scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              # 2026-06-30: Catch-all NUR für Jobs OHNE eigenen Down-Alert. Jobs mit
              # dediziertem up-basiertem Alert (node-exporter→swarm-node-down,
              # frigate→frigate-down, postgres-exporter→postgres-prod-down) raus —
              # sonst Doppel-/Dreifach-Alerts pro Ausfall. (blackbox bleibt drin:
              # fängt einen down-Exporter als 1 Alert statt N Probe-Fails ab.)
              expr: |
                up{job!~"ceph|homeassistant|node-exporter|postgres-exporter|frigate"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
          description: "Metrics collection interrupted. Specific component alerts may not fire while target is unreachable."

  # ===========================================================================
  # FRIGATE NVR — Camera Health & Detection
  # ===========================================================================
  # Source: Frigate Prometheus metrics on frigate.hornung-bn.de:443 (job=frigate)
  # LXC 4502 on pve03 with OpenVINO iGPU

  - orgId: 1
    name: Frigate NVR
    folder: Infrastructure
    interval: 60s
    rules:

      # --- Frigate unreachable ---
      # WICHTIG: Expression MUSS immer einen Wert liefern ("up{...}" ohne
      # "== 0"), sonst ergibt OK-Zustand (up=1) ein leeres Query-Result ->
      # Grafana sieht noData -> noDataState "Alerting" feuert als False
      # Positive. Deshalb: "up{job='frigate'}" + Threshold "lt 1". Dann
      # ist noData echt nur bei fehlender Metric (Scrape-Ausfall, Target weg).
      #
      # Smoothing (2026-04-23): min_over_time(...[5m]) liefert 0 nur wenn ALLE
      # Samples der letzten 5min 0 waren — einzelne Scrape-Misses (z.B.
      # Container-Restart nach OOM-Kill, Dauer ~3-5min) feuern keinen Alert
      # mehr. Plus for: 5m — echter Ausfall muss weitere 5min anhalten.
      # Frigate-Restart <10min total = kein Alert. Erst echter Ausfall firet.
      - uid: frigate-down
        title: Frigate NVR unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: min_over_time(up{job="frigate"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Frigate NVR is unreachable"
          description: "Frigate metrics endpoint not responding for 10+ min (5min min_over_time window + 5min for). Check LXC 4502 on pve03, CephFS mount, Docker containers, and OOM-kill history."

      # --- Camera detection stopped (any camera with 0 FPS for 5 min) ---
      - uid: frigate-camera-no-detection
        title: Frigate camera not detecting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                frigate_camera_fps{job="frigate"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        # 2026-06-13: for 5m→10m — FPS fällt bei RTSP-/Netz-Stottern kurz auf 0;
        # 10m verlangt anhaltenden Ausfall (gegen transiente Kamera-Blips).
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          # 2026-06-30: critical→warning — eine EINZELNE Kamera auf 0 FPS ist kein
          # Notfall (Frigate selbst läuft, frigate-down deckt den Total-Ausfall).
          # Wandert in den Digest statt Instant-Page.
          severity: warning
        annotations:
          summary: "Frigate camera {{ $labels.camera_name }} has 0 FPS"
          description: "Camera feed is not being received. Check camera network, RTSP stream, or ffmpeg process in Frigate logs."

      # --- Camera pipeline stalled (Stream liefert, Verarbeitung tot) ---
      # Fehlerbild 12.07.+14.07.2026: OpenVINO-Detektor haengt ("Detection appears
      # to be stuck" + Force-Kill im frigate.watchdog), danach bleiben einzelne
      # Kamera-Prozesse im Deadlock: camera_fps normal (Stream lebt), aber
      # process_fps ~0 / skipped_fps = camera_fps. Livebild eingefroren, keine
      # Objekte, Recording-Segmente werden verworfen. frigate-camera-no-detection
      # (camera_fps==0) greift hier NICHT, der ffmpeg-Watchdog heilt es NICHT.
      #
      # Expression: process_fps (max ueber 10m) NUR fuer Kameras mit lebendem
      # Stream (camera_fps > 0.5). Kamera komplett tot -> Serie faellt raus ->
      # noData -> OK (deckt frigate-camera-no-detection); Scrape weg -> deckt
      # frigate-down. Threshold lt 0.5: gesund sind 2-5 fps (doorbird 2, Reolink 5).
      # ACHTUNG: setzt voraus, dass keine Kamera mit detect-fps < 1 konfiguriert wird.
      #
      # Schutzzeit: max_over_time[10m] + for 15m = ~25min anhaltender Stall vor
      # Alarm. Begruendung: Frigate-/LXC-Neustart = 3-5min Metrik-Luecke+Ramp-up
      # (Reboot 13.07. 19:28), Detector-Restart <1min — beides feuert nicht.
      # Beobachtete echte Staelle: 0.9h-20.4h. keep_firing_for 30m: garten
      # flappte am 15.07. 02:05-04:25 im 10-20min-Takt tot/lebendig — das wird
      # zu EINEM Alarm entprellt (Hysterese, EEMUA 191 Anti-Flap).
      - uid: frigate-camera-pipeline-stalled
        title: Frigate camera pipeline stalled (stream ok, processing dead)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                max_over_time(frigate_process_fps{job="frigate"}[10m])
                  and (max_over_time(frigate_camera_fps{job="frigate"}[10m]) > 0.5)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.5]
              refId: C
        for: 15m
        keep_firing_for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          # Einzelne Kamera degradiert, Frigate laeuft -> warning/Digest
          # (Konvention 2026-06-30, analog frigate-camera-no-detection).
          severity: warning
        annotations:
          summary: "Frigate camera {{ $labels.camera_name }}: stream ok but pipeline stalled"
          description: "Kamera liefert Frames (camera_fps > 0), aber Frigate verarbeitet sie nicht (process_fps < 0.5 fuer 25+ min): Livebild eingefroren, keine Detection, Recording-Luecken. Typische Ursache: Kamera-Prozess-Deadlock nach OpenVINO-Detektor-Hang (docker logs frigate | grep -i stuck). Fix: Frigate-Container neu starten (192.168.4.70: cd /opt/frigate/compose && docker compose restart frigate). ffmpeg-Watchdog-Restarts und Kamera-Reboots heilen das NICHT."

      # --- OOM-kill watchdog on pve03 (Frigate-LXC Memory-Druck) ---
      # Signal aus node-exporter: node_vmstat_oom_kill steigt bei jedem OOM.
      # 2026-04-23: 4 OOM-Kills in 48h auf frigate.capture (2.5-4.8GB anon-rss).
      # LXC 4502 wurde auf 12 GiB + 4 GiB swap angehoben — dieser Alert warnt,
      # falls der Workload trotzdem wieder an die neue Grenze läuft.
      - uid: frigate-lxc-oom
        title: OOM-kill on pve03 (Frigate host)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                increase(node_vmstat_oom_kill{instance=~"pve03.*|192\\.168\\.4\\.42.*"}[10m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        keep_firing_for: 30m   # 2026-06-30: OOM-Welle entprellen (1 Fenster statt N)
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "OOM-kill on pve03 in last 10min — likely Frigate LXC 4502"
          description: "node_vmstat_oom_kill increased. Frühwarnung: Frigate-Container wurde vom Kernel gekillt. Check 'pct exec 4502 -- dmesg | tail' für killed processes + anon-rss values. Bei wiederholtem Auftreten: memory/swap im LXC weiter anheben (aktuell 12 GiB + 4 GiB swap)."

  # ===========================================================================
  # APPLICATIONS — Web-App-Verfügbarkeit (Blackbox)
  # ===========================================================================
  # Source: blackbox_exporter via job=blackbox-apps (60s, http_2xx_tls).
  # Metric: probe_success (1=erreichbar, 0=down). Paperless + Open Archiver
  # haben keine nativen Prometheus-Metrics → Blackbox-Probe auf die öffentliche
  # HTTPS-URL (folgt Redirects: 302/307 → 200). Logik wie frigate-down:
  # min_over_time(...[5m]) + threshold lt 1 + for 5m, noDataState=Alerting
  # (probe_success liefert 0/1 solange der Job läuft; noData = Job/Target weg =
  # echtes Problem). Einzelner Scrape-Miss (Deploy-Restart) feuert nicht;
  # echter Ausfall >~10min schon.

  - orgId: 1
    name: Applications
    folder: Applications
    interval: 60s
    rules:

      - uid: paperless-down
        title: Paperless unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: min_over_time(probe_success{job="blackbox-apps", instance="https://paperless.hornung-bn.de"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Paperless (paperless.hornung-bn.de) ist nicht erreichbar"
          description: "probe_success=0 für 10+ min (5min min_over_time + 5min for). Check: docker service ps paperless-stack_paperless-webserver, Traefik-Routing, OIDC (Authentik), CephFS-Mount auf dem App-Node."

      - uid: openarchiver-down
        title: Open Archiver unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: min_over_time(probe_success{job="blackbox-apps", instance="https://archive.hornung-bn.de"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 10m
        # for 10m + min_over_time[5m] = ~15min Debounce gegen Backend-Flapping (:4000 flappt, Healthcheck prueft nur :3000); noDataState OK (EEMUA: kein Chattering)
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Open Archiver (archive.hornung-bn.de) ist nicht erreichbar"
          description: "probe_success=0 für 10+ min. Check: openarchiver_open-archiver — Backend-Port 4000 (Frontend 3000 kann laufen während Backend tot ist! Healthcheck prüft nur 3000 → Service trügerisch 1/1), meili-Index (MDB_CORRUPTED?), Traefik-Routing."

      # --- Open Archiver Tika unreachable (interne Abhängigkeit) ---
      # 2026-06-07: Schließt den blinden Fleck, dass openarchiver-down (Blackbox auf
      # archive.hornung-bn.de) nur die EXTERNE Erreichbarkeit prüft. Tika ist eine
      # interne Abhängigkeit ohne öffentliche URL: fiel es 2h still aus (verwaiste
      # Service-Discovery nach Reschedule, DNS ENOTFOUND), blieb die App "up", aber
      # alle Mails wurden OHNE Anhang-Volltext indexiert. job=blackbox-tika probet
      # openarchiver-tika:9998/version über das openarchiver_default-Overlay.
      # Logik wie openarchiver-down: min_over_time[5m] + lt 1 + for 5m. warning
      # (Degradation, kein Totalausfall — Suche im Mail-Text läuft weiter).
      - uid: openarchiver-tika-down
        title: Open Archiver Tika unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: min_over_time(probe_success{job="blackbox-tika"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Open Archiver Tika nicht erreichbar — Anhänge werden ohne Volltext indexiert"
          description: "probe_success=0 für 10+ min (blackbox-tika gegen openarchiver-tika:9998/version). Open Archiver indexiert Mails dann STILL ohne Anhang-Volltext (PDF/Office/Bilder nicht durchsuchbar), ohne zu crashen — die App bleibt extern erreichbar. Häufigste Ursache: verwaiste Swarm-Service-Discovery nach Tika-Reschedule (DNS ENOTFOUND). Fix: docker service update --force openarchiver_openarchiver-tika; danach von open-archiver aus 'getent hosts openarchiver-tika' + node-fetch verifizieren. Siehe Fall 2026-06-07."

      # --- Ollama (Mac Studio) unreachable — stiller RAG-Ausfall ---
      # Ollama laeuft als LaunchAgent auf dem Mac Studio (192.168.2.236:11434) und
      # ist Inferenz-Backend fuer LightRAG UND paperless-ai. Faellt es aus, schlagen
      # RAG-Queries/AI-Analysen STILL fehl — kein Swarm-Service wird unhealthy
      # (gleiches Blind-Spot-Muster wie Tika 2026-06-07). Semantik "down > 5min":
      # max_over_time[5m] == 0 heisst ALLE Samples im Fenster down (ein einzelner
      # Scrape-Miss, z.B. macOS-Update-Reboot, feuert NICHT); for 1m entprellt ->
      # Alert nach ~6min. severity critical BEWUSST: warning landet im Digest
      # (Zustellung nur 08:00/18:00) und wuerde einen stillen Tages-Ausfall
      # verschleppen. Wird der Mac Studio planbar gewartet: Silence in Grafana.
      - uid: ollama-down
        title: Ollama (Mac Studio) unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max_over_time(probe_success{job="blackbox-ollama"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Ollama auf dem Mac Studio (192.168.2.236:11434) ist nicht erreichbar — LightRAG + paperless-ai ohne Inferenz"
          description: "probe_success=0 für 5+ min (blackbox-ollama gegen http://192.168.2.236:11434/api/version). LightRAG-Queries und paperless-ai laufen STILL ins Leere (stiller RAG-Ausfall). Check: Mac Studio an/wach? LaunchAgent: ssh studio 'launchctl list | grep ollama'; curl http://192.168.2.236:11434/api/version. Reranker (:7997) ggf. mitpruefen. Bei geplanter Wartung: Alert-Silence setzen."

      # --- Loki-Ingestion tot (Lehre: lief 2023-2026 MONATELANG still kaputt) ---
      # increase[15m] < 1: die Flotte (13+ Hosts) produziert praktisch immer
      # mindestens eine Syslog-Zeile in 15 min (cron/logrotate/sshd); 0 Zeilen
      # heisst Abriss im Pfad rsyslog -> Alloy:1514 -> Loki. noDataState=Alerting
      # deckt Loki/Alloy-komplett-down ab (Metrik absent). severity critical:
      # gleiches Digest-Verschleppungs-Argument wie ollama-down — ein stiller
      # Ingestion-Abriss soll in Minuten auffallen, nicht in Monaten.
      - uid: loki-ingestion-dead
        title: Loki ingestion dead (keine Syslog-Zeilen mehr)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: sum(increase(loki_distributor_lines_received_total[15m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Loki-Ingestion tot — seit 15+ min keine einzige Syslog-Zeile von der Flotte"
          description: "sum(increase(loki_distributor_lines_received_total[15m])) < 1. Pfad pruefen: rsyslog (LXCs/VMs) -> Alloy :1514 (monitoring_alloy) -> Loki :3100 (monitoring_loki). Checks: docker service ls | grep -E 'loki|alloy'; curl http://<node>:3100/ready; logger -n 192.168.4.40 -P 1514 --tcp --rfc3164 test && in Loki suchen. DNS: loki.hornung-bn.de muss auf 192.168.4.40/41/42 zeigen. Historie: Ingestion war 2023-2026 monatelang still tot (RFC-Mismatch am NAS-Receiver) — genau das soll nie wieder unbemerkt passieren."

  # ===========================================================================
  # TLS / SSL Certificate Expiry — all public-facing HTTPS endpoints
  # ===========================================================================
  # Source: blackbox_exporter probes configured in prometheus-scrape.yml
  # Metric: probe_ssl_earliest_cert_expiry (unix timestamp of earliest cert)
  # Covers: photos, auth, vault, paperless, n8n, grafana, traefik, uptime,
  #         frigate, admin.frigate (see prometheus-scrape.yml blackbox-https job)

  - orgId: 1
    name: TLS Certificates
    folder: Infrastructure
    interval: 60s
    rules:

      # --- Cert valid for < 14 days ---
      - uid: tls-cert-expiring-warn
        title: SSL cert expiring soon
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time()) / 86400 < 14
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "SSL cert for {{ $labels.instance }} expires in < 14 days"
          description: "Let's Encrypt auto-renewal should have fired by now. Check Traefik acme.json, Cloudflare API token validity, and LE rate-limits."

      # --- Cert valid for < 3 days (critical) ---
      - uid: tls-cert-expiring-crit
        title: SSL cert expiring critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time()) / 86400 < 3
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "SSL cert for {{ $labels.instance }} expires in < 3 days — IMMEDIATE ACTION"
          description: "Auto-renewal is broken. Investigate Traefik + Cloudflare DNS-01 challenge. Manual workaround: reissue via Traefik restart or LE CLI."

      # --- Probe itself failed (could mean DNS/network, not just cert) ---
      - uid: tls-probe-failed
        title: HTTPS probe failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                last_over_time(probe_success{job="blackbox-https"}[15m]) == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 20m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "HTTPS probe for {{ $labels.instance }} failing for 20+ min"
          description: "Either service is down, Traefik not routing, DNS broken, or TLS handshake failing. Check app service status first."

  # ===========================================================================
  # DNS — Technitium Resolver (Prio-1-Infra, 2026-06-15)
  # ===========================================================================
  # Source: blackbox dns_resolve probe (job=blackbox-dns) gegen dns1/2/3.
  - orgId: 1
    name: DNS
    folder: Infrastructure
    interval: 60s
    rules:

      # --- Einzelner DNS-Resolver down (Redundanz: 2 Knoten übrig) ---
      - uid: dns-node-down
        title: DNS-Resolver unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: probe_success{job="blackbox-dns"} == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "DNS-Resolver {{ $labels.dns_node }} ({{ $labels.instance }}) löst nicht auf"
          description: "Ein Technitium-Knoten antwortet nicht auf DNS-Queries (dns1.hornung-bn.de A). Redundanz: 2 weitere Knoten aktiv. Prüfen: ssh root@<node> 'systemctl status dns' im LXC."

      # --- ALLE DNS-Resolver down (Prio-1-Notfall) ---
      - uid: dns-all-down
        title: ALLE DNS-Resolver down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: |
                count(probe_success{job="blackbox-dns"} == 1) == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 3m
        # noDataState: OK — fehlende blackbox-dns-Serie (Exporter-Restart) != DNS tot; count()==0 feuert nur bei ECHTEN 0-Erfolgen (EEMUA)
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "ALLE DNS-Resolver ausgefallen — Prio-1-Notfall"
          description: "Kein Technitium-Knoten (dns1/2/3) löst mehr auf. Namensauflösung clusterweit tot → Apps/Traefik/Browser brechen. SOFORT prüfen: dns1/2/3 LXC + pve-Hosts."

  # --- GitOps-Orphan-Prune (2026-07-06): leere Alt-Gruppen zwingen den File-Provisioner (provenance=file),
  #     die verwaisten Patroni/etcd-Regeln zu loeschen. Grafana pruned aus Files ENTFERNTE Gruppen NICHT selbst;
  #     die API kann provenance=file-Regeln nicht loeschen ("cannot delete ... needs 'file'"). Leere File-Gruppen
  #     sind der einzige Weg. Nach erfolgreichem Prune in Folge-Commit entfernbar (leere Gruppen sind harmlos).
  - orgId: 1
    name: etcd Cluster
    folder: Infrastructure
    interval: 60s
    rules: []
  - orgId: 1
    name: PostgreSQL HA
    folder: Databases
    interval: 60s
    rules: []
# Trigger redeploy 2026-06-15: DNS-Probe + DNS-Alerts (Prio-1-Infra) hinzugefügt.
# Trigger redeploy 2026-07-06: EEMUA-Nuisance-Fix (absent/noDataState) + GitOps-Orphan-Prune (etcd/Patroni-Altgruppen).
# Trigger redeploy 2026-08-09: PVE-Hosts-Gruppe (pve-host-memory-pressure + pve-host-metrics-stale) — Fruehwarnung nach den i915-Vorfaellen vom 08.08.
