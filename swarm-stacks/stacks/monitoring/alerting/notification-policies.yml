# =============================================================================
# Grafana Alerting — Notification Policies (Routing)
# =============================================================================
# Routes alerts to contact points based on severity and component.
#
# Routing logic:
#   - critical → telegram-critical (sofort; repeat 4h, group_interval 5m)
#   - warning  → telegram-default  (DIGEST: still gemutet, Zustellung nur in den
#                                   Fenstern 08:00–08:15 / 18:00–18:15, silent)
#   - info     → telegram-default  (DIGEST: gleiche Fenster, silent)
#
# Anti-Spam-Design (2026-06-13, User-Entscheidung):
#   - warning/info referenzieren das Zeitintervall `outside-digest-windows`
#     (mute-times.yml) per `mute_time_intervals` → werden NUR zu festen Zeiten
#     zugestellt ("Zusammenfassung zu festen Zeiten") statt bei jedem Flap.
#   - group_by auf [grafana_folder] verbreitert → ein Telegram je Ordner/Fenster
#     statt eine Nachricht pro Alert.
#   - critical bleibt ungemutet und behält die Entwarnung (✅ RESOLVED).
# =============================================================================
apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram-default
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts: immediate delivery, entschärfter Wiederhol-Takt
      # (2026-06-13: repeat 1h→4h, group_interval 2m→5m — echte Notlagen kommen
      # weiter sofort, aber ein dauer-feuernder critical wiederholt nicht im
      # Minutentakt). Kein Mute, behält Entwarnung.
      # E-Mail statt Telegram: fuer Befunde, die wichtig sind, aber keine
      # sofortige Handlung verlangen — etwa eine Cache-SSD, deren Restlebensdauer
      # sinkt. Telegram ist fuer Dinge da, die JETZT jemanden erreichen muessen;
      # alles andere verrauscht den Kanal und macht ihn mit der Zeit unwirksam.
      #
      # Angesteuert ueber das Label notify=email an der Regel, nicht ueber die
      # severity — so bleibt die Dringlichkeit unabhaengig vom Zustellweg
      # beschreibbar. Steht VOR den severity-Routen, weil continue:false gilt und
      # die erste passende Route gewinnt.
      # Waechter ueber die Telegram-Zustellung selbst: darf nicht NUR ueber
      # Telegram laufen (Vorfall 26.–28.08.2026: parse_mode-HTML-400 → zwei
      # Tage stiller Totalausfall, und der Waechter feuerte in den toten
      # Kanal). continue:true — die Mail ist der garantierte Weg, danach
      # faellt der Alert weiter in die severity=critical-Route und versucht
      # Telegram ZUSAETZLICH (bei partiellem Ausfall kommt er dort noch an).
      # Eigene Route statt notify=email: deren 720h-Takt ist fuer
      # Monatsskala-Befunde — ein toter Alarmkanal soll taeglich erinnern,
      # bis er repariert ist.
      - receiver: email-homelab
        matchers:
          - notify = email-urgent
        group_by:
          - grafana_folder
        group_wait: 1m
        group_interval: 15m
        repeat_interval: 24h
        continue: true

      - receiver: email-homelab
        matchers:
          - notify = email
        group_by:
          - grafana_folder
        group_wait: 5m
        group_interval: 1h
        # MONATLICH, nicht taeglich (2026-08-26).
        #
        # Hier landen Befunde, die sich auf einer Zeitskala von WOCHEN bis
        # MONATEN bewegen — der erste ist die Restlebensdauer der Cache-SSD.
        # Mit 24h erzeugte ein Wert, der sich um wenige Prozent im Monat
        # aendert, rund 30 identische Mails, in denen nie etwas Neues stand.
        # Das ist genau die Alarm-Ermuedung, gegen die die Route gebaut wurde:
        # Wer eine Mail taeglich unveraendert bekommt, filtert sie weg — und
        # uebersieht dann die eine, in der sich der Wert bewegt hat.
        #
        # Die Regel gibt die Zeitskala vor, nicht der Zustellweg: Ein Alarm,
        # dessen Ursache Monate braucht, wird monatlich erinnert. Braucht ein
        # kuenftiger E-Mail-Befund eine kuerzere Wiederholung, gehoert er nicht
        # hierher, sondern bekommt eine eigene Route.
        repeat_interval: 720h
        continue: false
      
      - receiver: telegram-critical
        matchers:
          - severity = critical
        # 2026-06-30: group_by NUR grafana_folder (überschreibt das geerbte
        # [grafana_folder, alertname]). Ein Incident-Sturm in EINEM Ordner
        # (z.B. pve03-Freeze: swarm-node-down + frigate-down + camera gleichzeitig)
        # kommt damit als EIN Telegram statt 4+. group_wait 10s→30s sammelt
        # korrelierte Criticals kurz, bevor gesendet wird.
        group_by:
          - grafana_folder
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        continue: false

      # Warning alerts: DIGEST — nur in den Fenstern 08:00–08:15 / 18:00–18:15
      # zugestellt (mute außerhalb), breit gebündelt je Ordner.
      - receiver: telegram-default
        matchers:
          - severity = warning
        group_by:
          - grafana_folder
        group_wait: 60s
        group_interval: 15m
        repeat_interval: 4h
        mute_time_intervals:
          - outside-digest-windows
        continue: false

      # Info alerts: DIGEST — gleiche Fenster, langer Wiederhol-Takt (FYI).
      - receiver: telegram-default
        matchers:
          - severity = info
        group_by:
          - grafana_folder
        group_wait: 120s
        group_interval: 30m
        repeat_interval: 12h
        mute_time_intervals:
          - outside-digest-windows
        continue: false
