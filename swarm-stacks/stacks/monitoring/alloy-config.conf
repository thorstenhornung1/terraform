// ============================================================================
// Grafana Alloy — Syslog-Gateway fuer rsyslog-Forwards → Loki
// ============================================================================
// ALLE LXCs/VMs senden per Standard-Provisioning:
//   *.* @@loki.hornung-bn.de:1514   (TCP, primaer)
//   *.* @loki.hornung-bn.de:1514    (UDP, Fallback)
// rsyslog omfwd sendet dabei RFC3164 (traditionelles Format, LF-Framing).
// WICHTIG: syslog_format = "rfc3164" ist der eigentliche Fix — der alte
// (unverwaltete) Promtail-Receiver auf der Diskstation nahm nur RFC5424 an
// und verwarf saemtliche rsyslog-Forwards (Root Cause der toten Ingestion).
//
// Datei heisst .conf (nicht .alloy), damit der GitOps-Content-Hash-Glob
// (*.yml|sh|conf|cfg|json) sie erfasst → ALLOY_CONFIG_HASH.
// ============================================================================

loki.source.syslog "rsyslog_gateway" {
  listener {
    address                         = "0.0.0.0:1514"
    protocol                        = "tcp"
    syslog_format                   = "rfc3164"
    rfc3164_default_to_current_year = true
    use_incoming_timestamp          = true
    // rsyslog haelt langlebige TCP-Verbindungen; der Promtail-Default (120s)
    // erzeugte staendige Disconnects (CLOSE-WAIT auf den Sendern).
    idle_timeout                    = "24h"
    labels                          = { job = "syslog", protocol = "tcp" }
  }

  listener {
    address                         = "0.0.0.0:1514"
    protocol                        = "udp"
    syslog_format                   = "rfc3164"
    rfc3164_default_to_current_year = true
    use_incoming_timestamp          = true
    labels                          = { job = "syslog", protocol = "udp" }
  }

  relabel_rules = loki.relabel.syslog.rules
  forward_to    = [loki.write.default.receiver]
}

loki.relabel "syslog" {
  forward_to = []

  rule {
    source_labels = ["__syslog_message_hostname"]
    target_label  = "host"
  }
  rule {
    source_labels = ["__syslog_message_app_name"]
    target_label  = "app"
  }
  rule {
    source_labels = ["__syslog_message_severity"]
    target_label  = "severity"
  }
  rule {
    source_labels = ["__syslog_message_facility"]
    target_label  = "facility"
  }
}

loki.write "default" {
  endpoint {
    url = "http://loki:3100/loki/api/v1/push"
  }
}
