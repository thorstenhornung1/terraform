# =============================================================================
# Monitoring Stack — VictoriaMetrics + Grafana + vmagent + node_exporter
# =============================================================================
# Deploy: GitOps via ssh-deploy. Content-hash naming for all config files
# (prometheus-scrape.yml, dashboards/*.json, alerting/*.yml, grafana-entrypoint.sh).
# Workflow-Glob wurde 2026-04-21 um .cfg erweitert; dieser commit triggert
# redeploy mit korrekt berechneten hashes (vorher _latest-Fallback).
#
# Central infrastructure monitoring for Docker Swarm cluster.
#
# Components:
#   - VictoriaMetrics: Time-series database (Prometheus + InfluxDB LP compatible)
#   - vmagent: Scrape agent (Prometheus-compatible, remote-writes to VM)
#   - Grafana 11.x: Dashboards at https://grafana.hornung-bn.de
#   - node_exporter: Host metrics (CPU, RAM, disk, network) on all Swarm nodes
#
# Storage: CephFS (/mnt/cephfs/swarm-state/stack-monitoring/)
#   victoriametrics-data/ — TSDB data (~10GB/year at homelab scale)
#   vmagent-data/         — WAL buffer for remote-write retries
#   grafana/              — Grafana SQLite DB, plugins, sessions
#
# Proxmox Integration (Phase 2):
#   Proxmox Datacenter → Metric Server → Add InfluxDB:
#     Server: 192.168.4.40, Port: 8428, Protocol: HTTP
#   VictoriaMetrics accepts InfluxDB Line Protocol natively on /write.
#
# Prerequisites:
#   1. CephFS dirs:
#      mkdir -p /mnt/cephfs/swarm-state/stack-monitoring/{victoriametrics-data,vmagent-data,grafana}
#      chown -R 472:472 /mnt/cephfs/swarm-state/stack-monitoring/grafana
#   2. Docker secret:
#      openssl rand -base64 24 | docker secret create grafana_monitoring_admin_password -
#   3. DNS: grafana.hornung-bn.de → 192.168.4.40 (Traefik routing mesh)
#
# Deployment: ssh-deploy via GitOps (content-hash Docker configs)
# =============================================================================

version: '3.8'

services:

  # ===========================================================================
  # VICTORIAMETRICS — Time-Series Database
  # ===========================================================================
  # Single-node instance. Accepts:
  #   - Prometheus remote_write on /api/v1/write (from vmagent)
  #   - InfluxDB Line Protocol on /write (from Proxmox native export)
  #   - PromQL queries on /api/v1/query (from Grafana)
  #
  # Port 8428 published for Proxmox metric ingestion from outside Swarm.

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.149.0
    hostname: victoriametrics
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=12
      - -httpListenAddr=:8428
      - -influxTrimTimestamp=1s
      - -search.latencyOffset=5s
      - -search.maxUniqueTimeseries=50000
      # Memory protection: cap VM caches at 60% of cgroup limit
      - -memory.allowedPercent=60
      # Prevent filling CephFS completely — reserve 1GB free space
      - -storage.minFreeDiskSpaceBytes=1073741824
    volumes:
      - /mnt/cephfs/swarm-state/stack-monitoring/victoriametrics-data:/victoria-metrics-data
    ports:
      - target: 8428
        published: 8428
        protocol: tcp
        mode: ingress
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # VMAGENT — Scrape Agent
  # ===========================================================================
  # Scrapes all Prometheus endpoints, remote-writes to VictoriaMetrics.
  # Config via Docker config (content-hash naming for zero-downtime updates).
  # WAL buffer on CephFS ensures no data loss during VM restarts.

  vmagent:
    image: victoriametrics/vmagent:v1.149.0
    hostname: vmagent
    command:
      - -promscrape.config=/etc/vmagent/prometheus-scrape.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -remoteWrite.tmpDataPath=/vmagent-data
      - -promscrape.suppressScrapeErrors
    volumes:
      - /mnt/cephfs/swarm-state/stack-monitoring/vmagent-data:/vmagent-data
    configs:
      - source: prometheus_scrape
        target: /etc/vmagent/prometheus-scrape.yml
    secrets:
      - ha_prometheus_lla_token
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        # stop-first (NICHT start-first!): vmagent hat eine persistente WAL-Queue
        # (vmagent-data auf CephFS) mit flock. Bei start-first will der neue Task
        # den Lock, während der alte ihn noch hält → neuer Task bleibt "Ready",
        # der Rolling-Update hängt unbemerkt (docker stack deploy meldet trotzdem
        # "success", da es nicht auf Konvergenz wartet). Fix 2026-06-07 nach 13h
        # Config-Drift. Siehe feedback_swarm_rolling_update_flock.
        order: stop-first
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8429/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - victoriametrics

  # ===========================================================================
  # NODE EXPORTER — Host Metrics (Global)
  # ===========================================================================
  # One instance per Swarm node. Exposes CPU, RAM, disk, network metrics.
  # Host-mode port 9100 for direct scraping by vmagent.

  node-exporter:
    image: prom/node-exporter:v1.12.1
    hostname: "{{.Node.Hostname}}"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.netclass.ignored-devices=^(veth|docker|br-|lo).*$$
      - --no-collector.ipvs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host
    networks:
      - monitoring-network
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
      restart_policy:
        condition: any
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics | head -1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # GRAFANA — Infrastructure Dashboards
  # ===========================================================================
  # Dedicated Grafana instance for infrastructure monitoring.
  # Separate from rescue-tracker Grafana (different stack, domain, purpose).
  # Provisioned datasource via Docker config.

  grafana:
    # 12.4.8 (Major 11.6->12.4, 2026-08-07): Alerting-File-Provisioning (apiVersion 1)
    # ist unveraendert kompatibel. Angular-Support ist in 12.x KOMPLETT entfernt
    # (alle 3 provisionierten Dashboards nutzen nur timeseries/stat/table/gauge — ok;
    # UI-Dashboards in grafana.db vorher pruefen, siehe prep/job7-grafana/TESTPLAN).
    # VOR Deploy: grafana.db-Backup bei gestopptem Container (RBD /mnt/rbd/grafana),
    # Downgrade 12->11 ist NUR via Backup-Restore moeglich (irreversible Schema-Migration).
    image: grafana/grafana:12.4.8
    hostname: grafana
    entrypoint: ["/bin/sh", "/etc/grafana/grafana-entrypoint.sh"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_monitoring_admin_password
      - GF_SERVER_ROOT_URL=https://grafana.hornung-bn.de
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Unified alerting (einziges Alerting seit G11; explicit for clarity).
      # GF_ALERTING_ENABLED (Legacy-Alerting) entfernt: Option existiert in 12.x nicht mehr.
      - GF_UNIFIED_ALERTING_ENABLED=true
      # SMTP via Homelab-Mail-Relay (Variante C) — keine Auth, From=homelab@ (Pflicht). Siehe docs/MAIL-RELAY.md.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=192.168.4.71:587
      - GF_SMTP_FROM_ADDRESS=homelab@hornung-bn.de
      - GF_SMTP_FROM_NAME=Grafana Homelab
      - GF_SMTP_SKIP_VERIFY=true
    secrets:
      - grafana_monitoring_admin_password
      - grafana_telegram_bot_token
      - grafana_telegram_chat_id
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_provisioning
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: dashboard_home_energy
        target: /var/lib/grafana/dashboards/home-energy-correlation.json
      - source: dashboard_ceph_storage
        target: /var/lib/grafana/dashboards-infra/ceph-storage-cluster.json
      - source: dashboard_postgres_prod
        target: /var/lib/grafana/dashboards-infra/postgres-prod.json
      - source: dashboard_ups_power
        target: /var/lib/grafana/dashboards-infra/ups-power.json
      - source: dashboard_pve_hosts
        target: /var/lib/grafana/dashboards-infra/pve-hosts.json
      - source: dashboard_unifi_poe
        target: /var/lib/grafana/dashboards-infra/unifi-poe.json
      - source: dashboard_synology_nas
        target: /var/lib/grafana/dashboards-infra/synology-nas.json
      - source: alerting_contact_points
        target: /etc/grafana/provisioning/alerting/contact-points.yml
      - source: alerting_notification_policies
        target: /etc/grafana/provisioning/alerting/notification-policies.yml
      - source: alerting_rules
        target: /etc/grafana/provisioning/alerting/alert-rules.yml
      - source: alerting_mute_times
        target: /etc/grafana/provisioning/alerting/mute-times.yml
      - source: grafana_entrypoint
        target: /etc/grafana/grafana-entrypoint.sh
        mode: 0555
    volumes:
      # RBD (lokales ext4) statt CephFS (2026-06-13): Grafana nutzt SQLite
      # (grafana.db). SQLite-POSIX-Locking auf CephFS ist fragil und brach
      # Rolling-Updates ("database is locked"). Das RBD-Device wird vom Host
      # (systemd rbd-map-grafana) auf dem grafana-rbd=active-Node bereitgestellt;
      # Auto-Failover via grafana-rbd-failover Watchdog (Lock-Steal -o exclusive).
      # Setup: ansible/rbd-mount-grafana.yml. Image: swarm-volumes/grafana-data.
      - /mnt/rbd/grafana:/var/lib/grafana
    networks:
      - monitoring-network
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        # grafana folgt dem RBD-Holder: der grafana-rbd-failover Watchdog setzt
        # das Label auf den Node, der das exclusive-lock RBD wirklich hält.
        # max 1/Node: SQLite ist single-writer, RBD ist exclusive-lock.
        max_replicas_per_node: 1
        constraints:
          - node.labels.grafana-rbd == active
      labels:
        - traefik.enable=true
        # HTTPS Router
        - "traefik.http.routers.monitoring-grafana.rule=Host(`grafana.hornung-bn.de`)"
        - traefik.http.routers.monitoring-grafana.entrypoints=websecure
        - traefik.http.routers.monitoring-grafana.tls=true
        - traefik.http.routers.monitoring-grafana.tls.certresolver=dns
        - traefik.http.services.monitoring-grafana.loadbalancer.server.port=3000
        - traefik.docker.network=traefik_public
        # HTTP -> HTTPS redirect
        - "traefik.http.routers.monitoring-grafana-http.rule=Host(`grafana.hornung-bn.de`)"
        - traefik.http.routers.monitoring-grafana-http.entrypoints=web
        - traefik.http.routers.monitoring-grafana-http.middlewares=monitoring-grafana-redirect
        - traefik.http.middlewares.monitoring-grafana-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.monitoring-grafana-redirect.redirectscheme.permanent=true
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s
        # stop-first (NICHT start-first!): Grafana nutzt SQLite (grafana.db) auf
        # CephFS (/mnt/cephfs/.../grafana). Bei start-first startet Swarm den NEUEN
        # Task, während der alte die DB noch hält → der neue kann grafana.db nicht
        # öffnen ("database is locked") → Task stirbt → Update pausiert STILL, der
        # alte Task läuft auf der alten Config weiter (Config-Drift, Alerting-/
        # Notification-Änderungen greifen nie). Grafana unterstützt generell keine
        # 2 Instanzen auf SQLite. stop-first = alter Task gibt DB frei, dann neuer.
        # Kosten: ~10-30s Grafana-Downtime pro Update (für Dashboards/Alerting ok).
        # Fix 2026-06-13. Gleiche Klasse wie vmagent (feedback_swarm_rolling_update_flock).
        order: stop-first
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # PBS EXPORTER — Proxmox Backup Server API metrics
  # ===========================================================================
  # Scrapes PBS REST API for backup job status, snapshot counts, verify status.
  # Requires API token with Datastore.Audit privilege.
  # Metrics: pbs_snapshot_count, pbs_snapshot_vm_last_timestamp, pbs_up, etc.

  pbs-exporter:
    image: ghcr.io/natrontech/pbs-exporter:v0.9.3
    hostname: pbs-exporter
    command:
      - -pbs.endpoint=https://pbs.hornung-bn.de:8007
      - -pbs.username=grafana@pbs
      - -pbs.api.token.name=dashboard
      - -pbs.api.token=c708f878-d930-4d94-9d5a-72cc288b50d0
      - -pbs.insecure=true
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
    healthcheck:
      disable: true

  # ===========================================================================
  # SNMP EXPORTER — Synology DS918+ (und spaeter weitere SNMP-Geraete)
  # ===========================================================================
  # Zweck: Die Synology war bislang genauso unueberwacht wie die PVE-Hosts —
  # eine Luecke, die im RCA zum Stromausfall vom 2026-08-21 stand. SNMPv3
  # liefert Plattentemperaturen, Luefterdrehzahlen, RAID-Zustand, CPU- und
  # Speicherauslastung sowie Netzwerkdurchsatz.
  #
  # HISTORIE
  #   2026-08-23 deaktiviert: Die beiden Secrets wurden zur Rotation geloescht.
  #   Ein fehlendes Secret laesst NICHT nur diesen Dienst scheitern, sondern den
  #   gesamten Stack-Deploy — docker stack deploy ist atomar. Dadurch blockierte
  #   er Aenderungen an voellig anderen Diensten.
  #   2026-08-24 reaktiviert: Secrets neu angelegt, und im DSM steht jetzt
  #   Privacy=AES statt DES. Damit passt das Geraet zu dem, was
  #   snmp-entrypoint.sh baut (SHA/AES). Vorher scheiterte die Anmeldung
  #   kommentarlos — SNMPv3 quittiert einen Protokoll-Mismatch nicht, es
  #   antwortet schlicht nicht.
  #
  # AUFBAU: MODULE OEFFENTLICH, ZUGANG GEHEIM
  #   snmp-modules.yml (106 KB, Docker Config) traegt die MIB-Definitionen aus
  #   der offiziellen snmp.yml (snmp_exporter v0.30.1). Nichts davon ist
  #   geheim, es gehoert versioniert ins Repo. Die vollstaendige snmp.yml waere
  #   2 MB gross und spraengte das 500-KB-Limit fuer Docker Configs — deshalb
  #   nur die neun tatsaechlich genutzten Module (synology, if_mib, hrStorage,
  #   hrDevice, hrSystem, system, ucd_system_stats, ucd_memory, ucd_la_table).
  #
  #   ERZEUGT VON .gen-snmp-modules.py — nicht von Hand editieren. Das Skript
  #   dokumentiert jede Abweichung vom Upstream mitsamt Begruendung: die
  #   Absenkung von max_repetitions fuer hrStorage/hrDevice, das Eindampfen
  #   von hrDevice und die Umstellung von OctetString auf DisplayString, ohne
  #   die die Platten als diskID="0x4469736B2031" statt "Disk 1" ankommen.
  #
  #   Die Modulnamen kollidieren paarweise NICHT in ihren Metriknamen — das ist
  #   Voraussetzung fuer den Multi-Modul-Scrape (?module=a&module=b), weil der
  #   Exporter die Ergebnisse ohne unterscheidendes Label konkateniert und
  #   Prometheus doppelte Serien sonst als Scrape-Fehler zurueckweist. Der
  #   Generator bricht ab, wenn eine Kollision entstuende.
  #
  #   Die SNMPv3-Zugangsdaten baut snmp-entrypoint.sh zur Laufzeit aus zwei
  #   Docker Secrets zusammen. Anders als UnPoller kennt der snmp_exporter
  #   kein file://-Praefix fuer Einzelwerte; er liest Zugangsdaten nur aus
  #   einer Konfigurationsdatei. Die entstehende Datei liegt in tmpfs und
  #   beruehrt nie ein Volume.
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    hostname: snmp-exporter
    entrypoint: /snmp-entrypoint.sh
    # module-concurrency: Der Scrape-Job fragt neun Module in EINEM Request ab.
    # Mit dem Default 1 laufen deren Walks streng nacheinander. 4 parallele
    # Walks halten den Scrape bei 1,6s (gemessen 2026-08-24, 2296 Serien),
    # ohne die DS918+ zu ueberfahren.
    command:
      - --snmp.module-concurrency=4
    environment:
      SNMP_USERNAME: "grafana"
      TZ: "Europe/Berlin"
    configs:
      # source MUSS der Deklarationsname sein (snmp_modules), nicht der
      # Hash-Name aus dem name:-Feld. Ein `source: snmp_modules_<hash>` erzeugt
      # "undefined config" und laesst den GESAMTEN Stack-Deploy scheitern.
      - source: snmp_modules
        target: /etc/snmp_exporter/snmp-modules.yml
        mode: 0444
      - source: snmp_entrypoint
        target: /snmp-entrypoint.sh
        mode: 0555
    secrets:
      - synology_snmp_auth_password
      - synology_snmp_priv_password
    tmpfs:
      - /tmp:size=1m,mode=0700
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 48M
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9116/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # start_period grosszuegig: Das Parsen der 117-KB-Moduldatei plus der
      # erste Scrape brauchen spuerbar laenger als ein leerer HTTP-Server. Ein
      # zu knapper Wert killt den Container VOR dem ersten erfolgreichen
      # Scrape und erzeugt einen Restart-Loop, der wie ein Konfigfehler
      # aussieht. Er muss ausserdem groesser sein als der monitor-Wert eines
      # etwaigen update_config, sonst rollt Swarm still zurueck.
      start_period: 120s

  # ===========================================================================
  # UNPOLLER — UniFi-Controller (UDM Pro) als Metrikquelle
  # ===========================================================================
  # Zweck: Transparenz ueber das Rack. Liefert Leistungsaufnahme je PoE-Port,
  # Switch-Gesamtleistung, Client- und AP-Daten.
  #
  # WARUM UEBERHAUPT
  #   Nach dem USV-Cut-Over am 2026-08-23 lag die Wirkleistung bei 275 W, von
  #   denen sich rechnerisch nur ~190 W zuordnen liessen. Ohne Messung pro Port
  #   bleibt jede Abwurfentscheidung im Ernstfall geraten.
  #
  # WAS ES NICHT SIEHT
  #   PoE-Injektoren und Geraete an normalen Steckdosen tauchen hier nicht auf.
  #   Die Differenz zwischen ups_realpower_watts und der Summe der Switch-Ports
  #   ist genau dieser unsichtbare Teil — im Dashboard als eigenes Panel.
  #
  # ZUGANG
  #   Lokaler UniFi-Benutzer "unpoller", Rolle Viewer (read-only), kein 2FA.
  #   URL ohne Port 8443: UniFi OS stellt die Netzwerk-Anwendung hinter
  #   /proxy/network/ bereit, UnPoller erkennt das selbst.
  #   Das Passwort kommt per file://-Praefix direkt aus dem Docker Secret —
  #   UnPoller unterstuetzt das nativ, es braucht keinen Entrypoint-Wrapper.
  unpoller:
    image: ghcr.io/unpoller/unpoller:v4.0.1
    hostname: unpoller
    environment:
      UP_UNIFI_DEFAULT_URL: "https://192.168.2.1"
      UP_UNIFI_DEFAULT_USER: "unpoller"
      UP_UNIFI_DEFAULT_PASS: "file:///run/secrets/unpoller_unifi_password"
      # Selbstsigniertes Zertifikat der UDM Pro
      UP_UNIFI_DEFAULT_VERIFY_SSL: "false"
      UP_UNIFI_DEFAULT_SAVE_SITES: "true"
      # Auch Ports mitzaehlen, die gerade nichts ziehen — sonst verschwindet
      # ein abgeschaltetes Geraet aus der Zeitreihe, statt auf 0 zu gehen.
      UP_UNIFI_DEFAULT_SAVE_DPI: "false"
      UP_PROMETHEUS_DISABLE: "false"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
      # Wir schreiben nach VictoriaMetrics per Scrape, nicht nach InfluxDB
      UP_INFLUXDB_DISABLE: "true"
      UP_LOKI_DISABLE: "true"
      UP_POLLER_QUIET: "false"
      TZ: "Europe/Berlin"
    secrets:
      # v2 nach Passwort-Rotation (2026-08-23). Docker Secrets sind
      # unveraenderlich, deshalb ein neuer Name. target haelt den Dateinamen
      # stabil, sodass die file://-Referenz oben unveraendert bleibt.
      - source: unpoller_unifi_password_v2
        target: unpoller_unifi_password
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 48M
      restart_policy:
        condition: any
        # 120s statt 30s: Jeder Neustart bedeutet einen neuen Anmeldeversuch am
        # Controller. Die UDM Pro drosselt Logins mit HTTP 429 (Brute-Force-
        # Schutz) — schnelle Neustarts verschaerfen die Sperre, statt sie
        # abklingen zu lassen.
        delay: 120s
        window: 600s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    # KEIN Healthcheck: Das UnPoller-Image ist distroless und hat keine Shell
    # ("exec: /bin/sh: no such file or directory"). Jeder CMD-SHELL-Test
    # scheitert deshalb grundsaetzlich — der Container lief, exportierte
    # Metriken, und blieb trotzdem ewig auf health=starting. Swarm meldete
    # 0/1, der Service bekam keine VIP im Overlay, und vmagent fand kein Ziel.
    #
    # Der Scrape selbst ist der bessere Gesundheitstest: up{job="unpoller"}
    # zeigt unmittelbar, ob der Exporter antwortet. Ein Healthcheck, der die
    # Frage nicht beantworten kann, ist schlechter als keiner.
    healthcheck:
      test: ["NONE"]

  # ===========================================================================
  # BLACKBOX EXPORTER — HTTP/HTTPS probes + SSL cert-expiry
  # ===========================================================================
  # Probes all public-facing URLs for 2xx response and reports the TLS cert
  # expiry timestamp via probe_ssl_earliest_cert_expiry.
  # Scrape-Targets stehen in prometheus-scrape.yml (Relabeling-Pattern).

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    hostname: blackbox-exporter
    command:
      - --config.file=/etc/blackbox/blackbox-probes.yml
    configs:
      - source: blackbox_probes
        target: /etc/blackbox/blackbox-probes.yml
    networks:
      - monitoring-network
      - traefik_public          # damit traefik.hornung-bn.de etc. via Overlay erreichbar
      - openarchiver_default    # für blackbox-tika Probe (openarchiver-tika:9998) — KOPPLUNG s.u.
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9115/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # LOKI — Log-Aggregation (Senke fuer rsyslog-Forwards aller LXCs/VMs)
  # ===========================================================================
  # Single-Binary, Filesystem-Storage auf CephFS, Retention 30d (Compactor).
  # Port 3100 published (ingress): haelt loki.hornung-bn.de:3100 nach dem
  # DNS-Umzug auf die Swarm-Nodes funktionsfaehig (externe Debug-Queries);
  # Grafana spricht intern http://loki:3100 (kein DNS noetig).
  # RAM-Placement: infra-2 hat nur 3,6 GiB → infra_node != 2.

  loki:
    image: grafana/loki:3.7.6
    hostname: loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    configs:
      - source: loki_config
        target: /etc/loki/loki-config.yml
    volumes:
      # Besitzer 10001:10001 (Loki-Image laeuft als User 10001)
      - /mnt/cephfs/swarm-state/stack-monitoring/loki-data:/loki
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: ingress
    networks:
      - monitoring-network
    # 60s statt Default 10s (2026-08-09): Beim ersten stop-first-Update wurde
    # Loki nach 10s SIGKILLed, mitten im Shutdown → BoltDB des Compactors
    # korrupt → "init compactor: invalid database"-Crashloop. Zusaetzlich
    # liegt das Compactor-Arbeitsverzeichnis inzwischen EPHEMER im Container
    # (/tmp/loki-compactor, siehe loki-config.yml) — BoltDB auf CephFS ist
    # dieselbe Fragilitaetsklasse wie Grafana-SQLite auf CephFS.
    stop_grace_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
          # infra-2 hat nur 3,6 GiB RAM — Loki dort nicht platzieren
          - node.labels.infra_node != 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        # stop-first: Loki ist Single-Writer auf dem Filesystem-Store
        # (TSDB-Index/WAL) — gleiche Klasse wie vmagent/grafana.
        order: stop-first
    healthcheck:
      # Distroless-Image: kein Shell/wget im Container (wie pbs-exporter).
      # Ueberwachung via vmagent-Scrape (loki:3100/metrics) + Alloy-Write-Pfad.
      disable: true

  # ===========================================================================
  # ALLOY — Syslog-Gateway (TCP+UDP :1514 → Loki)
  # ===========================================================================
  # Nimmt die rsyslog-Forwards der LXCs/VMs an (RFC3164! — der alte Promtail
  # auf der Diskstation parste nur RFC5424 und verwarf alles; Root Cause der
  # toten Log-Ingestion). Ingress-Publish: jede Node-IP:1514 erreicht Alloy.
  # DNS-Wunsch (nur durch Menschen): loki.hornung-bn.de → 192.168.4.40/41/42.

  alloy:
    image: grafana/alloy:v1.18.1
    hostname: alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    ports:
      - target: 1514
        published: 1514
        protocol: tcp
        mode: ingress
      - target: 1514
        published: 1514
        protocol: udp
        mode: ingress
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
          - node.labels.infra_node != 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 192M
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        # start-first ok: Alloy ist zustandslos (kein Lock/WAL-Konflikt),
        # Ingress-VIP verteilt waehrend des Updates auf beide Tasks.
        order: start-first
    healthcheck:
      # Kein wget/curl im Image — bash /dev/tcp prueft den Syslog-Listener.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1514 && exec 3>&-"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# =============================================================================
# CONFIGS (Docker Configs — immutable, content-hash naming)
# =============================================================================
configs:
  prometheus_scrape:
    name: prometheus_scrape_${PROMETHEUS_SCRAPE_HASH:-latest}
    file: ./prometheus-scrape.yml

  grafana_datasources:
    name: grafana_datasources_${DATASOURCES_HASH:-latest}
    file: ./datasources.yml

  grafana_dashboards_provisioning:
    name: grafana_dashboards_prov_${DASHBOARDS_HASH:-latest}
    file: ./dashboards.yml

  dashboard_home_energy:
    name: dashboard_home_energy_${HOME_ENERGY_CORRELATION_HASH:-latest}
    file: ./dashboards/home-energy-correlation.json

  dashboard_ceph_storage:
    name: dashboard_ceph_storage_${CEPH_STORAGE_CLUSTER_HASH:-latest}
    file: ./dashboards/ceph-storage-cluster.json

  dashboard_postgres_prod:
    name: dashboard_postgres_prod_${POSTGRES_PROD_HASH:-latest}
    file: ./dashboards/postgres-prod.json

  # USV-Dashboard. Die Metriken kommen nicht aus einem Scrape-Job, sondern
  # werden von den drei Hypervisoren per Prometheus-Import geschoben — die
  # Swarm-Nodes duerfen den NUT-Server auf der Synology nicht abfragen
  # ("ERR ACCESS-DENIED"). Siehe ansible/files/ups-metrics-push.sh
  snmp_modules:
    name: snmp_modules_${SNMP_MODULES_HASH:-latest}
    file: ./snmp-modules.yml

  snmp_entrypoint:
    name: snmp_entrypoint_${SNMP_ENTRYPOINT_HASH:-latest}
    file: ./snmp-entrypoint.sh

  dashboard_ups_power:
    name: dashboard_ups_power_${UPS_POWER_HASH:-latest}
    file: ./dashboards/ups-power.json

  # Hypervisor-Dashboard (pve01-03). Quelle ist der node-exporter auf dem
  # Blech, ausgerollt von ansible/pve-monitoring.yml — der Scrape-Job heisst
  # pve-node-exporter und ist bewusst vom Swarm-Job node-exporter getrennt.
  dashboard_pve_hosts:
    name: dashboard_pve_hosts_${PVE_HOSTS_HASH:-latest}
    file: ./dashboards/pve-hosts.json

  # PoE- und Netzwerkgeraete-Dashboard. Quelle ist der unpoller-Service in
  # diesem Stack. Die Port-zu-Geraet-Zuordnung entsteht per Join ueber
  # sw_name/sw_port aus den Client-Metriken; UniFi-Infrastruktur (Access
  # Points) laesst sich so nicht aufloesen, weil UnPoller fuer Geraete keine
  # Uplink-Portnummer liefert — dort hilft nur, den Port in UniFi zu benennen.
  dashboard_unifi_poe:
    name: dashboard_unifi_poe_${UNIFI_POE_HASH:-latest}
    file: ./dashboards/unifi-poe.json

  # NAS-Dashboard. Quelle ist der Scrape-Job snmp-synology gegen den
  # snmp-exporter in diesem Stack. Erzeugt von dashboards/.gen-synology-nas.py;
  # dort stehen auch die Begruendungen fuer die nicht offensichtlichen
  # Abfragen (hrSystemUptime statt sysUpTime, Speicher ohne Cache, nur eth1).
  dashboard_synology_nas:
    name: dashboard_synology_nas_${SYNOLOGY_NAS_HASH:-latest}
    file: ./dashboards/synology-nas.json

  alerting_contact_points:
    name: alerting_contact_points_${CONTACT_POINTS_HASH:-latest}
    file: ./alerting/contact-points.yml

  alerting_notification_policies:
    name: alerting_notification_policies_${NOTIFICATION_POLICIES_HASH:-latest}
    file: ./alerting/notification-policies.yml

  alerting_rules:
    name: alerting_rules_${ALERT_RULES_HASH:-latest}
    file: ./alerting/alert-rules.yml

  alerting_mute_times:
    name: alerting_mute_times_${MUTE_TIMES_HASH:-latest}
    file: ./alerting/mute-times.yml

  grafana_entrypoint:
    name: grafana_entrypoint_${GRAFANA_ENTRYPOINT_HASH:-latest}
    file: ./grafana-entrypoint.sh

  blackbox_probes:
    name: blackbox_probes_${BLACKBOX_PROBES_HASH:-latest}
    file: ./blackbox-probes.yml

  loki_config:
    name: loki_config_${LOKI_CONFIG_HASH:-latest}
    file: ./loki-config.yml

  alloy_config:
    name: alloy_config_${ALLOY_CONFIG_HASH:-latest}
    file: ./alloy-config.conf

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  monitoring-network:
    driver: overlay
    attachable: true

  traefik_public:
    external: true

  # KOPPLUNG (2026-06-07): blackbox-exporter hängt hier mit, um den internen
  # openarchiver-tika:9998 zu proben (tika-down-Alert). openarchiver_default ist
  # non-attachable, aber Swarm-Services dürfen sich anhängen. Trade-off: wird der
  # openarchiver-Stack je via `stack rm` entfernt, schlägt der monitoring-Deploy
  # mit "network not found" fehl — dann diesen Block + den blackbox-tika Job +
  # die tika-down Alert-Regel entfernen.
  openarchiver_default:
    external: true

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  unpoller_unifi_password_v2:
    external: true

  # SNMPv3-Zugangsdaten der Synology (Benutzer "grafana", SHA/AES).
  # Angelegt ueber die Portainer-UI — nie per `docker secret create`, das
  # haengt ein Trailing-Newline an. snmp-entrypoint.sh schneidet zwar per
  # `tr -d` ab, aber darauf sollte sich niemand verlassen muessen.
  synology_snmp_auth_password:
    external: true

  synology_snmp_priv_password:
    external: true

  grafana_monitoring_admin_password:
    external: true
  pbs_api_token:
    external: true
  ha_prometheus_lla_token:
    external: true
  grafana_telegram_bot_token:
    external: true
  grafana_telegram_chat_id:
    external: true
