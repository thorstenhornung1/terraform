# =============================================================================
# vmagent Scrape Configuration — Prometheus-compatible
# =============================================================================
# Defines all scrape targets for the monitoring stack.
# Deployed as Docker config with content-hash naming (zero-downtime updates).
#
# Adding new targets:
#   1. Add a new scrape_configs entry below
#   2. Commit + push → GitOps auto-deploys new config hash
#
# Future targets:
#   - cAdvisor: container metrics on port 9180
#   - PBS: needs API auth token (proxmox-backup-exporter)
#   - Proxmox host metrics arrive via InfluxDB LP push (no scrape needed)
# =============================================================================

global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:

  # ---------------------------------------------------------------------------
  # VictoriaMetrics self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428
        labels:
          instance: victoriametrics

  # ---------------------------------------------------------------------------
  # vmagent self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: vmagent
    static_configs:
      - targets:
          - 127.0.0.1:8429
        labels:
          instance: vmagent

  # ---------------------------------------------------------------------------
  # Loki + Alloy self-monitoring (Log-Pipeline seit 2026-08-09)
  # ---------------------------------------------------------------------------
  # Basis fuer kuenftige Alerts auf tote Log-Ingestion
  # (z.B. rate(loki_distributor_lines_received_total) == 0).
  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          instance: loki

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
        labels:
          instance: alloy

  # ---------------------------------------------------------------------------
  # Node Exporter — Host metrics (CPU, RAM, disk, network)
  # ---------------------------------------------------------------------------
  # node_exporter runs in global mode with host-mode port 9100.
  # Must use host IPs (not overlay DNS) since port is bound to host network.
  - job_name: node-exporter
    static_configs:
      - targets:
          - 192.168.4.40:9100
          - 192.168.4.41:9100
          - 192.168.4.42:9100
          - 192.168.4.45:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: '192\.168\.4\.40:.*'
        target_label: instance
        replacement: docker-infra-1
      - source_labels: [__address__]
        regex: '192\.168\.4\.41:.*'
        target_label: instance
        replacement: docker-infra-2
      - source_labels: [__address__]
        regex: '192\.168\.4\.42:.*'
        target_label: instance
        replacement: docker-infra-3
      - source_labels: [__address__]
        regex: '192\.168\.4\.45:.*'
        target_label: instance
        replacement: postgres-prod

  # ---------------------------------------------------------------------------
  # PVE Node Exporter — die Hypervisoren selbst (Bare-Metal, seit 2026-08-23)
  # ---------------------------------------------------------------------------
  # Eigener Job-Name, NICHT `node-exporter`: der Job oben misst die Swarm-VMs,
  # dieser die Bleche darunter. Die Alert-Regeln unterscheiden beide ueber
  # job= — ein gemeinsamer Job wuerde z.B. swarm-node-down auf einen
  # PVE-Reboot feuern lassen.
  #
  # Schliesst die Luecke aus dem RCA vom 2026-08-21: Beim Stromausfall blieb
  # ein Ceph-OSD vier Stunden tot, ohne dass etwas Alarm schlug — die Hosts
  # lieferten schlicht keine Metriken. pvestatd pusht zwar per InfluxDB-LP
  # (object="nodes", siehe /etc/pve/status.cfg), aber nur ~50 aggregierte
  # Werte: kein node_vmstat_oom_kill, keine Dateisysteme, keine Temperaturen.
  #
  # Der Exporter lauscht auf der LAN-IP (192.168.2.x), nicht auf 0.0.0.0 —
  # ausgerollt von ansible/pve-monitoring.yml. Deshalb hier die 2er-Adressen
  # und nicht die Storage-VLAN-IPs (192.168.12.x) wie beim ceph-Job.
  #
  # host= wird aus instance= dupliziert, damit sich die Serien im Dashboard
  # ohne label_replace mit den pvestatd-Push-Metriken zusammenlegen lassen —
  # die tragen host="pve01" und kein instance.
  - job_name: pve-node-exporter
    static_configs:
      - targets:
          - 192.168.2.10:9100
          - 192.168.2.11:9100
          - 192.168.2.12:9100
        labels:
          role: hypervisor
    relabel_configs:
      - source_labels: [__address__]
        regex: '192\.168\.2\.10:.*'
        target_label: instance
        replacement: pve01
      - source_labels: [__address__]
        regex: '192\.168\.2\.11:.*'
        target_label: instance
        replacement: pve02
      - source_labels: [__address__]
        regex: '192\.168\.2\.12:.*'
        target_label: instance
        replacement: pve03
      - source_labels: [instance]
        target_label: host

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter — Database metrics (Single-PG-VM postgres-prod)
  # ---------------------------------------------------------------------------
  # 2026-06-15: Patroni-Cluster durch Single-VM postgres-prod (192.168.4.45)
  # ersetzt. prometheus-postgres-exporter läuft als systemd-Service auf der VM.
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - 192.168.4.45:9187
        labels:
          instance: postgres-prod

  # ---------------------------------------------------------------------------
  # Ceph Cluster — Storage health, OSD, pool, PG metrics
  # ---------------------------------------------------------------------------
  # Ceph mgr prometheus module on pve03 (active mgr).
  # Endpoint may move if mgr failover occurs — use all 3 MON IPs.
  - job_name: ceph
    static_configs:
      - targets:
          - 192.168.12.10:9283
          - 192.168.12.12:9283
          - 192.168.12.11:9283
        labels:
          cluster: proxmox-ceph
    # Only scrape the active mgr (others return connection refused)
    honor_labels: true

  # ---------------------------------------------------------------------------
  # etcd Cluster — ENTFERNT 2026-06-15 (Patroni→Single-VM-Migration).
  # etcd-1/2/3 (postgres-ha-stack) + etcd-4/5 (LXC) gestoppt. Bei Reaktivierung
  # aus git wiederherstellen. Single-VM postgres-prod braucht kein etcd.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # PBS Exporter — Backup job status, snapshots, verify, datastore usage
  # ---------------------------------------------------------------------------
  - job_name: pbs-exporter
    scrape_interval: 120s
    # 2026-06-13: scrape_timeout job-lokal auf 30s (global 10s ≪ interval 120s).
    # PBS-API-Queries (Job-Status, Snapshots, Verify) sind schwer; ein 10s-Timeout
    # produzierte false „pbs-down" + Datenlücken. 30s gibt der API Luft, bleibt
    # weit unter dem 120s-Intervall.
    scrape_timeout: 30s
    static_configs:
      - targets:
          - pbs-exporter:10019
        labels:
          instance: pbs

  # ---------------------------------------------------------------------------
  # SNMP — Synology DS918+
  # ---------------------------------------------------------------------------
  # Liefert Plattentemperaturen, Luefter, RAID-Zustand, CPU/RAM und
  # Netzwerkdurchsatz. Schliesst die Luecke aus dem RCA vom 2026-08-21: Die
  # Synology war bis dahin genauso unueberwacht wie die PVE-Hosts.
  #
  # SNMP-Scrapes laufen anders als normale Exporter: Prometheus fragt nicht das
  # Geraet, sondern den Exporter — und uebergibt das Ziel als Parameter. Das
  # Relabeling unten dreht deshalb __address__ und __param_target um, damit als
  # instance die Synology erscheint und nicht der Exporter.
  #
  # auth=synology_v3 verweist auf den Eintrag, den snmp-entrypoint.sh zur
  # Laufzeit aus den beiden Docker Secrets baut.
  #
  # 120s Intervall: SNMP-Walks sind traege, und Temperaturen aendern sich nicht
  # im Sekundentakt. Gemessen am 2026-08-24 brauchen alle neun Module zusammen
  # 1,6 s (2296 Serien) — das 60s-Timeout ist reichlich Reserve fuer den Fall,
  # dass die DS918+ unter Last langsamer antwortet.
  #
  # ACHTUNG bei rate()-Ausdruecken auf diesen Metriken: Bei 120s Intervall
  # braucht ein Fenster mindestens 4-5 Minuten, sonst liegen zu wenige Punkte
  # darin und der Ausdruck liefert stumm nichts. Im Dashboard steht ueberall
  # [10m].
  - job_name: snmp-synology
    scrape_interval: 120s
    scrape_timeout: 60s
    metrics_path: /snmp
    params:
      auth: [synology_v3]
      # Alle neun Module wurden am 2026-08-24 einzeln gegen das Geraet
      # geprueft; jedes liefert Daten. ip_mib fehlt bewusst: Darauf antwortet
      # die DS918+ mit 0 PDUs.
      module:
        - synology          # Vendor-OIDs: Temperaturen, Disk-/RAID-Status, SMART
        - if_mib            # Netzwerkdurchsatz
        - hrStorage         # Volume-Belegung und Swap
        - hrDevice          # CPU-Last je Kern, Geraetestatus
        - hrSystem          # Uptime (NICHT sysUpTime, siehe unten)
        - system            # sysName/sysDescr/sysLocation
        - ucd_system_stats  # CPU-Verteilung
        - ucd_memory        # RAM und Swap
        - ucd_la_table      # Load Average
    static_configs:
      - targets:
          - 192.168.2.3
        labels:
          device: synology-ds918
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
    # -------------------------------------------------------------------------
    # Fluechtige Container-Interfaces wegwerfen
    # -------------------------------------------------------------------------
    # Von den 22 Interfaces der DS918+ sind 15 Docker-veth-Paare und ein
    # VM-tap — mit Namen wie "docker-27f81084", die sich bei jedem
    # Container-Neustart aendern. Ohne diesen Filter waechst die Zahl toter
    # Zeitreihen mit jedem Container-Restart dauerhaft an, und die
    # Interface-Panels stehen voller Namen, die nichts bedeuten.
    #
    # Metriken ohne ifName-Label sind nicht betroffen: Der leere String
    # trifft dieses Muster nicht (Prometheus verankert Regexe vollstaendig).
    metric_relabel_configs:
      - source_labels: [ifName]
        regex: '(docker|veth|tap|br-).*'
        action: drop

  # ---------------------------------------------------------------------------
  # UnPoller — UniFi-Controller (UDM Pro)
  # ---------------------------------------------------------------------------
  # Liefert Leistungsaufnahme je PoE-Port, Switch-Gesamtleistung, Client- und
  # AP-Daten. Zweck ist Transparenz ueber das Rack: Nach dem USV-Cut-Over lagen
  # 275 W an, von denen sich nur ~190 W zuordnen liessen.
  #
  # 60s statt der ueblichen 30s: UnPoller fragt bei jedem Scrape den Controller
  # ab, und die UDM Pro braucht dafuer spuerbar Zeit. Fuer Leistungsdaten ist
  # Minutenaufloesung reichlich — die USV-Metriken kommen ohnehin alle 30s.
  - job_name: unpoller
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - unpoller:9130
        labels:
          instance: udm-pro

  # ---------------------------------------------------------------------------
  # Patroni REST API — ENTFERNT 2026-06-15 (Patroni→Single-VM-Migration).
  # postgres-1/2/3 (postgres-ha-stack) gestoppt; DB-Metriken kommen jetzt vom
  # postgres-exporter auf postgres-prod (job postgres-exporter oben).
  # Bei Reaktivierung aus git wiederherstellen.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Home Assistant — Entity states via built-in Prometheus integration
  # ---------------------------------------------------------------------------
  # HA exposes /api/prometheus with all entity states.
  # Text states become labels on info metrics (e.g. state="locked").
  # Numeric sensors become standard gauge metrics.
  # HTTPS with bearer token auth (Docker secret).
  - job_name: homeassistant
    scrape_interval: 30s
    # 2026-06-13: 20s→25s. HA-Prometheus-Integration ist bei vielen Entities
    # zäh; 20s (66% des Intervalls) riss bei langsamer TLS/UI-Antwort gelegentlich
    # `up=0` → ha-down-Flap. 25s puffert, bleibt unter 30s Intervall.
    scrape_timeout: 25s
    metrics_path: /api/prometheus
    scheme: https
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /run/secrets/ha_prometheus_lla_token
    static_configs:
      - targets:
          - 192.168.2.5:8123
        labels:
          instance: homeassistant

  # ---------------------------------------------------------------------------
  # Frigate NVR — Camera health, detection FPS, storage
  # ---------------------------------------------------------------------------
  # Frigate 0.17+ exposes Prometheus metrics via nginx on port 8971 (HTTPS).
  # Uses DNS name for node-independence (LXC can migrate).
  # Auth is disabled in Frigate config — no token needed.
  # IP-Whitelist middleware in Traefik allows 192.168.0.0/16.
  - job_name: frigate
    scrape_interval: 30s
    metrics_path: /api/metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - frigate.hornung-bn.de:443
        labels:
          instance: frigate

  - job_name: reisekosten
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - reisekosten.hornung-bn.de:443
        labels:
          instance: reisekosten

  # ---------------------------------------------------------------------------
  # Blackbox Probes — SSL cert expiry for all public-facing domains
  # ---------------------------------------------------------------------------
  # The blackbox_exporter probes each target (module `http_any_tls`).
  # The metric `probe_ssl_earliest_cert_expiry` (unix timestamp) is what the
  # SSL-expiry alert-rules evaluate against.
  # Scrape interval 5m is intentional: cert-expiry is a slow-moving metric.
  - job_name: blackbox-https
    scrape_interval: 5m
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_any_tls]
    static_configs:
      - targets:
          - https://photos.hornung-bn.de
          - https://auth.hornung-bn.de
          - https://vault.hornung-bn.de
          - https://paperless.hornung-bn.de
          - https://archive.hornung-bn.de
          - https://n8n.hornung-bn.de
          - https://grafana.hornung-bn.de
          - https://traefik.hornung-bn.de
          # 2026-06-30: uptime.hornung-bn.de (Uptime Kuma) deprecated/abgerüstet —
          # lieferte 404 -> tls-probe-failed feuerte dauerhaft. Target entfernt.
          - https://frigate.hornung-bn.de
          - https://admin.frigate.hornung-bn.de
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Blackbox App-Verfügbarkeit — schnelles Up/Down für kritische Web-Apps
  # ---------------------------------------------------------------------------
  # 60s-Interval (vs. 5m beim cert-Job) für zeitnahes Down-Alerting.
  # Modul http_2xx_tls folgt Redirects: paperless (302→200) und archive/
  # openarchiver (307→200) leiten auf Login/OIDC um → probe_success=1 solange
  # die App antwortet. Liefert probe_success (1/0) → app-down-Alerts (siehe
  # alert-rules.yml Group "Applications"). Erkennt App-Down + Traefik-Ausfall.
  - job_name: blackbox-apps
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_2xx_tls]
    static_configs:
      - targets:
          - https://paperless.hornung-bn.de
          - https://archive.hornung-bn.de
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Blackbox Tika-Probe — interne Abhängigkeit von Open Archiver
  # ---------------------------------------------------------------------------
  # Probet openarchiver-tika:9998/version (HTTP 200 "Apache Tika 3.1.0") über das
  # openarchiver_default-Overlay (blackbox-exporter ist dort mit angeschlossen).
  # Liefert probe_success (1/0) → openarchiver-tika-down-Alert (siehe alert-rules.yml
  # Group "Applications"). Schließt den blinden Fleck, dass die App extern „up" ist,
  # aber intern Tika nicht erreicht (verwaiste Service-Discovery / ENOTFOUND nach
  # Reschedule) → Mails würden still ohne Anhang-Volltext indexiert (Fall 2026-06-07).
  - job_name: blackbox-tika
    # 2026-06-13: 60s→30s. Bei verwaister Service-Discovery nach Reschedule
    # (ENOTFOUND, vgl. Fall 2026-06-07, 2h still ohne Anhang-Volltext) erkennt
    # ein 30s-Intervall den Ausfall doppelt so schnell. Timeout 15s bleibt.
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_internal]
    static_configs:
      - targets:
          - http://openarchiver-tika:9998/version
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # DNS-Resolver-Probe — Technitium dns1/2/3 (Prio-1-Infra, 2026-06-15)
  # blackbox dns_resolve fragt dns1.hornung-bn.de(A) gegen jeden Knoten;
  # probe_success=0 = Resolver-Ausfall (echter DNS-Down, nicht nur node-down).
  # ---------------------------------------------------------------------------
  - job_name: blackbox-dns
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [dns_resolve]
    static_configs:
      - targets:
          - 192.168.4.2
          - 192.168.4.3
          - 192.168.4.4
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: '192\.168\.4\.2'
        target_label: dns_node
        replacement: dns1
      - source_labels: [__param_target]
        regex: '192\.168\.4\.3'
        target_label: dns_node
        replacement: dns2
      - source_labels: [__param_target]
        regex: '192\.168\.4\.4'
        target_label: dns_node
        replacement: dns3
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Blackbox Ollama-Probe — Inferenz-Host Mac Studio (LightRAG + paperless-ai)
  # ---------------------------------------------------------------------------
  # Probet http://192.168.2.236:11434/api/version (Ollama, LaunchAgent auf dem
  # Mac Studio). Ollama-down = STILLER RAG-Ausfall: LightRAG-Queries und
  # paperless-ai-Analysen schlagen fehl, ohne dass ein Swarm-Service unhealthy
  # wird (gleiches Muster wie Tika 2026-06-07). Modul http_internal (plain
  # HTTP, valid 200); Pfad VLAN4->VLAN2 via UDM-Pro (gleicher Pfad, den
  # paperless-ai/lightrag zur Laufzeit nutzen — die Probe testet ihn mit).
  - job_name: blackbox-ollama
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_internal]
    static_configs:
      - targets:
          - http://192.168.2.236:11434/api/version
        labels:
          instance: ollama-mac-studio
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
