version: "3.8"

# =============================================================================
# Webhook Runner — GitHub-to-Portainer GitOps Bridge
# =============================================================================
# Receives GitHub push webhooks and selectively triggers Portainer stack
# redeployments based on changed files.
#
# External dependencies:
#   - Traefik (traefik_public network) — TLS termination + routing
#   - CephFS (/mnt/cephfs/swarm-state/stack-webhook-runner/) — config
#   - Docker secret: github_webhook_secret — HMAC validation
#
# Setup:
#   1. Create CephFS dir:
#      mkdir -p /mnt/cephfs/swarm-state/stack-webhook-runner
#
#   2. Create webhooks.conf with stack-to-UUID mapping:
#      echo "stacks/apps/uptime-kuma-stack.yml=<uuid>" \
#        > /mnt/cephfs/swarm-state/stack-webhook-runner/webhooks.conf
#
#   3. Create Docker secret (generate a random string for GitHub):
#      echo -n "your-random-secret" | docker secret create github_webhook_secret -
#
#   4. Configure GitHub webhook:
#      URL:    https://webhook.hornung-bn.de/hooks/github-push
#      Secret: same string as step 3
#      Events: Just the push event
#      Content-Type: application/json
#
# Access: https://webhook.hornung-bn.de/hooks/github-push (POST only)
# =============================================================================

services:
  webhook-runner:
    image: ghcr.io/thorstenhornung1/swarm-stacks/webhook-runner:latest
    environment:
      - PORTAINER_URL=https://portainer.hornung-bn.de
      - WEBHOOKS_CONF=/config/webhooks.conf
    secrets:
      - github_webhook_secret
    volumes:
      - /mnt/cephfs/swarm-state/stack-webhook-runner:/config:ro
    networks:
      - traefik_public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:9000/ || [ $$? -ne 7 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        # Traefik HTTPS routing
        - traefik.enable=true
        - "traefik.http.routers.webhook-runner.rule=Host(`webhook.hornung-bn.de`)"
        - traefik.http.routers.webhook-runner.entrypoints=websecure
        - traefik.http.routers.webhook-runner.tls=true
        - traefik.http.routers.webhook-runner.tls.certresolver=dns
        - traefik.http.services.webhook-runner.loadbalancer.server.port=9000
        # HTTP -> HTTPS redirect
        - "traefik.http.routers.webhook-runner-http.rule=Host(`webhook.hornung-bn.de`)"
        - traefik.http.routers.webhook-runner-http.entrypoints=web
        - traefik.http.routers.webhook-runner-http.middlewares=webhook-redirect
        - traefik.http.middlewares.webhook-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.webhook-redirect.redirectscheme.permanent=true
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 10s

secrets:
  github_webhook_secret:
    external: true

networks:
  traefik_public:
    external: true
