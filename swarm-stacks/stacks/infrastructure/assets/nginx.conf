# =============================================================================
# assets.hornung-bn.de — Server-Block fuer die statische Auslieferung
# =============================================================================
# Wird als /etc/nginx/conf.d/default.conf gemountet und ersetzt damit den
# Default-Server des Images. Die HAUPT-nginx.conf (user, worker_processes,
# pid, mime.types) bleibt unangetastet — sie enthaelt bereits alles, was
# gebraucht wird, und ein zweiter Config nur fuer den http-Kontext waere
# eine Datei mehr, die bei jedem nginx-Update gegen das Original driftet.
#
# Aus demselben Grund steht hier NICHTS zu worker_processes: Die Direktive
# gehoert in den main-Kontext, das Image setzt sie dort bereits, und sie ein
# zweites Mal zu setzen (auch per `nginx -g`) ist fuer nginx ein Fehler, kein
# Ueberschreiben. Siehe den Kommentar im Stack.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # Version im Server-Header und im Fehler-Footer verschweigen: sie sagt
    # einem Scanner, welche CVEs sich zu probieren lohnen, und nuetzt sonst
    # niemandem.
    server_tokens off;

    # Kein Directory-Listing. Die Dateien sollen einzeln abrufbar sein; das
    # vollstaendige Inventar des Servers geht keinen Aufrufer etwas an.
    autoindex off;

    # SVG und CSS sind Text und komprimieren um Faktor 3-4. Bilder (PNG/WebP)
    # bewusst NICHT in der Liste — die sind bereits komprimiert, gzip wuerde
    # nur CPU kosten.
    gzip on;
    gzip_types image/svg+xml text/css application/javascript application/json;
    gzip_min_length 512;

    # Die Wurzel liefert bewusst nichts aus. Ohne diese Regel zeigt der Server
    # die nginx-Willkommensseite aus dem Image — ein Hinweis auf die
    # eingesetzte Software, der keinen Zweck erfuellt.
    location = / {
        access_log off;
        return 204;
    }

    # Eigener Endpunkt fuer den Container-Healthcheck. Bewusst NICHT auf eine
    # der ausgelieferten Dateien pruefen: sonst haengt die Gesundheit des
    # Dienstes daran, dass ausgerechnet dieses eine Logo gemountet ist.
    # access_log off, weil der Check alle 30 s laeuft und das Log sonst aus
    # nichts anderem mehr bestuende.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # =404 statt eines Fallbacks auf index.html: hier liegt keine SPA,
        # ein fehlendes Logo SOLL als 404 sichtbar werden statt als stille
        # Auslieferung einer HTML-Seite mit .svg-Endung — genau der Fehler,
        # den man sich bei den externen CDN-URLs eingefangen hat.
        try_files $uri =404;

        # Eine Stunde. Bewusst kurz gehalten: Der Dateiname bleibt beim
        # Austausch eines Logos gleich (kein Cache-Busting im Pfad), ein
        # langes max-age wuerde eine Korrektur tagelang unsichtbar machen.
        add_header Cache-Control "public, max-age=3600";

        # Fuer <img>-Einbindungen wie im Authentik-Dashboard braucht es kein
        # CORS. Der Header steht hier fuer das, was als naechstes kommt:
        # Webfonts und per fetch() geladene Themes verweigern ohne ihn den
        # Dienst — und zwar mit einer Meldung, die auf alles Moegliche zeigt,
        # nur nicht auf den fehlenden Header. Bei rein oeffentlichen,
        # statischen Dateien ohne Cookies gibt "*" nichts preis.
        add_header Access-Control-Allow-Origin "*";
    }
}
