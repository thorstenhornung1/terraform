# =============================================================================
# HAProxy für Ceph RGW (S3) — HA-Zugang analog pg-haproxy
# =============================================================================
# Bündelt die 3 radosgw-Daemons auf den PVE-Nodes (VLAN12, Port 7480) hinter
# einem Overlay-Alias. Consumer (Open Archiver) verbinden via: http://s3-rgw
#
#   RGW-Daemons: pve01/02/03 → 192.168.12.10/11/12:7480 (beast)
#   Healthcheck: GET / liefert anonymes S3-XML (HTTP 200)
# =============================================================================

global
    maxconn 2000
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5s
    # großzügig für S3-Objekt-Uploads/-Downloads (Mail-Blobs)
    timeout client 5m
    timeout server 5m
    log global
    option http-keep-alive

listen s3
    bind *:80
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server rgw1 192.168.12.10:7480 check inter 3s fall 3 rise 2
    server rgw2 192.168.12.11:7480 check inter 3s fall 3 rise 2
    server rgw3 192.168.12.12:7480 check inter 3s fall 3 rise 2

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
