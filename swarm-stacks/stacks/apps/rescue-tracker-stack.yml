version: "3.8"

# =============================================================================
# Air Rescue Tracker Stack — GitOps managed via Portainer webhook
# =============================================================================
# Access: https://rescue.hornung-bn.de (tracker app)
# Dashboard: https://grafana.hornung-bn.de/d/rescue-tracker (on the MAIN grafana —
#   the dedicated rescue-grafana was removed 2026-06-16 to save a container; the
#   dashboard JSON lives in rescue-dashboard.json and uses the shared VictoriaMetrics DS)
#
# Service:
#   - rescue-tracker: Python app collecting rescue aircraft telemetry (ADS-B)
#
# External dependencies:
#   - VictoriaMetrics (victoriametrics:8428 via monitoring-network) — Influx-line ingest
#     (migrated 2026-06-16 from dedicated InfluxDB VM; VM accepts /api/v2/write natively)
#   - Traefik (traefik_public network) — TLS termination + routing
#   - CephFS (/mnt/cephfs/swarm-state/stack-rescue-tracker/) — persistent logs
# =============================================================================

services:
  rescue-tracker:
    image: ghcr.io/thorstenhornung1/rescue-tracker:latest
    environment:
      # Migrated to VictoriaMetrics (Influx-line ingest via /api/v2/write). org/bucket/token
      # are accepted but ignored by VM (no auth) — kept so the influxdb_client stays happy.
      - INFLUXDB_URL=http://victoriametrics:8428
      - INFLUXDB_ORG=rescue-org
      - INFLUXDB_BUCKET=rescue-helicopters
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-vm-ignored}
      - LOG_LEVEL=INFO
    volumes:
      - /mnt/cephfs/swarm-state/stack-rescue-tracker/tracker-logs:/app/logs
    networks:
      - traefik_public
      - monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - "traefik.http.routers.rescue-tracker.rule=Host(`rescue.hornung-bn.de`)"
        - traefik.http.routers.rescue-tracker.entrypoints=websecure
        - traefik.http.routers.rescue-tracker.tls=true
        - traefik.http.routers.rescue-tracker.tls.certresolver=dns
        - traefik.http.services.rescue-tracker.loadbalancer.server.port=8000
        # HTTP -> HTTPS redirect
        - "traefik.http.routers.rescue-tracker-http.rule=Host(`rescue.hornung-bn.de`)"
        - traefik.http.routers.rescue-tracker-http.entrypoints=web
        - traefik.http.routers.rescue-tracker-http.middlewares=rescue-redirect
        - traefik.http.middlewares.rescue-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.rescue-redirect.redirectscheme.permanent=true
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: any
        delay: 10s

networks:
  traefik_public:
    external: true
  monitoring:
    external: true
    name: monitoring_monitoring-network
