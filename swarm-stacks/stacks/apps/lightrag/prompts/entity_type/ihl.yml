### When ENTITY_EXTRACTION_USE_JSON=false, entity_extraction_examples section must include in this file
### When ENTITY_EXTRACTION_USE_JSON=true, entity_extraction_json_examples section must include in this file
### Purpose: qualified entity names ("GC I Article 15", never bare "Article 15") to stop
###   name-collision merges across instruments/cases/press (entity bleeding).

entity_types_guidance: |
  Classify each entity using one of the following types. If no type fits, use `Other`.

  - TREATY: An international legal instrument as a whole (e.g. "Geneva Convention I (1949)", "Additional Protocol I (1977)")
  - TREATY_ARTICLE: A single article of a treaty, always qualified with its instrument (e.g. "GC I Article 15", "AP I Article 57")
  - CUSTOMARY_RULE: A rule of the ICRC Customary IHL Study (e.g. "CIHL Rule 109")
  - COMMENTARY: Authoritative commentary on a treaty provision (e.g. "ICRC Commentary on GC I (2016), Article 15")
  - CASE: A judicial decision or proceeding, named with the parties and case number (e.g. "Prosecutor v. Karadžić (IT-95-5/18-T)")
  - COURT: A court or tribunal (e.g. "ICTY", "International Court of Justice")
  - STATE: A state or country (e.g. "Ukraine", "Switzerland")
  - ORGANIZATION: Organizations, institutions, armed forces and research institutes (e.g. "ICRC", "RUSI")
  - MILITARY_ORDER: A military order, directive or operational document, qualified with its case or conflict context (e.g. "Directive 7 (Karadžić)")
  - MEDICAL_UNIT: Medical units, facilities, transports and personnel categories (e.g. "hospital ship", "uncrewed ground medical transport")
  - WEAPON_SYSTEM: Weapons and weapon platforms (e.g. "FPV drone", "loitering munition")
  - LEGAL_CONCEPT: Legal notions, obligations, protections and doctrines (e.g. "Search and Collection of the Wounded", "Suspension of Fire", "Medical Evacuation")
  - EVENT: Occurrences, operations and incidents, including a place name standing for the events that took place there (e.g. "Battle of Solferino", "Srebrenica")
  - PERSON: Human individuals (e.g. "Henry Dunant", "Radovan Karadžić")
  - PUBLICATION: Reports, papers, studies and other published works when they are named in the text
  - Other: Anything that fits none of the types above, including geographic locations that are not States

  Naming rules (mandatory):
  1. Every article or rule number MUST be qualified with its instrument. Derive the instrument from the `[Quelle:]` header line at the top of the input text. Write "GC I Article 15", "AP I Article 57", "CIHL Rule 109" — never a bare "Article 15" or "Rule 109".
  2. Use these instrument abbreviations: Geneva Conventions I–IV = "GC I", "GC II", "GC III", "GC IV"; Additional Protocols = "AP I", "AP II", "AP III"; ICRC Customary IHL Study rules = "CIHL Rule <number>"; commentaries = "ICRC Commentary on <instrument> (<year>), Article <number>".
  3. Case-specific orders, directives and documents MUST be qualified with their case or context: "Directive 7 (Karadžić)" — never a bare "Directive 7".
  4. Use the `[Quelle:]` header only to qualify entity names and to identify the source instrument, court or issuing organization; do not extract the header's database names or URLs as entities.
  5. Describe LEGAL_CONCEPT entities in neutral, general terms. Keep the facts of a specific case, conflict or report in the relationship descriptions — never in the concept entity's own description.

entity_extraction_examples:
  - |
    entity{tuple_delimiter}Geneva Convention I (1949){tuple_delimiter}TREATY{tuple_delimiter}The First Geneva Convention of 1949 for the Amelioration of the Condition of the Wounded and Sick in Armed Forces in the Field.
    entity{tuple_delimiter}GC I Article 15{tuple_delimiter}TREATY_ARTICLE{tuple_delimiter}Article 15 of Geneva Convention I (1949). It obliges parties to the conflict to search for and collect the wounded and sick without delay, and provides for a suspension of fire whenever circumstances permit so that the wounded left on the battlefield can be removed.
    entity{tuple_delimiter}Search and Collection of the Wounded{tuple_delimiter}LEGAL_CONCEPT{tuple_delimiter}The obligation of parties to an armed conflict to take all possible measures, particularly after an engagement, to search for and collect the wounded and sick.
    relation{tuple_delimiter}GC I Article 15{tuple_delimiter}Geneva Convention I (1949){tuple_delimiter}treaty provision, instrument{tuple_delimiter}GC I Article 15 is a provision of Geneva Convention I (1949); the article name is qualified with the instrument identified in the [Quelle:] header.
    relation{tuple_delimiter}GC I Article 15{tuple_delimiter}Search and Collection of the Wounded{tuple_delimiter}obligation, wounded and sick{tuple_delimiter}GC I Article 15 establishes the obligation to search for and collect the wounded and sick without delay.
    {completion_delimiter}

entity_extraction_json_examples:
  - |
    Example 1 — treaty article chunk:

    Input:
    [Quelle: Geneva Convention I (1949), Article 15 — ICRC IHL Treaties Database]
    At all times, and particularly after an engagement, Parties to the conflict shall, without delay, take all possible measures to search for and collect the wounded and sick, to protect them against pillage and ill-treatment, and to ensure their adequate care. Whenever circumstances permit, an armistice or a suspension of fire shall be arranged, or local arrangements made, to permit the removal, exchange and transport of the wounded left on the battlefield.

    Output:
    {
      "entities": [
        {
          "name": "Geneva Convention I (1949)",
          "type": "TREATY",
          "description": "The First Geneva Convention of 1949 for the Amelioration of the Condition of the Wounded and Sick in Armed Forces in the Field."
        },
        {
          "name": "GC I Article 15",
          "type": "TREATY_ARTICLE",
          "description": "Article 15 of Geneva Convention I (1949). It obliges parties to the conflict, at all times and particularly after an engagement, to search for and collect the wounded and sick without delay, and provides for a suspension of fire whenever circumstances permit so that the wounded left on the battlefield can be removed."
        },
        {
          "name": "Search and Collection of the Wounded",
          "type": "LEGAL_CONCEPT",
          "description": "The obligation of parties to an armed conflict to take all possible measures, particularly after an engagement, to search for and collect the wounded and sick."
        },
        {
          "name": "Suspension of Fire",
          "type": "LEGAL_CONCEPT",
          "description": "An armistice or local arrangement to be made whenever circumstances permit, so that the wounded left on the battlefield can be removed, exchanged and transported."
        }
      ],
      "relationships": [
        {
          "source": "GC I Article 15",
          "target": "Geneva Convention I (1949)",
          "keywords": "treaty provision, instrument",
          "description": "GC I Article 15 is a provision of Geneva Convention I (1949); the article name is qualified with the instrument identified in the [Quelle:] header."
        },
        {
          "source": "GC I Article 15",
          "target": "Search and Collection of the Wounded",
          "keywords": "obligation, wounded and sick",
          "description": "GC I Article 15 establishes the obligation to search for and collect the wounded and sick without delay."
        },
        {
          "source": "GC I Article 15",
          "target": "Suspension of Fire",
          "keywords": "evacuation mechanism, armistice",
          "description": "GC I Article 15 provides for a suspension of fire, whenever circumstances permit, to enable the removal of the wounded."
        }
      ]
    }
