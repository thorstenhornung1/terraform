version: "3.8"

# =============================================================================
# Frigate 0.17 Beta Stack — GitOps managed via Portainer webhook
# =============================================================================
# NVR for 8 cameras with CPU detection, MQTT/Home Assistant integration.
#
# External dependencies:
#   - Traefik (traefik_public network) — TLS termination + routing
#   - Ceph RBD (/mnt/rbd/frigate-config) — /config (DB + model cache) on ext4
#   - CephFS (/mnt/cephfs/swarm-state/stack-frigate-beta/) — clips/thumbnails
#   - ZFS NFS mount (/srv/frigate-recordings) — video recordings on docker-infra-3
#   - Docker secrets: frigate_mqtt_*, frigate_garage_*, frigate_plus_*
#
# RBD volume (mapped + mounted via systemd on infra nodes):
#   /mnt/rbd/frigate-config — Ceph RBD block device (ext4), 10GB
#   Contains: /config/db/frigate.db + /config/model_cache/
#
# Docker secrets (create via Portainer UI or create-secrets.sh):
#   ./create-secrets.sh
#
# Access: https://frigate.beta.hornung-bn.de
# RTSP: rtsp://<docker-infra-3-ip>:8554/<camera>
# WebRTC: port 8555 TCP+UDP on docker-infra-3
# =============================================================================

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.0-rc3
    entrypoint: /config/entrypoint.sh
    volumes:
      - /mnt/rbd/frigate-config:/config
      - /mnt/cephfs/swarm-state/stack-frigate-beta/clips:/media/frigate/clips
      - /srv/frigate-recordings:/media/frigate/recordings
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 268435456
    # Note: tmpfs short-form and shm_size are ignored by Docker Swarm.
    # SHM for Frigate frame processing is configured as tmpfs volume mount below.
    configs:
      - source: frigate_config
        target: /config/config.yml
        mode: 0644
      - source: frigate_entrypoint
        target: /config/entrypoint.sh
        mode: 0755
    secrets:
      - frigate_mqtt_user
      - frigate_mqtt_password
      - frigate_garage_user
      - frigate_garage_password
      - frigate_garage_ip
      - frigate_garten_user
      - frigate_garten_password
      - frigate_garten_ip
      - frigate_doorbird_user
      - frigate_doorbird_password
      - frigate_doorbird_url
      - frigate_plus_api_key
      - frigate_plus_modelid
      - source: frigate_plus_modelid_2026.1
        target: frigate_plus_modelid_2026.1
    environment:
      TZ: Europe/Berlin
    ports:
      # RTSP restream — host mode for low-latency direct access
      - target: 8554
        published: 8554
        protocol: tcp
        mode: host
      # WebRTC — host mode for peer-to-peer connectivity
      - target: 8555
        published: 8555
        protocol: tcp
        mode: host
      - target: 8555
        published: 8555
        protocol: udp
        mode: host
    networks:
      - traefik_public
    healthcheck:
      # Test uvicorn directly (port 5001, 127.0.0.1 only) — not nginx (5000).
      # Detects event loop stalls from synchronous embedding operations.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.infra_node == 3
      labels:
        # Traefik HTTPS routing
        - traefik.enable=true
        - "traefik.http.routers.frigate-beta.rule=Host(`frigate.beta.hornung-bn.de`)"
        - traefik.http.routers.frigate-beta.entrypoints=websecure
        - traefik.http.routers.frigate-beta.tls=true
        - traefik.http.routers.frigate-beta.tls.certresolver=dns
        - traefik.http.services.frigate-beta.loadbalancer.server.port=5000
        # HTTP -> HTTPS redirect
        - "traefik.http.routers.frigate-beta-http.rule=Host(`frigate.beta.hornung-bn.de`)"
        - traefik.http.routers.frigate-beta-http.entrypoints=web
        - traefik.http.routers.frigate-beta-http.middlewares=frigate-redirect
        - traefik.http.middlewares.frigate-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.frigate-redirect.redirectscheme.permanent=true
      resources:
        limits:
          cpus: '4'
          memory: 4096M
        reservations:
          cpus: '1'
          memory: 1024M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 15s

configs:
  frigate_config:
    name: frigate_config_${CONFIG_HASH:-latest}
    file: ./config.yml
  frigate_entrypoint:
    name: frigate_entrypoint_${ENTRYPOINT_HASH:-latest}
    file: ./entrypoint.sh

secrets:
  frigate_mqtt_user:
    external: true
  frigate_mqtt_password:
    external: true
  frigate_garage_user:
    external: true
  frigate_garage_password:
    external: true
  frigate_garage_ip:
    external: true
  frigate_garten_user:
    external: true
  frigate_garten_password:
    external: true
  frigate_garten_ip:
    external: true
  frigate_doorbird_user:
    external: true
  frigate_doorbird_password:
    external: true
  frigate_doorbird_url:
    external: true
  frigate_plus_api_key:
    external: true
  frigate_plus_modelid:
    external: true
  frigate_plus_modelid_2026.1:
    external: true

networks:
  traefik_public:
    external: true
