# =============================================================================
# Frigate 0.17 RC3 Configuration — GitOps managed
# =============================================================================
# Environment variable substitution: entrypoint.sh resolves {ENVVAR} placeholders
# before Frigate starts (ruamel.yaml does NOT do native substitution).
#
# Secrets are mounted as individual Docker secrets and exported by entrypoint.sh:
#   frigate_mqtt_user        → {FRIGATE_MQTT_USER}
#   frigate_mqtt_password    → {FRIGATE_MQTT_PASSWORD}
#   frigate_garage_user      → {FRIGATE_GARAGE_USER}
#   frigate_garage_password  → {FRIGATE_GARAGE_PASSWORD}
#   frigate_garage_ip        → {FRIGATE_GARAGE_IP}  (includes port, e.g. 192.168.x.x:554)
#   frigate_garten_user      → {FRIGATE_GARTEN_USER}
#   frigate_garten_password  → {FRIGATE_GARTEN_PASSWORD}
#   frigate_garten_ip        → {FRIGATE_GARTEN_IP}
#   frigate_plus_api_key     → {FRIGATE_PLUS_API_KEY}
#   frigate_plus_modelid     → {FRIGATE_PLUS_MODELID}
# =============================================================================

mqtt:
  enabled: true
  host: 192.168.2.5
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
  client_id: frigate-beta
  topic_prefix: frigate

database:
  path: /config/db/frigate.db

detectors:
  apple_silicon:
    type: zmq
    endpoint: "tcp://192.168.2.236:5555"

# Frigate+ custom yolov9s 640x640 model with ZMQ support
# Model ID from Docker secret: frigate_plus_modelid_2026.1
# Downloaded via plus:// and transferred to Apple Silicon client via ZMQ.
# Model metadata (width, height, labelmap, model_type) auto-loaded from Frigate+ API.
model:
  path: "plus://{FRIGATE_PLUS_MODELID}"

ffmpeg:
  hwaccel_args: []
  output_args:
    record: preset-record-generic-audio-aac

record:
  enabled: true
  alerts:
    retain:
      days: 14
      mode: active_objects
  detections:
    retain:
      days: 2
      mode: active_objects
  continuous:
    days: 2
  motion:
    days: 2

snapshots:
  enabled: true
  retain:
    default: 28
    objects:
      person: 28
      car: 7
      dog: 7
      cat: 7
      bird: 7

detect:
  enabled: true
  width: 1280
  height: 720
  fps: 5

objects:
  track:
    # People
    - person
    - face

    # Vehicles
    - car
    - bicycle
    - motorcycle
    - license_plate
    - garbage_truck

    # Logos (Lieferdienste DE)
    - amazon
    - dhl
    - dpd
    - gls
    - fedex
    - ups
    - hermes        # Candidate Label - noch experimentell

    # Animals
    - dog
    - cat
    - deer
    - fox
    - raccoon
    - hedgehog      # Candidate Label - noch experimentell

    # Other
    - package
    - waste_bin
    - baby_stroller # Candidate Label - noch experimentell


semantic_search:
  enabled: true
  model_size: large

face_recognition:
  enabled: true
  model_size: large

lpr:
  enabled: true

classification:
  bird:
    enabled: false

# =============================================================================
# Cameras
# =============================================================================
# Each camera uses individual Docker secrets for credentials and IP.
# garage:   Reolink E1 Pro Outdoor — H.264 only (RTSP)
# garten:   Reolink CX810 4K 8MP  — H.265 main, H.264 sub (RTSP)
# doorbird: Doorbird D2101V        — MJPEG over HTTP
# =============================================================================

cameras:
  garage:
    ffmpeg:
      inputs:
        - path: "rtsp://{FRIGATE_GARAGE_USER}:{FRIGATE_GARAGE_PASSWORD}@{FRIGATE_GARAGE_IP}/h264Preview_01_sub"
          roles: [detect]
        - path: "rtsp://{FRIGATE_GARAGE_USER}:{FRIGATE_GARAGE_PASSWORD}@{FRIGATE_GARAGE_IP}/h264Preview_01_main"
          roles: [record]

  garten:
    ffmpeg:
      inputs:
        - path: "rtsp://{FRIGATE_GARTEN_USER}:{FRIGATE_GARTEN_PASSWORD}@{FRIGATE_GARTEN_IP}/h264Preview_01_sub"
          roles: [detect]
        - path: "rtsp://{FRIGATE_GARTEN_USER}:{FRIGATE_GARTEN_PASSWORD}@{FRIGATE_GARTEN_IP}/h265Preview_01_main"
          roles: [record]
    objects:
      filters:
        all:
          mask:
            - 0.661,0.044,0.671,0.279,0.782,0.285,0.777,0.033
            - 0.673,0.662,0.669,0.802,0.768,0.834,0.772,0.682


  doorbird:
    ffmpeg:
      inputs:
        - path: "http://{FRIGATE_DOORBIRD_USER}:{FRIGATE_DOORBIRD_PASSWORD}@{FRIGATE_DOORBIRD_URL}/bha-api/video.cgi"
          input_args: -f mpjpeg
          roles: [detect]
    detect:
      width: 1280
      height: 720
      fps: 2
    objects:
      mask: 0.45,0.992,0.462,0.007,0.004,0.002,-0.001,0.997
      filters:
        car:
          mask: 
            0.996,0.913,0.916,0.841,0.924,0.693,0.882,0.662,0.771,0.708,0.711,0.652,0.691,0.638,0.523,0.648,0.525,0.449,0.899,0.325,0.935,0.461,0.943,0.472,0.999,0.474
        person:
          mask: 
            0.996,0.913,0.916,0.841,0.924,0.693,0.882,0.662,0.771,0.708,0.711,0.652,0.691,0.638,0.523,0.648,0.525,0.449,0.899,0.325,0.935,0.461,0.943,0.472,0.999,0.474
