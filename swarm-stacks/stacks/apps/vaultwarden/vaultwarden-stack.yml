# =============================================================================
# Vaultwarden Stack — Self-Hosted Bitwarden-Compatible Password Manager
# =============================================================================
# Central secrets store for infrastructure credentials.
# PostgreSQL backend: Single-PG-VM postgres.hornung-bn.de:5432 (seit 2026-06-15;
# zuvor Patroni pg-haproxy:5433). DB-Host im entrypoint-wrapper.sh.
# CephFS /data for attachments/icons (auto-included in PBS backup).
#
# Access: https://vault.hornung-bn.de (internal only, DNS-01 cert)
# Admin:  https://vault.hornung-bn.de/admin (token-protected)
#
# Deployment:
#   1. Create secrets:  ./create-secrets.sh
#   2. Create DB:       Redeploy postgres-ha stack (db-init creates vaultwarden DB)
#   3. CephFS dir:      mkdir -p /mnt/cephfs/swarm-state/stack-vaultwarden/data
#   4. DNS entry:       vault.hornung-bn.de -> Traefik VIP (Technitium)
#   5. Deploy:          docker stack deploy -c vaultwarden-stack.yml vaultwarden
# =============================================================================

version: '3.8'

services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    hostname: vaultwarden
    networks:
      - traefik_public
      - postgres-ha-stack_postgres-network
    volumes:
      - /mnt/cephfs/swarm-state/stack-vaultwarden/data:/data
    secrets:
      - vaultwarden_admin_token
      - vaultwarden_db_password
    entrypoint: /entrypoint-wrapper.sh
    configs:
      - source: entrypoint_wrapper_${ENTRYPOINT_WRAPPER_HASH:-latest}
        target: /entrypoint-wrapper.sh
        mode: 0755
    environment:
      # Rocket web server
      ROCKET_PORT: "8080"
      # Security
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      LOG_LEVEL: "warn"
      # Domain (used for TOTP issuer, email links, etc.)
      DOMAIN: "https://vault.hornung-bn.de"
      # WebSocket notifications (for browser extension live sync)
      WEBSOCKET_ENABLED: "true"
      # Disable emergency access (not needed for infra secrets)
      EMERGENCY_ACCESS_ALLOWED: "false"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        # start-first bleibt bewusst: 256M-Footprint (Verdopplung harmlos),
        # Passwort-Manager bleibt waehrend Deploys erreichbar; schlaegt der
        # neue Task fehl, laeuft der alte weiter.
        order: start-first
        # pause statt rollback (swarm-stacks#90): Vaultwarden fuehrt beim Boot
        # Diesel-DB-Migrationen aus; rollback stellt nur das alte Binary
        # wieder her, nie das alte Schema — beim Credential-Store das
        # gefaehrlichste Silent-Mismatch. pause + rotes Gate statt Auto-Revert.
        failure_action: pause
        # monitor > healthcheck.start_period (30s); Default 5s waere die
        # reisekosten-v2.10.1-Falle.
        monitor: 60s
      labels:
        # --- Traefik Network (required: multi-network service) ---
        - traefik.swarm.network=traefik_public
        # --- Traefik HTTPS Router ---
        - traefik.enable=true
        - "traefik.http.routers.vaultwarden.rule=Host(`vault.hornung-bn.de`)"
        - traefik.http.routers.vaultwarden.entrypoints=websecure
        - traefik.http.routers.vaultwarden.tls=true
        - traefik.http.routers.vaultwarden.tls.certresolver=dns
        - traefik.http.services.vaultwarden.loadbalancer.server.port=8080
        # --- HTTP -> HTTPS Redirect ---
        - "traefik.http.routers.vaultwarden-http.rule=Host(`vault.hornung-bn.de`)"
        - traefik.http.routers.vaultwarden-http.entrypoints=web
        - traefik.http.routers.vaultwarden-http.middlewares=vaultwarden-redirect
        - traefik.http.middlewares.vaultwarden-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.vaultwarden-redirect.redirectscheme.permanent=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/alive || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  traefik_public:
    external: true
  postgres-ha-stack_postgres-network:
    external: true

# =============================================================================
# CONFIGS
# =============================================================================
configs:
  entrypoint_wrapper_${ENTRYPOINT_WRAPPER_HASH:-latest}:
    file: ./entrypoint-wrapper.sh

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  vaultwarden_admin_token:
    external: true
  vaultwarden_db_password:
    external: true
