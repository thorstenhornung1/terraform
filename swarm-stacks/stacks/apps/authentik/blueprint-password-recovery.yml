# =============================================================================
# Authentik-Blueprint: Passwort-Wiederherstellung ("Passwort vergessen")
# =============================================================================
# Wird über eine Docker Config nach /blueprints/custom/ gemountet und vom
# authentik-worker automatisch importiert.
#
# WARUM DAS HIER FUNKTIONIERT
#   Authentik hat KEINE LDAP-Source (Import) — geprüft am 2026-08-16:
#   authentik_sources_ldap_ldapsource ist leer. Der authentik-ldap-outpost
#   geht in die Gegenrichtung und STELLT LDAP für andere Dienste bereit.
#   Authentik ist damit die Quelle der Wahrheit für Passwörter, und ein Reset
#   hier wirkt auf alles, was daran hängt. Bei umgekehrter Richtung wäre der
#   Flow weitgehend wirkungslos, weil das neue Passwort nicht ins Verzeichnis
#   zurückgeschrieben würde.
#
# ⚠️ NOCH ZU TUN NACH DEM IMPORT (in der UI, ein Feld):
#   System -> Brands -> <Brand> -> Recovery flow = "Passwort zuruecksetzen"
#   Erst dann erscheint der "Passwort vergessen"-Link auf der Anmeldeseite.
#   Bewusst nicht im Blueprint: Ein falsch identifizierter Brand legt einen
#   NEUEN an, statt den bestehenden zu ändern — das Risiko lohnt für ein
#   Dropdown nicht.
#
# ⚠️ WAS DIESER FLOW BEDEUTET
#   Wer Zugriff auf ein Postfach hat, kann damit das zugehörige Konto
#   übernehmen — das ist der Preis jedes "Passwort vergessen". Der Flow läuft
#   zudem mit require_unauthenticated und ist damit öffentlich erreichbar:
#   Jeder, der eine Kennung errät, kann eine Mail auslösen (Belästigung, kein
#   Datenleck — der Link geht an die echte Adresse). recovery_max_attempts
#   begrenzt das auf 5 Versuche.
#   Wer das härten will: Authentiks Beispiel
#   flows-recovery-email-mfa-verification.yaml schiebt eine MFA-Abfrage vor
#   den Passwort-Prompt.
# =============================================================================

version: 1
metadata:
  name: Hornung - Passwort-Wiederherstellung
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ---------------------------------------------------------------------------
  # Der Flow
  # ---------------------------------------------------------------------------
  # designation: recovery macht ihn für das Brand-Feld "Recovery flow"
  # auswählbar. require_unauthenticated ist Absicht — wer sein Passwort
  # vergessen hat, kann sich per Definition nicht anmelden.
  - identifiers:
      slug: password-recovery
    id: recovery-flow
    model: authentik_flows.flow
    attrs:
      name: Passwort zuruecksetzen
      title: Passwort zuruecksetzen
      designation: recovery
      authentication: require_unauthenticated

  # ---------------------------------------------------------------------------
  # 1. Identification — setzt den pending_user
  # ---------------------------------------------------------------------------
  # Ohne diese Stage bricht die Email-Stage mit "No pending user" ab
  # (stages/email/stage.py:153) — dieselbe Falle wie beim
  # Verifikations-Flow. Hier ist die Abfrage ohnehin zwingend: Der Benutzer
  # ist nicht angemeldet, also muss er sagen, um wessen Konto es geht.
  - identifiers:
      name: hornung-recovery-identification
    id: recovery-identification
    model: authentik_stages_identification.identificationstage
    attrs:
      user_fields:
        - email
        - username

  # ---------------------------------------------------------------------------
  # 2. Email — verschickt den Rücksetz-Link
  # ---------------------------------------------------------------------------
  # use_global_settings übernimmt AUTHENTIK_EMAIL__* aus dem Stack
  # (192.168.4.71, Absender homelab@hornung-bn.de — verifiziert per
  # `ak test_email`, Relay meldete status=sent 250 OK).
  - identifiers:
      name: hornung-recovery-email
    id: recovery-email
    model: authentik_stages_email.emailstage
    attrs:
      use_global_settings: true
      subject: Passwort zuruecksetzen
      template: email/password_reset.html
      token_expiry: minutes=30
      # Ein deaktiviertes Konto soll ein Passwort-Reset NICHT stillschweigend
      # reaktivieren — wer gesperrt ist, bleibt gesperrt.
      activate_user_on_success: false
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=5

  # ---------------------------------------------------------------------------
  # 3. Neues Passwort
  # ---------------------------------------------------------------------------
  - identifiers:
      name: hornung-recovery-field-password
    id: recovery-field-password
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password
      label: Neues Passwort
      type: password
      required: true
      placeholder: Neues Passwort
      placeholder_expression: false
      order: 0

  - identifiers:
      name: hornung-recovery-field-password-repeat
    id: recovery-field-password-repeat
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password_repeat
      label: Neues Passwort (Wiederholung)
      type: password
      required: true
      placeholder: Neues Passwort (Wiederholung)
      placeholder_expression: false
      order: 1

  # Die Feldnamen password / password_repeat sind nicht frei gewählt —
  # Authentik prüft dieses Paar auf Übereinstimmung.
  - identifiers:
      name: hornung-recovery-prompt-password
    id: recovery-prompt-password
    model: authentik_stages_prompt.promptstage
    attrs:
      fields:
        - !KeyOf recovery-field-password
        - !KeyOf recovery-field-password-repeat
      validation_policies: []

  # ---------------------------------------------------------------------------
  # 4. Schreiben
  # ---------------------------------------------------------------------------
  # never_create: Ein Recovery-Flow darf unter keinen Umständen neue Konten
  # anlegen — sonst wäre er eine offene Registrierung.
  - identifiers:
      name: hornung-recovery-user-write
    id: recovery-user-write
    model: authentik_stages_user_write.userwritestage
    attrs:
      user_creation_mode: never_create

  # ---------------------------------------------------------------------------
  # 5. Anmelden
  # ---------------------------------------------------------------------------
  # Nach erfolgreichem Reset direkt einloggen — sonst müsste der Benutzer das
  # eben gesetzte Passwort sofort erneut eintippen.
  - identifiers:
      name: hornung-recovery-user-login
    id: recovery-user-login
    model: authentik_stages_user_login.userloginstage

  # ---------------------------------------------------------------------------
  # Reihenfolge
  # ---------------------------------------------------------------------------
  # Die attrs entsprechen dem mitgelieferten Beispiel
  # flows-recovery-email-verification.yaml. invalid_response_action: retry
  # sorgt dafür, dass eine Fehleingabe die Stage wiederholt, statt den
  # gesamten Flow abzubrechen.
  - identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-identification
      order: 10
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry

  - identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-email
      order: 20
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry

  - identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-prompt-password
      order: 30
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry

  - identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-user-write
      order: 40
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry

  - identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-user-login
      order: 100
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
