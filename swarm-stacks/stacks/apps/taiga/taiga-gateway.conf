server {
    listen 80 default_server;
    server_name _;

    # Docker Swarm internal DNS resolver (lazy resolution)
    resolver 127.0.0.11 valid=10s;

    large_client_header_buffers 4 32k;
    client_max_body_size 100M;
    charset utf-8;

    # Frontend (Angular SPA)
    location / {
        set $upstream_front http://taiga-front:80;
        proxy_pass $upstream_front;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Backend API
    location /api/ {
        set $upstream_back http://taiga-back:8000;
        proxy_pass $upstream_back;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django Admin
    location /admin/ {
        set $upstream_admin http://taiga-back:8000;
        proxy_pass $upstream_admin;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static files (served by backend during collectstatic)
    location /static/ {
        alias /taiga-static/;
    }

    # Media files (protected via taiga-protected service)
    location /_protected/ {
        internal;
        alias /taiga-media/;
        add_header Content-Disposition "attachment";
    }

    # Attachments proxy to taiga-protected
    location /media/ {
        set $upstream_protected http://taiga-protected:8003;
        proxy_pass $upstream_protected;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebSocket Events
    location /events/ {
        set $upstream_events http://taiga-events:8888;
        proxy_pass $upstream_events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
