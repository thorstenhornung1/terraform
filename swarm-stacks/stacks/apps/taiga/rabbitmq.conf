# RabbitMQ-Konfiguration fuer Taiga (Single-Node-Broker)
#
# transient_nonexcl_queues: Ab RabbitMQ 4.3 ist dieses Deprecated Feature
# per Default DENIED -> Boot-Fail "failed_to_deny_deprecated_features".
# Celery/kombu (taiga-async) deklariert transiente non-exclusive Queues
# (celeryev.*, celery@...pidbox), daher muss das Feature explizit erlaubt
# werden. Siehe RabbitMQ 4.3.0 Release Notes / Deprecated Features.
# Langfristig entfaellt das Feature in einem kuenftigen Major-Release;
# dann muss Celery auf durable/quorum-kompatible Queues umgestellt werden.
deprecated_features.permit.transient_nonexcl_queues = true
