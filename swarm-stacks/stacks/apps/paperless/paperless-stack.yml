# =============================================================================
# Paperless-ngx Stack — Document Management System
# =============================================================================
# Deploy: GitOps via ssh-deploy (webhooks.conf, migrated 2026-04-21 from Portainer-Webhook).
# Self-hosted document management with OCR, tagging, and full-text search.
# PostgreSQL backend via Patroni HA cluster (pg-haproxy:5433).
# Valkey (Redis-compatible) for task queue and caching.
# Tika + Gotenberg for advanced document parsing.
# CephFS for all persistent data (auto-included in PBS backup).
#
# Access: https://paperless.hornung-bn.de
#
# Consumer: Built-in via supervisord (PAPERLESS_CONSUMER_POLLING=30).
#   Drop files into /mnt/cephfs/swarm-state/stack-paperless/consume/
#
# Deployment:
#   1. Create secrets:  paperless_db_password, paperless_secret_key (Portainer)
#   2. Create DB:       Redeploy postgres-ha stack (db-init creates paperless DB)
#   3. CephFS dirs:     mkdir -p /mnt/cephfs/swarm-state/stack-paperless/{data,media,export,consume}
#                        chown -R 1000:1000 /mnt/cephfs/swarm-state/stack-paperless
#   4. DNS entry:       paperless.hornung-bn.de -> Traefik VIP (Technitium)
#   5. Deploy:          Portainer Repository mode + Webhook
#   6. Superuser:       docker exec -it $(docker ps -qf name=paperless-webserver) \
#                          python3 manage.py createsuperuser
# =============================================================================

version: '3.8'

services:
  paperless-webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    hostname: paperless-webserver
    entrypoint: ["/bin/bash", "/oidc-init.sh"]
    environment:
      # Database
      PAPERLESS_DBENGINE: postgresql
      # Single-PG-VM postgres-prod (seit 2026-06-15, zuvor Patroni pg-haproxy:5433)
      PAPERLESS_DBHOST: postgres.hornung-bn.de
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_db_password
      # Cache / Task Queue
      PAPERLESS_REDIS: "redis://valkey:6379/0"
      # Tika + Gotenberg
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://gotenberg:3000"
      PAPERLESS_TIKA_ENDPOINT: "http://tika:9998"
      # Application
      PAPERLESS_URL: "https://paperless.hornung-bn.de"
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      PAPERLESS_TIME_ZONE: "Europe/Berlin"
      # SMTP via Homelab-Mail-Relay (Variante C) — keine Auth, From=homelab@ (Pflicht). Siehe docs/MAIL-RELAY.md.
      PAPERLESS_EMAIL_HOST: "192.168.4.71"
      PAPERLESS_EMAIL_PORT: "587"
      PAPERLESS_EMAIL_USE_TLS: "false"
      PAPERLESS_EMAIL_USE_SSL: "false"
      PAPERLESS_EMAIL_FROM: "homelab@hornung-bn.de"
      # OCR
      PAPERLESS_OCR_LANGUAGE: "deu+eng"
      # 3.0: 'skip' entfernt (W003); 'auto' ist das dokumentierte Äquivalent
      # (Image mappt skip->auto intern, settings/__init__.py:920). Gültig:
      # auto | force | redo | off.
      PAPERLESS_OCR_MODE: "auto"
      # Consumer
      PAPERLESS_CONSUMER_POLLING: "30"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      # File naming — BEWUSST old-style Syntax: Docker Swarm expandiert
      # {{ ... }} in Env-Werten als Go-Template und lehnt den Service-Update ab
      # ("function created_year not defined", verifiziert 2026-08-09). Die
      # Paperless-Deprecation-Warnung ist der kleinere Preis; Migration erst,
      # wenn Paperless old-style droppt (dann via Escaping oder Config-File).
      PAPERLESS_FILENAME_FORMAT: "{created_year}/{correspondent}/{title}"
      # Performance
      PAPERLESS_TASK_WORKERS: "2"
      PAPERLESS_THREADS_PER_WORKER: "2"
      # SSO via Authentik (OIDC)
      PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      PAPERLESS_ACCOUNT_DEFAULT_GROUPS: "family"
      PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS: "family"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
      # --- Natives KI/RAG (Paperless 3.0, aktiviert 2026-08-08) ---
      # LLM UND Embeddings via Mac-Studio-Ollama (192.168.2.236:11434, v0.32.0).
      # ⚠️ SPOF: Ollama down = stiller RAG-Ausfall — kein KI-Chat, keine
      # Indexierung NEUER Dokumente (bekanntes Muster, siehe LightRAG).
      # Kern-Betrieb (Web/OCR/Consume/Suche) läuft davon unberührt weiter.
      # Nightly-Index-Update: PAPERLESS_LLM_INDEX_TASK_CRON, Default 02:10.
      # Settings-Namen/Choices verifiziert aus 3.0.5-Image (settings/__init__.py).
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: "ollama"              # gültig: ollama | openai-like
      PAPERLESS_AI_LLM_ENDPOINT: "http://192.168.2.236:11434"
      PAPERLESS_AI_LLM_MODEL: "phi4"
      # Klartext statt ISO-Code: Chat injiziert den Wert roh ("Respond in German."),
      # der Klassifizierer lässt unbekannte Codes unverändert durchfallen.
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: "German"
      # Embeddings nativ via Ollama (kein HuggingFace-Download im Container)
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "ollama"    # gültig: ollama | openai-like | huggingface
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: "http://192.168.2.236:11434"
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: "bge-m3"      # 1024-dim, wie LightRAG
      # 600s (statt 120s Default): Die Mac-Studio-GPU ist von phi4
      # (LightRAG-Ingest, paperless-ai) belegt; bge-m3-Embedding-Batches
      # queuen dahinter. 180s riss beim Index-Rebuild 2026-08-08 nach
      # ~20 min mit httpx.ReadTimeout ab (unbehandelt -> Rebuild-Abbruch).
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "600"
      # User mapping
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
    volumes:
      - /mnt/cephfs/swarm-state/stack-paperless/data:/usr/src/paperless/data
      - /mnt/cephfs/swarm-state/stack-paperless/media:/usr/src/paperless/media
      - /mnt/cephfs/swarm-state/stack-paperless/export:/usr/src/paperless/export
      - /mnt/cephfs/swarm-state/stack-paperless/consume:/usr/src/paperless/consume
      - /mnt/cephfs/swarm-state/stack-paperless/oidc-init.sh:/oidc-init.sh:ro
    secrets:
      - paperless_db_password
      - paperless_secret_key
      - paperless_oidc_client_id
      - paperless_oidc_client_secret
    networks:
      - traefik_public
      - postgres-ha-stack_postgres-network
      - valkey-stack_valkey-network
      - default
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        # stop-first (statt start-first): Bei 1 Replica verdoppelt start-first
        # den RAM-/Reservation-Bedarf während des Rollouts (2x 512M Reservation
        # + 2x realer Startbedarf) — genau daran scheiterten am 2026-08-08 zwei
        # Rollouts (early termination/OOM + Ersatz-Task "no suitable node" ->
        # Rollback). Kurze Downtime pro Deploy ist der Preis; verhindert zudem
        # zwei parallel laufende Webserver während DB-Migrationen.
        order: stop-first
        # pause (statt rollback): Ein Swarm-Rollback rollt DB-Migrationen NIE
        # mit zurück — so lief am 2026-08-08 morgens 2.20.15 gegen das schon
        # migrierte 3.0.5-Schema (InconsistentMigrationHistory, Produktions-
        # ausfall, Issue #90). pause hält den Zustand für Vorwärts-Reparatur
        # an, statt alten Code auf neues Schema loszulassen.
        failure_action: pause
        # monitor > healthcheck.start_period (600s): sonst wertet Swarm den
        # langsamen (Major-Upgrade-)Start als Fehlschlag. 2026-08-08: 330s
        # reichten beim 2.20->3.0-Sprung nicht (Image-Pull + Migrationen).
        # 660s = 60s Marge über start_period.
        monitor: 660s
      labels:
        # --- Traefik Network (required: multi-network service) ---
        - traefik.swarm.network=traefik_public
        # --- Traefik HTTPS Router ---
        - traefik.enable=true
        - "traefik.http.routers.paperless.rule=Host(`paperless.hornung-bn.de`)"
        - traefik.http.routers.paperless.entrypoints=websecure
        - traefik.http.routers.paperless.tls=true
        - traefik.http.routers.paperless.tls.certresolver=dns
        - traefik.http.services.paperless.loadbalancer.server.port=8000
        # --- HTTP -> HTTPS Redirect ---
        - "traefik.http.routers.paperless-http.rule=Host(`paperless.hornung-bn.de`)"
        - traefik.http.routers.paperless-http.entrypoints=web
        - traefik.http.routers.paperless-http.middlewares=paperless-redirect
        - traefik.http.middlewares.paperless-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.paperless-redirect.redirectscheme.permanent=true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 600s (statt 300s): Major-Version-Upgrades führen beim Erststart DB-Migrationen
      # aus; 90s reichten beim 2.15→2.20-Sprung nicht, 300s nicht beim 2.20→3.0-Sprung
      # (Squash-Migrationen + Task-System-Redesign + Tantivy-Index-Neuaufbau bei
      # ~12k Dokumenten). 600s deckt den Migrations-/Reindex-Erststart ab.
      start_period: 600s

  tika:
    image: apache/tika:3.3.1.0
    hostname: tika
    networks:
      - default
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9998' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gotenberg:
    image: gotenberg/gotenberg:8.17
    hostname: gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
      - "--api-timeout=120s"
    networks:
      - default
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # paperless-ai — AI-Companion (Titel/Überschrift, Tags, Typ, Korrespondent + RAG-Chat)
  # Brücke bis Paperless-NGX 3 native AI mitbringt. LLM = phi4 via Ollama @ Mac Studio.
  # ⚠️ Die phi4-GPU ist parallel vom LightRAG-Ingest belegt (~1 Woche) -> Analyse langsam.
  # Setup nach Deploy: https://paperlessai.hornung-bn.de -> Wizard ->
  #   Paperless-API-Token (Paperless: Einstellungen -> API-Token) + Provider/Modell bestätigen.
  # ---------------------------------------------------------------------------
  paperless-ai:
    image: clusterzx/paperless-ai:3.0.9
    hostname: paperless-ai
    # Wrapper injiziert PAPERLESS_API_TOKEN aus dem Swarm-Secret, dann Original-Start.
    entrypoint: ["/bin/sh", "/paperless-ai-entrypoint.sh"]
    environment:
      PUID: "1000"
      PGID: "1000"
      PAPERLESS_AI_PORT: "3000"
      RAG_SERVICE_URL: "http://localhost:8000"
      RAG_SERVICE_ENABLED: "true"
      # Paperless-API (interner Overlay-Service im selben Stack-Netz)
      PAPERLESS_API_URL: "http://paperless-webserver:8000/api"
      PAPERLESS_USERNAME: "admin"   # User des API-Tokens -> behebt "Failed to get own user ID" (headless)
      # Öffentliche Basis-URL: für die RAG-Komponente (Doc-Fetch) UND für anklickbare Dokument-Links
      # in Chat/UI. Container erreicht sie via Traefik-Hairpin (verifiziert HTTP 302). Ohne dies
      # Default-Platzhalter https://your-paperless-instance bzw. interne, nicht klickbare Links.
      PAPERLESS_URL: "https://paperless.hornung-bn.de"
      # LLM: Ollama (phi4) @ Mac Studio, VLAN4 -> VLAN2 via UDM-Pro (gleicher Pfad wie lightrag)
      AI_PROVIDER: "ollama"
      OLLAMA_API_URL: "http://192.168.2.236:11434"
      OLLAMA_MODEL: "phi4"
      # --- Funktions-Umfang: vorerst NUR Titel/Überschrift setzen ---
      # (Tags/Korrespondent/Dokumenttyp/Custom-Fields bewusst AUS, User-Wunsch 2026-06-27)
      ACTIVATE_TITLE: "yes"
      ACTIVATE_TAGGING: "no"
      ACTIVATE_CORRESPONDENTS: "no"
      ACTIVATE_DOCUMENT_TYPE: "no"
      ACTIVATE_CUSTOM_FIELDS: "no"
      # PAPERLESS_API_TOKEN -> vom Wrapper aus /run/secrets/paperless_ai_api_token (Swarm-Secret)
      TZ: "Europe/Berlin"
    volumes:
      - /mnt/cephfs/swarm-state/stack-paperless-ai/data:/app/data
    configs:
      - source: paperless_ai_entrypoint_${PAPERLESS_AI_ENTRYPOINT_HASH:-latest}
        target: /paperless-ai-entrypoint.sh
        mode: 0555
    secrets:
      - paperless_ai_api_token
    networks:
      - default
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == true
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.1'
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        # stop-first PFLICHT: Single-Writer (SQLite documents.db + chromadb auf CephFS).
        # start-first würde zwei Writer parallel laufen lassen -> Lock-Konflikt/Korruption + 2/1-Stau.
        order: stop-first
      labels:
        - traefik.swarm.network=traefik_public
        - traefik.enable=true
        - "traefik.http.routers.paperless-ai.rule=Host(`paperlessai.hornung-bn.de`)"
        - traefik.http.routers.paperless-ai.entrypoints=websecure
        - traefik.http.routers.paperless-ai.tls=true
        - traefik.http.routers.paperless-ai.tls.certresolver=dns
        - traefik.http.services.paperless-ai.loadbalancer.server.port=3000
        - "traefik.http.routers.paperless-ai-http.rule=Host(`paperlessai.hornung-bn.de`)"
        - traefik.http.routers.paperless-ai-http.entrypoints=web
        - traefik.http.routers.paperless-ai-http.middlewares=paperless-ai-redirect
        - traefik.http.middlewares.paperless-ai-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.paperless-ai-redirect.redirectscheme.permanent=true

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  default:
    driver: overlay
  traefik_public:
    external: true
  postgres-ha-stack_postgres-network:
    external: true
  valkey-stack_valkey-network:
    external: true

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  paperless_db_password:
    external: true
  paperless_secret_key:
    external: true
  paperless_oidc_client_id:
    external: true
  paperless_oidc_client_secret:
    external: true
  paperless_ai_api_token:
    external: true

# =============================================================================
# CONFIGS (Content-Hash via deploy-stacks.yml: paperless-ai-entrypoint.sh -> PAPERLESS_AI_ENTRYPOINT_HASH)
# =============================================================================
configs:
  paperless_ai_entrypoint_${PAPERLESS_AI_ENTRYPOINT_HASH:-latest}:
    file: ./paperless-ai-entrypoint.sh
