# =============================================================================
# Samba Configuration — Paperless File Server
# =============================================================================
# Shares:
#   [Posteingang] — Drop documents for Paperless consume (family group, r/w)
#   [Archiv]      — Read-only access to Paperless archive (thorsten.hornung)
#
# Authentication: tdbsam (NT-Hashes synced from Authentik via API)
# User/Group resolution: SSSD → Authentik LDAP Outpost
# Security: SMB3 minimum, encryption desired, no NetBIOS
# macOS/iOS: vfs fruit module for Finder compatibility
# =============================================================================

[global]
   workgroup = SOWI10
   server string = Paperless File Server
   server role = standalone server
   security = user

   # NT-Hash authentication via local tdbsam (synced from Authentik API)
   passdb backend = tdbsam

   # PAM settings (SSSD for account check, NOT for auth)
   obey pam restrictions = yes
   unix password sync = no
   pam password change = no

   log file = /var/log/samba/log.%m
   max log size = 50

   # Network
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3
   smb encrypt = desired

   # macOS/iOS compatibility
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacPro7,1
   fruit:nfs_aces = no

   # CephFS-compatible locking
   kernel oplocks = no
   posix locking = yes

   # No printers
   load printers = no
   printing = bsd
   printcap name = /dev/null

[Posteingang]
   comment = Dokumente einwerfen (Paperless Consume)
   path = /shares/Posteingang
   browseable = yes
   read only = no
   valid users = @family
   force user = paperless
   force group = paperless
   create mask = 0664
   directory mask = 0775

[Archiv]
   comment = Paperless Archiv (nur lesen)
   path = /shares/Archiv
   browseable = yes
   read only = yes
   valid users = thorsten.hornung
   force user = paperless
   force group = paperless
