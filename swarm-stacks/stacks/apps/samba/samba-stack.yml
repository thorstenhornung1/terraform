# =============================================================================
# Samba Stack — Paperless File Sharing via SMB
# =============================================================================
# Provides SMB shares for Paperless-ngx document management:
#   \\files.hornung-bn.de\Posteingang — Drop documents (family group, r/w)
#   \\files.hornung-bn.de\Archiv      — Read Paperless archive (thorsten.hornung)
#
# Authentication: tdbsam (NT-Hashes synced from Authentik API every 5 min)
# User/Group resolution: Local (no SSSD, no LDAP Outpost dependency)
# CephFS volumes shared with Paperless stack (same UID/GID 1000).
#
# Access: smb://files.hornung-bn.de (DNS → 192.168.4.40 / docker-infra-1)
#
# Prerequisites:
#   1. Authentik Expression Policy 'samba-nt-hash-sync' bound to password flows
#   2. Docker Secret: samba_authentik_api_token
#   3. DNS: files.hornung-bn.de → 192.168.4.40
#   4. CephFS dirs: /mnt/cephfs/swarm-state/stack-paperless/{consume,media}
#
# Deployment: ssh-deploy (Docker Config content-hash for smb.conf)
# =============================================================================

services:
  samba:
    image: ghcr.io/thorstenhornung1/swarm-stacks/samba-authentik:latest
    hostname: samba
    configs:
      - source: smb_conf_${SMB_HASH:-latest}
        target: /etc/samba/smb.conf
        mode: 0644
    secrets:
      - samba_authentik_api_token
    environment:
      AUTHENTIK_URL: "https://auth.hornung-bn.de"
      AUTHENTIK_TOKEN_FILE: "/run/secrets/samba_authentik_api_token"
      SAMBA_USERS: "thorsten.hornung,stephanie.hornung,helena.hornung"
      PAPERLESS_UID: "1000"
      PAPERLESS_GID: "1000"
      FAMILY_GID: "2000"
    volumes:
      - /mnt/cephfs/swarm-state/stack-paperless/consume:/shares/Posteingang
      - /mnt/cephfs/swarm-state/stack-paperless/media/documents/archive:/shares/Archiv:ro
    ports:
      - target: 445
        published: 445
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first
        failure_action: continue
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/445' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

configs:
  smb_conf_${SMB_HASH:-latest}:
    file: ./smb.conf

secrets:
  samba_authentik_api_token:
    external: true
